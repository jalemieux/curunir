services:
  curunir:
    build: .
    env_file: .env
    ports:
      - "8765:8765"
    volumes:
      - ./secrets:/secrets:ro              # OAuth tokens, credentials (read-only)
      - ./workspace:/app/workspace         # Workspace persistence
      - ./context:/app/context             # Context/memory (sync with ./sync-context.sh before starting)
    restart: unless-stopped
