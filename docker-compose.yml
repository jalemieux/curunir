services:
  postgres:
    image: postgres:16-alpine
    profiles: ["portal"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  portal:
    image: ghcr.io/jalemieux/curunir-portal:${PORTAL_TAG:-latest}
    profiles: ["portal"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./portal/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/portal
      # Dev-only seed: portal upserts this user with this exact container
      # token on startup when DEBUG=true. Lets curunir authenticate without
      # a manual `python -m portal.admin create-user` step. The default
      # token here MUST match curunir's CURUNIR_PORTAL_TOKEN default below.
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-dev@example.com}
      SEED_CONTAINER_TOKEN: ${CURUNIR_PORTAL_TOKEN:-dev-seed-token-change-me}
    ports:
      - "8000:8000"

  curunir:
    image: ghcr.io/jalemieux/curunir:${CURUNIR_TAG:-latest}
    env_file: .env
    # Soft dep: when the portal profile is active, wait for portal to start
    # so curunir doesn't burn through reconnect attempts during startup.
    # `required: false` keeps curunir startable without the portal profile.
    depends_on:
      portal:
        condition: service_started
        required: false
    environment:
      # In-network portal URL; override via .env if needed.
      CURUNIR_PORTAL_URL: ${CURUNIR_PORTAL_URL:-ws://portal:8000/ws/agent}
      # Matches portal's SEED_CONTAINER_TOKEN default — both services agree
      # on `dev-seed-token-change-me` unless overridden in .env. Override
      # CURUNIR_PORTAL_TOKEN in .env and the portal seed picks up the same
      # value via interpolation above.
      CURUNIR_PORTAL_TOKEN: ${CURUNIR_PORTAL_TOKEN:-dev-seed-token-change-me}
      # Lives on the workspace volume so the introspection skill and
      # `docker exec curunir tail -f /app/workspace/curunir.log` can
      # read agent activity from inside the container. RotatingFileHandler
      # in run.py caps it at 10MB × 3 backups.
      LOG_FILE: ${LOG_FILE:-/app/workspace/curunir.log}
      # Bind 0.0.0.0 inside the container so the host's published port
      # reaches the server. Docker network isolation + the pairing token
      # written to /app/context/.ws-token are the actual access controls.
      # Override the publish line below to `127.0.0.1:8765:8765` to keep
      # the port off your LAN.
      WS_HOST: ${WS_HOST:-0.0.0.0}
    ports:
      - "8765:8765"
    volumes:
      - ./secrets:/secrets:ro              # OAuth tokens, credentials (read-only)
      - ./workspace:/app/workspace         # Workspace persistence
      - ./context:/app/context             # Context/memory (sync with ./sync-context.sh before starting)
    restart: unless-stopped

volumes:
  portal-postgres-data:
