services:
  postgres:
    image: postgres:16-alpine
    profiles: ["portal", "portal-local"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  portal:
    image: ghcr.io/jalemieux/curunir-portal:${PORTAL_TAG:-latest}
    profiles: ["portal"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./portal/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/portal
      # Dev-only seed: portal upserts this user with this exact container
      # token on startup when DEBUG=true. Lets curunir authenticate without
      # a manual `python -m portal.admin create-user` step. The default
      # token here MUST match curunir's CURUNIR_PORTAL_TOKEN default below.
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-dev@example.com}
      SEED_CONTAINER_TOKEN: ${CURUNIR_PORTAL_TOKEN:-dev-seed-token-change-me}
    ports:
      - "8000:8000"

  # Local profile: a personal, single-user portal running alongside curunir.
  # `docker compose --profile portal-local up` brings up postgres +
  # portal-local + curunir. PORTAL_MODE=local seeds one user and drops the
  # magic-link/admin surface; the browser surface has no per-request auth, so
  # the port is published on localhost only. Point curunir at it by setting
  # CURUNIR_PORTAL_URL=ws://portal-local:8000/ws/agent in the root .env.
  portal-local:
    image: ghcr.io/jalemieux/curunir-portal:${PORTAL_TAG:-latest}
    profiles: ["portal-local"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./portal/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/portal
      PORTAL_MODE: local
      # Seeded local user. Its container token must match the token curunir
      # dials with (CURUNIR_PORTAL_TOKEN, or CURUNIR_PORTAL_INTERNAL_TOKEN in
      # a multi-portal setup) — both default to `dev-seed-token-change-me`
      # unless overridden in the root .env.
      LOCAL_CONTAINER_TOKEN: ${CURUNIR_PORTAL_TOKEN:-dev-seed-token-change-me}
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-local@curunir}
    ports:
      # Bind to localhost only — the local profile has no per-request auth.
      - "127.0.0.1:8000:8000"

  curunir:
    image: ghcr.io/jalemieux/curunir:${CURUNIR_TAG:-latest}
    env_file: .env
    # Soft dep: when a portal profile is active, wait for the portal to start
    # so curunir doesn't burn through reconnect attempts during startup.
    # `required: false` keeps curunir startable without any portal profile.
    depends_on:
      portal:
        condition: service_started
        required: false
      portal-local:
        condition: service_started
        required: false
    environment:
      # In-network portal URL; override via .env if needed.
      CURUNIR_PORTAL_URL: ${CURUNIR_PORTAL_URL:-ws://portal:8000/ws/agent}
      # Matches portal's SEED_CONTAINER_TOKEN default — both services agree
      # on `dev-seed-token-change-me` unless overridden in .env. Override
      # CURUNIR_PORTAL_TOKEN in .env and the portal seed picks up the same
      # value via interpolation above.
      CURUNIR_PORTAL_TOKEN: ${CURUNIR_PORTAL_TOKEN:-dev-seed-token-change-me}
      # Lives on the workspace volume so the introspection skill and
      # `docker exec curunir tail -f /app/workspace/curunir.log` can
      # read agent activity from inside the container. RotatingFileHandler
      # in run.py caps it at 10MB × 3 backups.
      LOG_FILE: ${LOG_FILE:-/app/workspace/curunir.log}
    ports:
      - "8765:8765"
    volumes:
      - ./secrets:/secrets:ro              # OAuth tokens, credentials (read-only)
      - ./workspace:/app/workspace         # Workspace persistence
      - ./context:/app/context             # Context/memory (sync with ./sync-context.sh before starting)
    restart: unless-stopped

volumes:
  portal-postgres-data:
