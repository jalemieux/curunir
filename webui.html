<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curunir</title>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"
        integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.5/dist/purify.min.js"
        integrity="sha384-7FXQySTrDscwsLx1i8RIqZM/JHoUVstx4CuL2b7tziI4Glhp3/3dm/j3qUTheVXE"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
        integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
        crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
      integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH"
      crossorigin="anonymous">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; color: #ccc; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace; height: 100vh; display: flex; flex-direction: column; }

/* Bottom workflow bar */
.workflow-bar {
  display: flex; align-items: center; padding: 5px 16px; background: #06060a; border-top: 1px solid #1a1a22; gap: 6px; font-size: 11px; flex-shrink: 0;
}
.workflow-bar .step { color: #444; transition: color 0.2s; }
.workflow-bar .step.completed { color: #4ade80; }
.workflow-bar .step.active { color: #6366f1; font-weight: bold; border-bottom: 1px solid #6366f1; padding-bottom: 1px; }
.workflow-bar .arrow { color: #222; font-size: 10px; }
.workflow-bar .dot { font-size: 8px; }

/* Main area */
.main { display: flex; flex: 1; min-height: 0; }

/* Left pane: chat */
.chat-pane {
  flex: 1; display: flex; flex-direction: column; border-right: 1px solid #1a1a22; min-width: 0;
}
.chat-header {
  padding: 10px 14px; border-bottom: 1px solid #1a1a22; background: #08080e; font-size: 12px; color: #444;
}
.chat-header .title { color: #ccc; font-weight: bold; }
.chat-header .persona-tag {
  display: none; margin-left: 8px; padding: 1px 6px; border-radius: 4px;
  border: 1px solid #6b521f; color: #c4923a; font-size: 10px; font-weight: 600;
  letter-spacing: 0.3px; vertical-align: middle;
}
.chat-header .meta { color: #333; font-size: 10px; margin-top: 2px; }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
}
.msg-user { color: #4ade80; }
.msg-user .prompt { font-weight: bold; }
.msg-tool { color: #555; font-size: 11px; }
.msg-tool .connector { color: #333; }
.msg-assistant { color: #e0e0e0; line-height: 1.6; font-size: 12px; }
.msg-assistant code { background: #1a1a2e; padding: 1px 5px; border-radius: 3px; font-size: 11px; }
.msg-assistant pre { background: #1a1a2e; border-radius: 6px; padding: 10px; margin: 6px 0; overflow-x: auto; font-size: 11px; line-height: 1.4; }
.msg-assistant pre code { background: none; padding: 0; }
.msg-assistant h3 { color: #fff; font-size: 13px; margin: 8px 0 4px; }
.msg-assistant ul { padding-left: 18px; margin: 4px 0; }
.msg-assistant li { margin: 2px 0; }
.msg-attachment { display: inline-flex; align-items: center; gap: 4px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 4px; padding: 3px 8px; font-size: 10px; color: #6366f1; cursor: pointer; margin-top: 4px; }
.msg-attachment:hover { border-color: #6366f1; }

.chat-input {
  padding: 10px 14px; border-top: 1px solid #1a1a22; background: #08080e; display: flex; align-items: center; gap: 6px;
}
.chat-input .prompt { color: #4ade80; font-weight: bold; font-size: 14px; }
.chat-input input {
  flex: 1; background: transparent; border: none; outline: none; color: #e0e0e0; font-family: inherit; font-size: 13px; caret-color: #4ade80;
}

/* Right pane: artifacts */
.artifact-pane {
  flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0d0d14;
}
.artifact-tree {
  padding: 8px 12px; border-bottom: 1px solid #1a1a22; background: #08080e; font-size: 11px; line-height: 1.9; flex-shrink: 0; cursor: default;
}
.artifact-tree .label { color: #444; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.artifact-tree .folder { color: #e2b55a; cursor: pointer; }
.artifact-tree .folder-toggle { color: #444; font-size: 10px; margin-right: 2px; }
.artifact-tree .file { color: #666; cursor: pointer; padding-left: 18px; border-left: 2px solid transparent; margin-left: -12px; padding-left: 28px; }
.artifact-tree .file:hover { color: #999; }
.artifact-tree .file.active { color: #6366f1; font-weight: bold; border-left-color: #6366f1; background: rgba(99, 102, 241, 0.06); }

.artifact-content {
  flex: 1; overflow-y: auto; padding: 16px 20px;
}
.artifact-content .doc-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 10px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.artifact-content .doc-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #bbb; line-height: 1.7; }
.artifact-content .doc-body h2 { color: #e0e0e0; font-size: 15px; margin: 16px 0 6px; }
.artifact-content .doc-body p { margin: 6px 0; }
.artifact-content .doc-body ul { padding-left: 20px; margin: 6px 0; }
.artifact-content .doc-body li { margin: 3px 0; }
.artifact-content .doc-body code { background: #1a1a2e; padding: 1px 5px; border-radius: 3px; font-family: 'SF Mono', monospace; font-size: 12px; }
.artifact-content .doc-body pre { background: #1a1a2e; border-radius: 6px; padding: 12px; margin: 8px 0; overflow-x: auto; }
.artifact-content .doc-body pre code { background: none; padding: 0; font-size: 11px; line-height: 1.5; color: #8be9fd; }
.artifact-content .doc-body table { border-collapse: collapse; margin: 8px 0; width: 100%; }
.artifact-content .doc-body th, .artifact-content .doc-body td { border: 1px solid #222; padding: 6px 10px; text-align: left; font-size: 12px; }
.artifact-content .doc-body th { background: #1a1a2e; color: #ccc; }
.artifact-content .doc-body strong { color: #fff; }

/* Spinner */
.spinner { display: inline-block; color: #06b6d4; font-size: 11px; }
.spinner::after { content: "Thinking…"; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

/* Resize handle */
.resize-handle { width: 4px; background: #1a1a22; cursor: col-resize; flex-shrink: 0; }
.resize-handle:hover { background: #6366f1; }
</style>
</head>
<body>
  <div class="main">
    <div class="chat-pane">
      <div class="chat-header">
        <div class="title">Curunir<span class="persona-tag"></span></div>
        <div class="meta"><span class="model-info"></span> <span class="connection-status"></span></div>
      </div>
      <div class="chat-messages"></div>
      <div class="chat-input">
        <span class="prompt">&gt;</span>
        <input type="text" placeholder="Type a message..." autofocus>
      </div>
    </div>
    <div class="resize-handle"></div>
    <div class="artifact-pane">
      <div class="artifact-tree">
        <div class="label">workspace/</div>
      </div>
      <div class="artifact-content">
        <div style="color:#555;text-align:center;padding:40px;">No artifacts yet</div>
      </div>
    </div>
  </div>
  <div class="workflow-bar" style="display:none"></div>
<script>
// ── Boot guard ───────────────────────────────────────────────────────────────
// Refuse to render if DOMPurify failed to load (SRI failure, blocked CDN, etc.)
// Without it, marked output would reach innerHTML unsanitized — XSS risk.
if (typeof DOMPurify === 'undefined' || typeof marked === 'undefined') {
    document.body.innerHTML =
        '<div style="padding:40px;color:#f87171;font-family:monospace;font-size:13px;line-height:1.6;">' +
        '<strong style="color:#fff;">Curunir failed to start.</strong><br><br>' +
        'A required script (marked or DOMPurify) did not load. This can happen if ' +
        'the CDN is unreachable or a Subresource Integrity check failed.<br><br>' +
        'Rendering is disabled to avoid showing unsanitized content. Check the ' +
        'browser console and reload.' +
        '</div>';
    throw new Error('Curunir: required library missing (marked or DOMPurify); refusing to render.');
}

// ── Configuration and state ──────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const host = params.get('host') || 'localhost';
const port = params.get('port') || '8765';
const uri = `ws://${host}:${port}`;

const BACKOFF_BASE = 1000;
const BACKOFF_MAX = 30000;
let ws = null;
let backoffDelay = BACKOFF_BASE;
let attempt = 0;
let pendingPayload = null;
let ready = true;
let verbose = true;

// Artifact state
const artifacts = new Map();
let selectedArtifact = null;

// Workflow state
let currentWorkflow = null;

// DOM references
const messagesEl = document.querySelector('.chat-messages');
const input = document.querySelector('.chat-input input');

// ── Connection management ────────────────────────────────────────────────────
function connect() {
    ws = new WebSocket(uri);
    ws.onopen = () => {
        if (attempt > 0) addSystemMessage(`Reconnected to ${uri}`);
        backoffDelay = BACKOFF_BASE;
        if (pendingPayload) {
            ws.send(JSON.stringify(pendingPayload));
            pendingPayload = null;
            ready = false;
            showSpinner();
        }
        updateConnectionStatus(true);
    };
    ws.onclose = () => {
        updateConnectionStatus(false);
        addSystemMessage(`Disconnected from ${uri}. Reconnecting...`);
        attempt++;
        setTimeout(connect, backoffDelay);
        backoffDelay = Math.min(backoffDelay * 2, BACKOFF_MAX);
        ready = true;
        hideSpinner();
    };
    ws.onmessage = (event) => handleMessage(JSON.parse(event.data));
}

// ── Message handler ──────────────────────────────────────────────────────────
function handleMessage(data) {
    hideSpinner();
    if ('model' in data || 'persona' in data) {
        if ('model' in data) setModelInfo(data.model);
        if ('persona' in data) setPersona(data.persona);
        return;
    }
    if (data.tool_calls?.length) handleToolCalls(data.tool_calls);
    if (data.content) handleContent(data.content);
    if (data.attachments?.length) handleAttachments(data.attachments);
    if (data.workflow) handleWorkflow(data.workflow);
    if (data.final) { ready = true; updateInputState(); }
}

// ── Input handling ───────────────────────────────────────────────────────────
input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !ready) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    if (text === '/verbose') {
        verbose = !verbose;
        addSystemMessage(`Verbose mode ${verbose ? 'on' : 'off'}.`);
        return;
    }

    let payload;
    if (text === '/clear' || text === '/new') {
        payload = { content: '', command: 'clear' };
        clearChat();
        clearArtifacts();
        clearWorkflow();
    } else {
        payload = { content: text, command: null };
    }

    addUserMessage(text);

    try {
        ws.send(JSON.stringify(payload));
    } catch {
        pendingPayload = payload;
        return;
    }

    ready = false;
    updateInputState();
    showSpinner();
});

// ── Chat rendering ───────────────────────────────────────────────────────────
function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.innerHTML = '<span class="prompt">&gt; </span>' + escapeHtml(text);
    messagesEl.appendChild(div);
    scrollToBottom();
}

function addSystemMessage(text) {
    const div = document.createElement('div');
    div.style.color = '#e2b55a';
    div.style.fontSize = '11px';
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
}

function handleToolCalls(toolCalls) {
    if (!verbose) return;
    for (const tc of toolCalls) {
        const div = document.createElement('div');
        div.className = 'msg-tool';
        div.innerHTML = '<span class="connector">\u251c\u2500</span> ' + escapeHtml(tc);
        messagesEl.appendChild(div);
    }
    scrollToBottom();
}

function handleContent(content) {
    // Update last tool call connector to ╯─
    if (verbose) {
        const toolDivs = messagesEl.querySelectorAll('.msg-tool');
        if (toolDivs.length > 0) {
            const last = toolDivs[toolDivs.length - 1];
            const connector = last.querySelector('.connector');
            if (connector && connector.textContent === '\u251c\u2500') {
                connector.textContent = '\u256f\u2500';
            }
        }
    }
    const div = document.createElement('div');
    div.className = 'msg-assistant';
    div.innerHTML = renderMarkdown(content);
    // Apply syntax highlighting
    div.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    messagesEl.appendChild(div);
    scrollToBottom();
}

function showSpinner() {
    hideSpinner();
    const div = document.createElement('div');
    div.className = 'spinner';
    div.id = 'thinking-spinner';
    messagesEl.appendChild(div);
    scrollToBottom();
}

function hideSpinner() {
    const el = document.getElementById('thinking-spinner');
    if (el) el.remove();
}

function updateInputState() {
    input.style.opacity = ready ? '1' : '0.4';
    input.placeholder = ready ? 'Type a message...' : 'Waiting for response...';
}

function setModelInfo(model) {
    const el = document.querySelector('.model-info');
    el.textContent = `model: ${model}  ·  ${uri}`;
}

function setPersona(persona) {
    const el = document.querySelector('.persona-tag');
    if (persona) {
        el.textContent = persona;
        el.style.display = 'inline-block';
    } else {
        el.textContent = '';
        el.style.display = 'none';
    }
}

function updateConnectionStatus(connected) {
    const el = document.querySelector('.connection-status');
    if (connected) {
        el.innerHTML = '<span style="color:#4ade80">●</span>';
    } else {
        el.innerHTML = '<span style="color:#e2b55a">●</span>';
    }
}

function clearChat() {
    messagesEl.innerHTML = '';
}

function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Sanitize marked output before it touches innerHTML. Default DOMPurify
// profile strips <script>, event-handler attrs, javascript: URLs, etc.
function renderMarkdown(src) {
    return DOMPurify.sanitize(marked.parse(src ?? ''), { USE_PROFILES: { html: true } });
}

// ── Artifact handling ────────────────────────────────────────────────────────
function handleAttachments(attachments) {
    for (const att of attachments) {
        artifacts.set(att.path, {
            filename: att.filename,
            content: att.content || null,
            mime_type: att.mime_type,
        });
        // Add attachment chip to chat
        const chip = document.createElement('span');
        chip.className = 'msg-attachment';
        chip.textContent = '\ud83d\udcc4 ' + att.filename;
        chip.onclick = () => selectArtifact(att.path);
        const wrapper = document.createElement('div');
        wrapper.appendChild(chip);
        messagesEl.appendChild(wrapper);
    }
    rebuildTree();
    if (attachments.length > 0) {
        selectArtifact(attachments[attachments.length - 1].path);
    }
    scrollToBottom();
}

function rebuildTree() {
    const tree = {};
    for (const [path] of artifacts) {
        const parts = path.split('/');
        let node = tree;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!node[parts[i]]) node[parts[i]] = {};
            node = node[parts[i]];
        }
        node[parts[parts.length - 1]] = path; // leaf = full path string
    }
    const container = document.querySelector('.artifact-tree');
    container.innerHTML = '<div class="label">workspace/</div>';
    renderTreeNode(tree, container, 0);
}

function renderTreeNode(node, parent, depth) {
    const entries = Object.entries(node).sort(([a, va], [b, vb]) => {
        const aIsFolder = typeof va === 'object';
        const bIsFolder = typeof vb === 'object';
        if (aIsFolder !== bIsFolder) return aIsFolder ? -1 : 1;
        return a.localeCompare(b);
    });

    for (const [name, value] of entries) {
        if (typeof value === 'object') {
            // Folder
            const fileCount = Object.values(value).filter(v => typeof v === 'string').length;
            const folderDiv = document.createElement('div');
            folderDiv.style.paddingLeft = (depth * 16) + 'px';
            let expanded = true;
            const toggle = document.createElement('span');
            toggle.className = 'folder-toggle';
            toggle.textContent = '\u25be';
            const label = document.createElement('span');
            label.className = 'folder';
            label.textContent = ' ' + name + '/';
            const badge = document.createElement('span');
            badge.style.cssText = 'color:#333;font-size:9px;margin-left:4px;';
            badge.textContent = fileCount > 0 ? fileCount + ' file' + (fileCount > 1 ? 's' : '') : '';
            badge.style.display = 'none';

            const childContainer = document.createElement('div');

            folderDiv.appendChild(toggle);
            folderDiv.appendChild(label);
            folderDiv.appendChild(badge);
            parent.appendChild(folderDiv);
            parent.appendChild(childContainer);

            const toggleFolder = () => {
                expanded = !expanded;
                toggle.textContent = expanded ? '\u25be' : '\u25b8';
                childContainer.style.display = expanded ? '' : 'none';
                badge.style.display = expanded ? 'none' : '';
            };
            toggle.onclick = toggleFolder;
            label.onclick = toggleFolder;

            renderTreeNode(value, childContainer, depth + 1);
        } else {
            // File
            const fileDiv = document.createElement('div');
            fileDiv.className = 'file';
            fileDiv.dataset.path = value;
            fileDiv.textContent = name;
            fileDiv.style.paddingLeft = (depth * 16 + 28) + 'px';
            fileDiv.onclick = () => selectArtifact(value);
            if (value === selectedArtifact) fileDiv.classList.add('active');
            parent.appendChild(fileDiv);
        }
    }
}

function selectArtifact(path) {
    selectedArtifact = path;
    // Update tree highlighting
    document.querySelectorAll('.artifact-tree .file').forEach(el => {
        el.classList.toggle('active', el.dataset.path === path);
    });
    // Render content
    const content = document.querySelector('.artifact-content');
    const artifact = artifacts.get(path);
    if (!artifact?.content) {
        content.innerHTML = '<div style="color:#555;text-align:center;padding:40px;">No content available</div>';
        return;
    }
    content.innerHTML = '';
    const body = document.createElement('div');
    body.className = 'doc-body';
    body.innerHTML = renderMarkdown(artifact.content);
    content.appendChild(body);
    // Apply syntax highlighting to code blocks
    content.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
}

function clearArtifacts() {
    artifacts.clear();
    selectedArtifact = null;
    document.querySelector('.artifact-tree').innerHTML = '<div class="label">workspace/</div>';
    document.querySelector('.artifact-content').innerHTML =
        '<div style="color:#555;text-align:center;padding:40px;">No artifacts yet</div>';
}

// ── Workflow bar ─────────────────────────────────────────────────────────────
function handleWorkflow(workflow) {
    currentWorkflow = workflow;
    const bar = document.querySelector('.workflow-bar');
    bar.style.display = 'flex';
    bar.innerHTML = '<span class="dot" style="color:#4ade80;">\u25cf</span>';

    const currentIdx = workflow.steps.indexOf(workflow.current);
    workflow.steps.forEach((step, i) => {
        if (i > 0) {
            const arrow = document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '\u2192';
            bar.appendChild(arrow);
        }
        const span = document.createElement('span');
        span.className = 'step';
        if (i < currentIdx) span.classList.add('completed');
        if (i === currentIdx) span.classList.add('active');
        span.textContent = step;
        bar.appendChild(span);
    });
}

function clearWorkflow() {
    currentWorkflow = null;
    const bar = document.querySelector('.workflow-bar');
    bar.style.display = 'none';
    bar.innerHTML = '';
}

// ── Resize handle ────────────────────────────────────────────────────────────
const resizeHandle = document.querySelector('.resize-handle');
const chatPane = document.querySelector('.chat-pane');
const artifactPane = document.querySelector('.artifact-pane');
let isResizing = false;

resizeHandle.addEventListener('mousedown', (e) => {
    isResizing = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const container = document.querySelector('.main');
    const containerRect = container.getBoundingClientRect();
    const minWidth = 300;
    let newLeft = e.clientX - containerRect.left;
    newLeft = Math.max(minWidth, Math.min(newLeft, containerRect.width - minWidth));
    const leftPct = (newLeft / containerRect.width) * 100;
    chatPane.style.flex = 'none';
    chatPane.style.width = leftPct + '%';
    artifactPane.style.flex = '1';
});

document.addEventListener('mouseup', () => {
    if (isResizing) {
        isResizing = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    }
});

// ── Init ─────────────────────────────────────────────────────────────────────
// Configure marked to use highlight.js
marked.setOptions({
    highlight: (code, lang) => {
        if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
    },
});

// Start connection
connect();
input.focus();
</script>
</body>
</html>
