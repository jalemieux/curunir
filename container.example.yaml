# Example container manifest (agents-and-containers).
#
# Select it with CURUNIR_CONTAINER=container.yaml. Without that variable the
# process runs today's one-agent container synthesized from CURUNIR_PERSONA.
#
# One process hosts every agent listed here. Each agent is a persona bundle
# (personas/<persona>/) plus its own private context dir under context/;
# context/ itself is the shared area (workspace deliverables, uploads, the
# usage ledger, the pairing token, email state).
name: home

agents:
  # The legacy agent keeps context/ as its context (`context: .`), so an
  # existing deployment gains siblings without moving a single file. It is
  # the default: it receives every message that names no agent, and email.
  - name: everyday
    persona: default
    context: .
    default: true

  # persona defaults to the agent name; context defaults to agents/<name>,
  # i.e. context/agents/finance/{identity.md,memory/,conversations/,schedules.db}.
  - name: finance
    # Optional: when siblings should route a request to this agent. Replaces
    # the persona's own `handles:` line (personas/<persona>/persona.yaml) in
    # their ask_agent / handoff tool descriptions, so routing can be tuned for
    # this mix of agents without editing the persona.
    # handles: Questions about the household's money, including the mortgage.

# Who may send to this container and where its messages may go. `user` must
# be in both. Naming another container requires a `peers` entry whose
# token_env is set (the shared secret for that pair; a missing one fails
# boot). An outbound container is a target of the agents' one-way `handoff`
# tool (which also reaches sibling agents in a multi-agent container); an
# inbound container starts the peer listener (PEER_HOST/PEER_PORT, default
# 127.0.0.1:8767) and requires `user_delivery`: the channel (portal |
# local_web | email) where this container answers a handoff. The answer goes
# to the user, never back to the sender. See docker-compose.fleet.example.yml.
inbound: [user]
outbound: [user]
# peers:
#   vault:
#     url: http://vault:8767
#     token_env: PEER_VAULT_TOKEN
#     # Optional: what the container is for, shown to the handoff tool.
#     description: Private finance and medical records.
# user_delivery: portal
