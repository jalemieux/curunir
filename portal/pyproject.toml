[project]
name = "curunir-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "starlette>=0.49.1",
  "uvicorn[standard]>=0.29",
  "h11>=0.16.0",
  "asyncpg>=0.29",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.18",
  "pydantic-settings>=2.2",
  "websockets>=12.0",
  "python-frontmatter>=1.1",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "anyio>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
