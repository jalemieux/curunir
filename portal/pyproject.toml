[project]
name = "curunir-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  # CVE floors. These are security minimums, not preferences — a lock refresh
  # alone fixes today and silently regresses on the next resolution. Keep them
  # in sync with the note in .github/workflows/refresh-portal-lock.yml.
  #   h11>=0.16.0             CVE-2025-43859  request smuggling
  #   starlette>=1.3.1        CVE-2026-54283  form() limits ignored on
  #                                           x-www-form-urlencoded -> DoS
  #                           CVE-2026-54282  path concatenated into authority
  #   python-multipart>=0.0.31
  #                           CVE-2026-53539  quadratic querystring parse -> DoS
  #                           CVE-2026-53540  negative Content-Length buffering
  #                           CVE-2026-53538/53537  parameter smuggling
  #   pydantic-settings>=2.14.2
  #                           CVE-2026-58203  secrets_dir symlink escape
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.29",
  "h11>=0.16.0",
  "asyncpg>=0.29",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.31",
  "pydantic-settings>=2.14.2",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "anyio>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
