<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curunir</title>
<script>
  // Apply persisted theme before paint to avoid a flash.
  (function () {
    var t = localStorage.getItem("curunir-theme") || "light";
    if (t !== "light" && t !== "dark") t = "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cronstrue@2.50.0/dist/cronstrue.min.js"></script>
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #ffffff;
  --fg: #1a1a1f;
  --user: #16a34a;
  --tool: #6b7280;
  --muted: #d1d5db;
  --accent: #4f46e5;
  --bubble: #f4f4f8;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --header-text: #6b7280;
  --hint: #9ca3af;
  --code-bg: #f3f4f6;
  --btn-disabled-bg: #e5e7eb;
  --btn-disabled-fg: #9ca3af;
  --hover-bg: #f3f4f6;
  --system-text: #9ca3af;
  --offline: #9ca3af;
  --hover-fg: #1a1a1f;
  --stop: #dc2626;
  --stop-hover: #b91c1c;
}
[data-theme="dark"] {
  --bg: #0a0a12;
  --fg: #e0e0e0;
  --user: #4ade80;
  --tool: #555;
  --muted: #444;
  --accent: #6366f1;
  --bubble: #12121c;
  --border: #1a1a22;
  --border-strong: #2a2a3e;
  --header-text: #888;
  --hint: #555;
  --code-bg: #1a1a2e;
  --btn-disabled-bg: #2a2a3e;
  --btn-disabled-fg: #666;
  --hover-bg: #1a1a2e;
  --system-text: #666;
  --offline: #555;
  --hover-fg: #ffffff;
  --stop: #f87171;
  --stop-hover: #fca5a5;
}
html, body { height: 100dvh; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  display: flex;
}
/* The chat column (header + messages + composer). On mobile it is the only
   visible region; on desktop it sits to the right of the sidebar. */
#app {
  flex: 1; min-width: 0; height: 100dvh;
  display: flex; flex-direction: column;
}
/* Desktop-only conversation sidebar — hidden on mobile per #164. */
#sidebar { display: none; }
.sidebar-head {
  padding: 12px 14px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--header-text); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#conversation-list { flex: 1; overflow-y: auto; }
.conv-row {
  position: relative; padding: 9px 12px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}
.conv-row:hover { background: var(--bubble); }
.conv-row.active {
  background: var(--bubble);
  box-shadow: inset 2px 0 0 var(--accent);
}
.conv-title {
  font-size: 13px; font-weight: 600; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding-right: 18px;
}
.conv-meta { font-size: 11px; color: var(--header-text); }
.conv-del {
  position: absolute; right: 6px; top: 7px;
  width: 18px; height: 18px; padding: 0; line-height: 1;
  background: transparent; border: none; cursor: pointer;
  color: var(--header-text); font-size: 13px; opacity: 0;
}
.conv-row:hover .conv-del { opacity: 0.55; }
.conv-del:hover { opacity: 1; color: var(--accent); }
.conv-empty {
  padding: 14px; font-size: 12px; color: var(--header-text);
}
@media (min-width: 768px) {
  #sidebar {
    display: flex; flex-direction: column;
    width: 264px; flex-shrink: 0; height: 100dvh;
    border-right: 1px solid var(--border);
  }
}
header {
  padding: 8px 14px; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--header-text);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.header-right { display: flex; align-items: center; gap: 12px; }
.header-btn {
  background: transparent; border: 1px solid var(--border-strong); border-radius: 4px;
  color: var(--header-text); padding: 4px 10px; font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.header-btn:hover { color: var(--accent); border-color: var(--accent); }
.header-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#theme-btn {
  width: 28px; height: 24px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; line-height: 1;
}
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot.online { background: var(--user); }
.dot.offline { background: var(--offline); }
.dot.reconnecting { background: #e2b55a; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }

main {
  flex: 1; overflow-y: auto;
  padding: 14px;
  max-width: 720px; width: 100%; margin: 0 auto;
}
.msg { margin-bottom: 14px; line-height: 1.6; overflow-wrap: anywhere; }
.msg .role { display: none; }
.msg.user .body {
  background: var(--bubble);
  border-radius: 14px;
  padding: 10px 14px;
  margin-left: 80px;
  white-space: pre-wrap;
}
.msg.user .body code.slash-cmd {
  background: var(--code-bg); padding: 1px 6px; border-radius: 4px;
  font-size: 12.5px; font-weight: 600;
}
.msg.assistant .body { padding: 2px 0; }
.msg.assistant .body > p { margin: 0 0 8px; }
.msg.assistant .body > p:last-child { margin-bottom: 0; }
.msg.assistant .body h1,
.msg.assistant .body h2,
.msg.assistant .body h3 {
  font-weight: 600; margin: 18px 0 8px;
}
.msg.assistant .body h1 { font-size: 17px; }
.msg.assistant .body h2 { font-size: 15px; }
.msg.assistant .body h3 { font-size: 14px; }
.msg.assistant .body > h1:first-child,
.msg.assistant .body > h2:first-child,
.msg.assistant .body > h3:first-child { margin-top: 4px; }
.msg.assistant .body ul,
.msg.assistant .body ol { padding-left: 20px; margin: 6px 0 10px; }
.msg.assistant .body li { margin-bottom: 6px; }
.msg.assistant .body table {
  border-collapse: collapse; width: 100%;
  margin: 8px 0 12px;
  font-size: 13px;
}
.msg.assistant .body th,
.msg.assistant .body td {
  padding: 8px 0;
  text-align: left; vertical-align: top;
  border-bottom: 1px solid var(--border);
}
.msg.assistant .body th {
  font-weight: 600; font-size: 11px; color: var(--header-text);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border-strong);
}
.msg.assistant .body td:first-child {
  font-weight: 600; padding-right: 16px;
}
.msg.assistant .body td:first-child code {
  white-space: nowrap; overflow-wrap: normal; word-break: keep-all;
}
.msg.assistant .body code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: 12.5px; }
.msg.assistant .body pre { background: var(--code-bg); border-radius: 6px; padding: 10px; margin: 6px 0; overflow-x: auto; font-size: 12px; line-height: 1.4; }
.msg.assistant .body pre code { background: none; padding: 0; }
.msg.assistant .body a { color: var(--accent); }
.msg.assistant .body blockquote {
  border-left: 2px solid var(--border-strong);
  padding-left: 12px; color: var(--header-text);
  margin: 6px 0 10px;
}

/* Activity indicator — a unified element rendered after .body for every
   assistant turn. During a live turn (.live class) it shows a pulsing pill
   ([● Thinking]) and the current tool name to its right. Clicking either
   expands the full list of tool calls so far. On m.final the .live class
   drops and the summary collapses to a static count chip ("3 tools"). */
.msg details.tools { margin: 8px 0 2px; }
.msg details.tools > summary { list-style: none; cursor: pointer; user-select: none; outline: none; }
.msg details.tools > summary::-webkit-details-marker { display: none; }

/* Live state — pill + tool-current */
.msg details.tools.live .activity-row {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 2px 0;
  font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  font-size: 12px;
}
.msg details.tools.live .pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 11px 4px 9px;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  transition: border-color .12s;
}
.msg details.tools.live > summary:hover .pill { border-color: var(--border-strong); }
.msg details.tools.live .pill-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
  animation: pill-pulse 1.6s ease-in-out infinite;
}
.msg details.tools.live .pill-label,
.msg details.tools.live .tool-current {
  background: linear-gradient(90deg,
    var(--header-text) 35%, var(--fg) 50%, var(--header-text) 65%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  animation: pill-shimmer 2.2s linear infinite;
}
.msg details.tools.live .tool-current {
  max-width: 360px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  animation-delay: .2s;
}
.msg details.tools.live .tool-current:empty { display: none; }
.msg details.tools.live .activity-row .ticker-caret { margin-left: 2px; }
.msg details.tools.live:not(.has-tools) .ticker-caret { display: none; }
.msg details.tools.live:not(.has-tools) > summary { cursor: default; }

/* Historical / post-final state — static count chip */
.msg details.tools .ticker {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 0;
  font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  font-size: 11.5px; color: var(--header-text);
}
.msg details.tools .ticker-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); opacity: 0.6; flex-shrink: 0;
}
.msg details.tools .ticker-count {
  color: var(--header-text); font-size: 10.5px;
  padding: 1px 6px; background: var(--code-bg); border-radius: 4px; flex-shrink: 0;
}
.msg details.tools .ticker-caret {
  font-size: 8px; color: var(--header-text);
  transition: transform 0.15s ease;
}
.msg details.tools[open] .ticker-caret { transform: rotate(90deg); }

.msg details.tools .tool-list {
  margin: 6px 0 4px 8px;
  padding-left: 12px;
  border-left: 1px solid var(--border);
  font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  font-size: 11.5px; color: var(--tool); line-height: 1.7;
}
.msg details.tools .tool-line {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

@keyframes pill-pulse {
  0%, 100% { transform: scale(0.7); opacity: 0.4; }
  50%      { transform: scale(1.1); opacity: 1; }
}
@keyframes pill-shimmer { to { background-position: -250% 0; } }
@media (prefers-reduced-motion: reduce) {
  .msg details.tools.live .pill-dot { animation: none; opacity: 0.8; }
  .msg details.tools.live .pill-label,
  .msg details.tools.live .tool-current {
    animation: none; color: var(--header-text);
    -webkit-text-fill-color: var(--header-text);
  }
}
.system-msg { color: var(--system-text); }

/* Per-response action row — Copy / Print below each finalized assistant
   bubble. Re-appended after streaming completes so it sits last, beneath
   any tool ticker or attachments. flex-wrap prevents mobile overflow. */
.msg.assistant .response-actions {
  display: flex; flex-wrap: wrap; gap: 6px;
  max-width: 100%; margin-top: 8px;
}
.msg.assistant .response-actions .resp-action {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--header-text);
  font-family: inherit; font-size: 11.5px;
  padding: 3px 9px; border-radius: 6px;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.msg.assistant .response-actions .resp-action:hover {
  background: var(--hover-bg);
  color: var(--accent);
  border-color: var(--accent);
}
.msg.assistant .response-actions .resp-action:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.msg.assistant .response-actions .resp-action:disabled {
  cursor: default; opacity: 0.7;
}

/* Print target — hidden on screen; the @media print block below shows only
   this element, styled black-on-white for paper regardless of portal theme.
   printResponse() fills it with a copy of the response's rendered markdown. */
#print-doc { display: none; }
@media print {
  body > *:not(#print-doc) { display: none !important; }
  @page { margin: 1.6cm; }
  #print-doc {
    display: block !important;
    color: #000; background: #fff;
    font-size: 12pt; line-height: 1.5;
  }
  #print-doc h1 { font-size: 18pt; }
  #print-doc h2 { font-size: 15pt; }
  #print-doc h3 { font-size: 13pt; }
  #print-doc h1, #print-doc h2, #print-doc h3 { margin: 16px 0 8px; }
  #print-doc p { margin: 0 0 8px; }
  #print-doc ul, #print-doc ol { padding-left: 22px; margin: 6px 0 10px; }
  #print-doc li { margin-bottom: 4px; }
  #print-doc pre {
    background: #f3f4f6; border-radius: 4px; padding: 10px; margin: 8px 0;
    font-size: 10pt; white-space: pre-wrap; word-break: break-word;
  }
  #print-doc code {
    background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 10pt;
  }
  /* hljs token spans carry dark-theme colors when the portal is in dark
     mode — force legible dark-on-light so code prints readable either way. */
  #print-doc pre code, #print-doc pre code * {
    background: none !important; color: #1a1a1f !important;
  }
  #print-doc table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  #print-doc th, #print-doc td {
    border-bottom: 1px solid #ccc; padding: 6px 8px 6px 0;
    text-align: left; vertical-align: top;
  }
  #print-doc a { color: #000; text-decoration: underline; }
  #print-doc img { max-width: 100%; }
  #print-doc blockquote {
    border-left: 3px solid #ccc; padding-left: 12px;
    color: #333; margin: 8px 0;
  }
}

/* === Empty-state conversation starters === */
/* Shown inside #messages when a conversation has no messages yet: a static
   greeting plus one clickable starter per portal-enabled skill. */
.empty-state {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.es-greeting {
  font-size: 18px; font-weight: 600; color: var(--fg);
  margin-bottom: 22px;
}
.es-list {
  display: flex; flex-direction: column; gap: 2px;
  width: 100%; max-width: 400px;
}
.es-starter {
  display: flex; align-items: baseline; gap: 10px;
  padding: 9px 12px; border-radius: 8px; cursor: pointer;
  transition: background .12s;
}
.es-starter:hover { background: var(--hover-bg); }
.es-arrow { color: var(--hint); flex: none; font-size: 13px; }
.es-text { font-size: 13.5px; color: var(--fg); line-height: 1.4; }
.es-starter:hover .es-text,
.es-starter:hover .es-arrow { color: var(--accent); }

.attachment {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--code-bg); border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 3px 8px; font-size: 11px; color: var(--accent);
}
.attachment-card {
  display: inline-flex; align-items: center; gap: 11px;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 10px 13px;
  min-width: min(290px, 100%); max-width: 380px;
  transition: border-color .12s, background .12s;
}
.attachment-card.downloadable { cursor: pointer; }
.attachment-card.downloadable:hover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 5%, transparent);
}
.attachment-card .badge {
  width: 34px; height: 34px; border-radius: 7px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
}
.attachment-card .meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.attachment-card .fname {
  font-size: 13px; font-weight: 600; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.attachment-card .fsub { font-size: 11px; color: var(--hint); margin-top: 1px; }
.attachment-card .dl { color: var(--hint); flex: none; }
.attachment-card.downloadable:hover .dl { color: var(--accent); }
.attachment-image {
  display: block; max-width: min(320px, 100%); max-height: 320px;
  border-radius: 10px; border: 1px solid var(--border-strong);
  cursor: pointer; transition: border-color .12s;
}
.attachment-image:hover { border-color: var(--accent); }
.attachments { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.msg.user .body .attachments { margin-bottom: 6px; }
.msg.assistant .attachments { margin-top: 6px; }

footer {
  padding: 10px 14px 14px; border-top: 1px solid var(--border);
  max-width: 760px; width: 100%; margin: 0 auto;
  flex-shrink: 0;
}
#staged.staged-list:empty { display: none; }
.staged-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.staged-list .attachment { cursor: pointer; }
.staged-list .attachment:hover { color: #f87171; }

#composer {
  position: relative;
  background: var(--bubble);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  padding: 10px 10px 8px 14px;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color 120ms ease, background 120ms ease;
}
#composer:focus-within { border-color: var(--accent); }
/* Collapse handle — a small chevron tab on the composer's top edge that
   shrinks the textarea to a single line so the messages area reclaims the
   space. Clicking the textarea (focus) expands it again. */
#collapse-handle {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  width: 46px; height: 20px; border-radius: 10px;
  background: var(--bubble); border: 1px solid var(--border-strong);
  color: var(--header-text); cursor: pointer; z-index: 1;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; line-height: 1; font-family: inherit;
  transition: color .12s, border-color .12s;
}
#collapse-handle:hover { color: var(--accent); border-color: var(--accent); }
#composer.collapsed #input {
  min-height: 0; height: 26px !important; overflow: hidden;
}
body.dragging #composer {
  border-color: var(--accent);
  border-style: dashed;
  background: color-mix(in srgb, var(--accent) 6%, var(--bubble));
}
.drop-hint {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  border-radius: 14px;
  color: var(--accent); font-size: 13px; font-weight: 600;
  pointer-events: none;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
body.dragging .drop-hint { display: flex; }
#input {
  background: transparent; color: var(--fg);
  border: 0; outline: 0; resize: none; width: 100%;
  font-family: inherit; font-size: 14px; line-height: 1.5;
  min-height: 60px; max-height: 30dvh;
}
.composer-row {
  display: flex; align-items: center; gap: 8px;
}
#attach-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  background: transparent; border: 1px solid var(--border-strong);
  color: var(--accent); font-family: inherit; font-size: 13px;
  font-weight: 600; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background .12s, color .12s, border-color .12s;
}
#attach-btn:hover { border-color: var(--accent); background: var(--hover-bg); }
#attach-btn .glyph { font-size: 16px; line-height: 1; }
.composer-hint {
  color: var(--hint); font-size: 11px;
  flex: 1; text-align: right; margin-right: 4px;
}
#send-btn {
  background: var(--accent); color: white; border: 0;
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
  font-size: 16px; padding: 6px; box-sizing: content-box;
  display: inline-flex; align-items: center; justify-content: center;
}
#send-btn:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-fg); cursor: not-allowed; }
#send-btn[data-mode="stop"] { background: var(--stop); }
#send-btn[data-mode="stop"]:hover { background: var(--stop-hover); }
.msg.assistant.stopping .body::after {
  content: " stopping…";
  color: var(--hint); font-style: italic; font-size: 12px;
}

@media (max-width: 480px) {
  .composer-hint { display: none; }
  /* The 80px desktop indent eats ~20% of a phone screen; shrink it so user
     bubbles (and their attachments) have room to breathe. */
  .msg.user .body { margin-left: 36px; }
}

/* === Offline modal === */
/* Shown whenever the agent is not online (offline or reconnecting). Grays
   out and blocks the whole UI until the agent connects. */
#offline-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
}
#offline-overlay[hidden] { display: none; }
#offline-card {
  background: var(--bg);
  border: 1px solid var(--border-strong); border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,.3);
  padding: 28px 32px; max-width: 320px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.offline-spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 3px solid var(--border-strong);
  border-top-color: var(--accent);
  animation: offline-spin 0.8s linear infinite;
}
@keyframes offline-spin { to { transform: rotate(360deg); } }
#offline-title { font-weight: 700; font-size: 15px; }
#offline-sub { color: var(--hint); font-size: 13px; line-height: 1.5; }
/* === Skills picker === */
#skills-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  background: transparent; border: 1px solid var(--border-strong);
  color: var(--accent); font-family: inherit; font-size: 13px;
  font-weight: 600; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background .12s, color .12s, border-color .12s;
}
#skills-btn:hover { border-color: var(--accent); background: var(--hover-bg); }
#skills-btn .glyph { font-size: 12px; }
#skills-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: color-mix(in srgb, #000 38%, transparent);
  display: flex;
}
#skills-overlay[hidden] { display: none; }
#skills-panel {
  background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column;
  border: 1px solid var(--border);
  margin: auto; width: 420px; max-width: 92vw; max-height: 70vh;
  border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3);
  overflow: hidden;
}
.skills-grab { display: none; }
.skills-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 8px;
}
.skills-title { font-weight: 700; font-size: 15px; }
#skills-close {
  background: transparent; border: 0; color: var(--header-text);
  font-size: 15px; cursor: pointer; width: 28px; height: 28px;
  border-radius: 6px;
}
#skills-close:hover { background: var(--hover-bg); color: var(--accent); }
#skills-search {
  margin: 0 14px 8px; padding: 8px 10px;
  border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--bg); color: var(--fg);
  font-family: inherit; font-size: 13px;
}
#skills-search:focus { outline: 0; border-color: var(--accent); }
#skills-list { overflow-y: auto; padding: 0 8px; }
.skill-row {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 9px 8px; border-radius: 8px; cursor: pointer;
}
.skill-row:hover { background: var(--hover-bg); }
.skill-row .skill-icon { font-size: 20px; line-height: 1.1; flex: none; }
.skill-row .skill-name { font-weight: 600; font-size: 13px; }
.skill-row .skill-summary {
  color: var(--hint); font-size: 12px; line-height: 1.35;
}
.skills-empty {
  color: var(--hint); font-size: 13px; padding: 14px; text-align: center;
}
.skills-config-label {
  font-size: 10px; font-weight: 700; letter-spacing: .6px;
  color: var(--hint); border-top: 1px solid var(--border);
  margin: 6px 12px 0; padding: 8px 0 4px;
}
#skills-config { padding: 0 8px 10px; }
.skill-row.config { padding: 7px 8px; }
.skill-row.config .skill-icon { font-size: 15px; opacity: .8; }
.skill-row.config .skill-name {
  font-weight: 500; font-size: 12.5px; color: var(--header-text);
}
@media (max-width: 640px) {
  #skills-overlay { align-items: flex-end; }
  #skills-panel {
    margin: 0; width: 100%; max-width: 100%; max-height: 78vh;
    border-radius: 16px 16px 0 0; border-bottom: 0;
  }
  .skills-grab {
    display: block; width: 36px; height: 4px;
    background: var(--border-strong); border-radius: 2px;
    margin: 8px auto 2px;
  }
}
/* === Schedules manager === */
/* #schedules-btn inherits .header-btn styling; only the mobile gate is
   schedules-specific (mirrors the conversation sidebar's gate). */
@media (max-width: 767px) {
  #schedules-btn { display: none; }
}
#schedules-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: color-mix(in srgb, #000 38%, transparent);
  display: flex;
}
#schedules-overlay[hidden] { display: none; }
#schedules-panel {
  background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column;
  border: 1px solid var(--border);
  margin: auto; width: 880px; max-width: 96vw;
  height: 78vh; max-height: 720px;
  border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3);
  overflow: hidden;
}
.schedules-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
}
.schedules-title { font-weight: 700; font-size: 15px; }
#schedules-close {
  background: transparent; border: 0; color: var(--header-text);
  font-size: 15px; cursor: pointer; width: 28px; height: 28px;
  border-radius: 6px;
}
#schedules-close:hover { background: var(--hover-bg); color: var(--accent); }
#schedules-body {
  display: flex; flex: 1; min-height: 0;
}
#schedules-list {
  width: 240px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 6px 0;
}
.sched-row {
  padding: 9px 14px; cursor: pointer; border-left: 3px solid transparent;
  display: flex; flex-direction: column; gap: 3px;
}
.sched-row:hover { background: var(--hover-bg); }
.sched-row.active {
  background: var(--hover-bg);
  border-left-color: var(--accent);
}
.sched-row-head {
  display: flex; align-items: center; gap: 7px;
}
.sched-dot {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--border-strong);
}
.sched-dot.ok { background: #34c759; }
.sched-dot.err { background: #ff453a; }
.sched-row-name {
  font-weight: 600; font-size: 13px; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sched-row-cron {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px; color: var(--hint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sched-row-meta {
  font-size: 11px; color: var(--hint);
}
.sched-row.new-row {
  border-top: 1px solid var(--border); margin-top: 4px; padding-top: 11px;
  color: var(--accent); font-weight: 600; font-size: 13px;
}
#schedules-detail {
  flex: 1; min-width: 0; overflow-y: auto; padding: 14px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.sched-empty {
  color: var(--hint); font-size: 13px; padding: 18px; text-align: center;
}
.sched-detail-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.sched-detail-title {
  font-weight: 700; font-size: 15px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sched-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--header-text); cursor: pointer;
  user-select: none;
}
.sched-toggle input { margin: 0; }
.sched-field {
  display: flex; flex-direction: column; gap: 4px;
}
.sched-field-label {
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
  color: var(--hint); text-transform: uppercase;
}
.sched-field input,
.sched-field select,
.sched-field textarea {
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--border-strong); border-radius: 6px;
  font-family: inherit; font-size: 13px; padding: 7px 9px;
  width: 100%;
}
.sched-field input:focus,
.sched-field select:focus,
.sched-field textarea:focus {
  outline: 0; border-color: var(--accent);
}
.sched-field input.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.sched-field input:disabled {
  opacity: .6; cursor: not-allowed;
}
.sched-field textarea {
  resize: vertical; min-height: 88px;
}
.sched-cron-human {
  font-size: 12px; color: var(--hint); padding-left: 2px;
}
.sched-history {
  background: var(--hover-bg); border-radius: 8px;
  padding: 10px 12px; font-size: 12px; color: var(--header-text);
  display: flex; flex-direction: column; gap: 4px;
}
.sched-history-row {
  display: flex; gap: 6px;
}
.sched-history-row .lbl {
  color: var(--hint); flex-shrink: 0; min-width: 78px;
}
.sched-history-row.error .val {
  color: #ff453a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px; white-space: pre-wrap; word-break: break-word;
}
.sched-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  border-top: 1px solid var(--border); padding-top: 12px; margin-top: auto;
}
.sched-btn {
  background: transparent; color: var(--fg);
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 7px 14px; font-family: inherit; font-size: 13px;
  font-weight: 600; cursor: pointer;
}
.sched-btn:hover { border-color: var(--accent); color: var(--accent); }
.sched-btn.primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.sched-btn.primary:hover { opacity: .9; color: #fff; }
.sched-btn.danger:hover { border-color: #ff453a; color: #ff453a; }
.sched-error {
  color: #ff453a; font-size: 12px; padding-left: 2px;
  min-height: 16px;
}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="sidebar-head">Conversations</div>
  <div id="conversation-list"></div>
</aside>
<div id="app">
<header>
  <div><strong>Curunir</strong></div>
  <div class="header-right">
    <button id="schedules-btn" class="header-btn" title="Manage schedules" aria-label="Manage schedules">Scheduled ⏱</button>
    <button id="theme-btn" class="header-btn" title="Toggle theme" aria-label="Toggle theme"></button>
    <button id="new-btn" class="header-btn" title="Start a new conversation">New</button>
    <div id="status"><span class="dot offline"></span><span id="status-text">offline</span></div>
  </div>
</header>
<main id="messages"></main>
<footer>
  <input type="file" id="file-input" multiple style="display:none"
         accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,text/plain,text/markdown,text/csv,application/json,.md,.txt,.csv,.json,.yaml,.yml,.log,.xml,.toml,.ini">
  <div id="staged" class="staged-list"></div>
  <div id="composer">
    <button id="collapse-handle" type="button" title="Collapse input"
            aria-label="Collapse input">⌄</button>
    <textarea id="input" rows="1" placeholder="What would you like to do?"></textarea>
    <div class="composer-row">
      <button id="skills-btn" title="Browse skills" aria-label="Browse skills"><span class="glyph">✦</span>Skills</button>
      <button id="attach-btn" title="Attach files" aria-label="Attach files"><span class="glyph">+</span>Attach</button>
      <span class="composer-hint">Enter to send · Shift+Enter for newline · drop or paste files to attach</span>
      <button id="send-btn" data-mode="send" title="Send" aria-label="Send">↑</button>
    </div>
    <div class="drop-hint">Drop files to attach</div>
  </div>
</footer>
</div>

<div id="offline-overlay">
  <div id="offline-card" role="alertdialog" aria-live="polite"
       aria-label="Agent offline">
    <div class="offline-spinner"></div>
    <div id="offline-title">Connecting to your agent…</div>
    <div id="offline-sub">Your agent is offline. This screen will clear
      automatically once it reconnects.</div>
  </div>
</div>

<div id="skills-overlay" hidden>
  <div id="skills-panel" role="dialog" aria-label="Skills" aria-modal="true">
    <div class="skills-grab"></div>
    <div class="skills-head">
      <span class="skills-title">✦ Skills</span>
      <button id="skills-close" aria-label="Close">✕</button>
    </div>
    <input id="skills-search" type="text" placeholder="Search skills…"
           autocomplete="off">
    <div id="skills-list"></div>
    <div class="skills-config-label">SETTINGS</div>
    <div id="skills-config"></div>
  </div>
</div>

<div id="schedules-overlay" hidden>
  <div id="schedules-panel" role="dialog" aria-label="Schedules" aria-modal="true">
    <div class="schedules-head">
      <span class="schedules-title">⏱ Schedules</span>
      <button id="schedules-close" aria-label="Close">✕</button>
    </div>
    <div id="schedules-body">
      <div id="schedules-list"></div>
      <div id="schedules-detail"></div>
    </div>
  </div>
</div>

<script>
// === Constants ===
const MAX_IMAGE = 5 * 1024 * 1024;
const MAX_PDF = 10 * 1024 * 1024;
const MAX_DOCX = 10 * 1024 * 1024;
const MAX_TEXT = 256 * 1024;
const MAX_TOTAL = 20 * 1024 * 1024;
const IMAGE_MIMES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
const TEXT_EXTS = [".md", ".txt", ".csv", ".json", ".yaml", ".yml", ".log", ".xml", ".toml", ".ini"];

// Config footer — stable system commands, fixed (not skill-registry driven).
const SKILLS_CONFIG = [
  { icon: "🪪", label: "Identity", command: "/identity" },
  { icon: "👤", label: "Profile", command: "/profile" },
  { icon: "⚙️", label: "Preferences", command: "/preferences" },
  { icon: "❓", label: "Help", command: "/help" },
];

// === Elements ===
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const composerEl = document.getElementById("composer");
const collapseHandle = document.getElementById("collapse-handle");
const sendBtn = document.getElementById("send-btn");
const attachBtn = document.getElementById("attach-btn");
const fileInput = document.getElementById("file-input");
const stagedEl = document.getElementById("staged");
const statusDot = document.querySelector("#status .dot");
const statusText = document.getElementById("status-text");
const newBtn = document.getElementById("new-btn");
const conversationListEl = document.getElementById("conversation-list");
const themeBtn = document.getElementById("theme-btn");
const skillsBtn = document.getElementById("skills-btn");
const skillsOverlay = document.getElementById("skills-overlay");
const skillsClose = document.getElementById("skills-close");
const skillsSearch = document.getElementById("skills-search");
const skillsListEl = document.getElementById("skills-list");
const skillsConfigEl = document.getElementById("skills-config");
const schedulesBtn = document.getElementById("schedules-btn");
const schedulesOverlay = document.getElementById("schedules-overlay");
const schedulesClose = document.getElementById("schedules-close");
const schedulesListEl = document.getElementById("schedules-list");
const schedulesDetailEl = document.getElementById("schedules-detail");
const hljsLight = document.getElementById("hljs-light");
const hljsDark = document.getElementById("hljs-dark");
const offlineOverlay = document.getElementById("offline-overlay");
const offlineTitle = document.getElementById("offline-title");
const offlineSub = document.getElementById("offline-sub");

// === State ===
// The active conversation's session_id. Persisted in localStorage (not
// sessionStorage) so a reload reopens the same conversation; the sidebar
// lets the user switch between conversations or start new ones. The portal
// binds this id to the ws on each frame we send and only routes that
// session's traffic back here.
let sessionId = localStorage.getItem("curunir-session-id");
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem("curunir-session-id", sessionId);
}
let ws = null;
let agentOnline = false;
let staged = []; // {filename, mime_type, data (base64), size}
let inProgressMsg = null; // current assistant DOM node
// While replaying a history_snapshot: the assistant bubble being built, so
// consecutive assistant entries (one per agent-loop iteration) fold into it.
let historyAssistant = null;
// Cached skills_snapshot for this tab; null until first fetch returns.
let skillsCache = null;
// Schedule manager state. schedules is the latest snapshot; selectedId
// points at the row currently shown in the detail pane; draft holds an
// unsaved new entry when the user clicks "+ New schedule". pendingDraft
// flags a recently-submitted draft whose ack should select the new id.
let schedulesState = {
  schedules: [],
  selectedId: null,
  draft: null,
  pendingDraft: false,
  lastError: null,
};
// Latest conversations_snapshot — drives the sidebar list.
let conversations = [];
let backoff = 1000;

// === Markdown setup ===
marked.setOptions({
  highlight: (code, lang) => hljs.highlightAuto(code, lang ? [lang] : undefined).value,
  breaks: true,
});

// === Theme ===
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  hljsLight.disabled = theme !== "light";
  hljsDark.disabled = theme !== "dark";
  themeBtn.textContent = theme === "light" ? "☾" : "☀";
  themeBtn.title = theme === "light" ? "Switch to dark mode" : "Switch to light mode";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  const next = current === "light" ? "dark" : "light";
  localStorage.setItem("curunir-theme", next);
  applyTheme(next);
}
applyTheme(document.documentElement.getAttribute("data-theme") || "light");

// === Status ===
function setStatus(state) {
  statusDot.className = "dot " + state;
  statusText.textContent = state;
  agentOnline = state === "online";
  if (!agentOnline && inProgressMsg) {
    finalizeActivity(inProgressMsg);
    inProgressMsg.classList.remove("stopping");
    inProgressMsg = null;
  }
  updateComposerMode();
  updateOfflineModal(state);
}

// === Offline modal ===
// The agent is a separate process that dials the portal; it may connect a
// moment after the browser does. Until it's online, gray out and block the
// whole UI so the user can't type into a void.
function updateOfflineModal(state) {
  offlineOverlay.hidden = state === "online";
  if (state === "reconnecting") {
    offlineTitle.textContent = "Connecting to your agent…";
    offlineSub.textContent =
      "This screen will clear automatically once it connects.";
  } else if (state === "offline") {
    offlineTitle.textContent = "Agent offline";
    offlineSub.textContent =
      "Your agent isn't connected right now. This screen will clear "
      + "automatically once it reconnects.";
  }
}

// === Composer mode (send / stop) ===
function updateComposerMode() {
  const responding = inProgressMsg !== null;
  if (responding && agentOnline) {
    sendBtn.dataset.mode = "stop";
    sendBtn.textContent = "■";
    sendBtn.title = "Stop";
    sendBtn.setAttribute("aria-label", "Stop");
    sendBtn.disabled = false;
  } else {
    sendBtn.dataset.mode = "send";
    sendBtn.textContent = "↑";
    sendBtn.title = "Send";
    sendBtn.setAttribute("aria-label", "Send");
    sendBtn.disabled = !agentOnline;
  }
}

// === WS connect ===
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/browser`);
  setStatus("reconnecting");

  ws.onopen = () => {
    backoff = 1000;
    // Announce this tab's session_id (binds the socket on the portal)
    // and pull the agent-side history for it. The portal forwards this
    // user_message frame to the container's PortalChannel, which sees
    // command=history_request and responds with a history_snapshot
    // tagged with the same session_id.
    ws.send(JSON.stringify({
      content: "",
      command: "history_request",
      session_id: sessionId,
    }));
    // Fetch the skill list now so the empty-state starters are ready on
    // first paint (the skills picker also requests this lazily).
    ws.send(JSON.stringify({
      command: "skills_request", session_id: sessionId,
    }));
    // Pull the conversation list for the sidebar.
    requestConversations();
  };
  ws.onmessage = (e) => onServerMessage(JSON.parse(e.data));
  ws.onclose = () => {
    setStatus("offline");
    setTimeout(connect, backoff + Math.random() * 500);
    backoff = Math.min(backoff * 2, 30000);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

// === Inbound dispatch ===
function onServerMessage(msg) {
  if (msg.type === "agent_status") {
    setStatus(msg.status);
    return;
  }
  if (msg.type === "history_snapshot") {
    messagesEl.innerHTML = "";
    inProgressMsg = null;
    historyAssistant = null;
    for (const m of msg.messages) renderHistoryEntry(m);
    if (!msg.messages.length) renderEmptyState();
    // History entries are already finalized — attach Copy / Print to
    // every assistant bubble that has rendered text. The function is a
    // no-op for tool-only assistant turns and system rows.
    for (const el of messagesEl.querySelectorAll(".msg.assistant")) {
      appendResponseActions(el);
    }
    updateComposerMode();
    return;
  }
  if (msg.type === "skills_snapshot") {
    skillsCache = msg.skills || [];
    if (!skillsOverlay.hidden) {
      renderSkillsList(skillsCache, skillsSearch.value);
    }
    // If the empty state is showing, it may have rendered before skills
    // arrived — rebuild it now so the starter rows appear.
    if (messagesEl.querySelector(".empty-state")) renderEmptyState();
    return;
  }
  if (msg.type === "conversations_snapshot") {
    conversations = msg.conversations || [];
    renderConversations();
    return;
  }
  if (msg.type === "schedules_snapshot") {
    schedulesState.schedules = msg.schedules || [];
    // Promote a just-saved draft so the form shows the persisted row.
    if (schedulesState.pendingDraft && schedulesState.draft) {
      const draftId = schedulesState.draft.id;
      if (schedulesState.schedules.some(s => s.id === draftId)) {
        schedulesState.selectedId = draftId;
        schedulesState.draft = null;
      }
    }
    schedulesState.pendingDraft = false;
    // If the selected row was removed, clear the selection.
    if (schedulesState.selectedId &&
        !schedulesState.schedules.some(s => s.id === schedulesState.selectedId) &&
        !schedulesState.draft) {
      schedulesState.selectedId = null;
    }
    if (!schedulesOverlay.hidden) renderSchedules();
    return;
  }
  if (msg.type === "schedule_mutate_result") {
    schedulesState.lastError = msg.ok ? null : (msg.error || "Mutation failed.");
    if (!msg.ok) schedulesState.pendingDraft = false;
    if (!schedulesOverlay.hidden) renderScheduleDetail();
    return;
  }
  // Otherwise: an OutgoingMessage payload. The portal socket is multiplexed
  // across sessions, so a frame may arrive for a conversation the user just
  // navigated away from (e.g. tapped New mid-turn). Drop those before they
  // spill into the active chat.
  if (msg.session_id && msg.session_id !== sessionId) return;
  renderAgentChunk(msg);
}

// Render a user message body. Slash commands (/preferences, /investment-memo)
// get the bold-monospace pill that slash-help output uses; anything else is
// plain text.
function setUserBody(bodyEl, content) {
  const text = content || "";
  if (/^\/[A-Za-z][\w-]*/.test(text.trimStart())) {
    bodyEl.textContent = "";
    const code = document.createElement("code");
    code.className = "slash-cmd";
    code.textContent = text.trim();
    bodyEl.appendChild(code);
  } else {
    bodyEl.textContent = text;
  }
}

function renderHistoryEntry(m) {
  if (m.role === "user") {
    historyAssistant = null;
    const el = appendMessage("user");
    setUserBody(el.querySelector(".body"), m.content || "");
    renderAttachments(el, m.attachments);
  } else if (m.role === "assistant") {
    // The agent loop emits one assistant entry per iteration (a tool batch,
    // then a final text reply) — all part of one turn. Fold consecutive
    // assistant entries into a single bubble so the tool ticker accumulates
    // the same way it does for a live turn, instead of one ticker per entry.
    const el = historyAssistant || (historyAssistant = appendMessage("assistant"));
    const body = el.querySelector(".body");
    if (m.content) {
      body.dataset.raw = body.dataset.raw
        ? body.dataset.raw + "\n\n" + m.content : m.content;
      body.innerHTML = marked.parse(body.dataset.raw);
    }
    appendToolCalls(el, m.tool_calls);
    renderAttachments(el, m.attachments);
  } else if (m.role === "system") {
    historyAssistant = null;
    const el = appendMessage("assistant");
    el.querySelector(".body").innerHTML = `<em class="system-msg">${m.content}</em>`;
  }
}

// Builds (once) the activity indicator on a message. In live mode it shows a
// pulsing pill ([● Thinking]) + the current tool name; clicking either
// expands the full list of tool calls so far. In non-live mode it's a static
// count chip ("3 tools"). Both modes share the same <details> element and
// .tool-list so we can morph from live → historical in place on m.final.
function ensureActivityIndicator(msgEl, live) {
  let tools = msgEl.querySelector("details.tools");
  if (tools) return tools;
  tools = document.createElement("details");
  tools.className = live ? "tools live" : "tools";
  if (live) {
    tools.innerHTML =
      '<summary><div class="activity-row">' +
      '<span class="pill">' +
      '<span class="pill-dot"></span>' +
      '<span class="pill-label">Thinking</span>' +
      '</span>' +
      '<span class="tool-current"></span>' +
      '<span class="ticker-caret">▶</span>' +
      '</div></summary>' +
      '<div class="tool-list"></div>';
  } else {
    tools.innerHTML =
      '<summary><div class="ticker">' +
      '<span class="ticker-dot"></span>' +
      '<span class="ticker-count"></span>' +
      '<span class="ticker-caret">▶</span>' +
      '</div></summary>' +
      '<div class="tool-list"></div>';
  }
  msgEl.appendChild(tools);
  return tools;
}

// Append tool entries to whichever indicator exists on the message (creating
// the historical-style one for the conversation-reload path if needed). Marks
// a live indicator as .has-tools so the caret/click affordance appears.
function appendToolCalls(msgEl, calls) {
  if (!calls || !calls.length) return;
  const tools = ensureActivityIndicator(msgEl, /*live=*/false);
  const list = tools.querySelector(".tool-list");
  for (const t of calls) {
    const line = document.createElement("div");
    line.className = "tool-line";
    line.textContent = t;
    list.appendChild(line);
  }
  if (tools.classList.contains("live")) {
    tools.classList.add("has-tools");
  } else {
    const total = list.children.length;
    tools.querySelector(".ticker-count").textContent = total === 1 ? "1 tool" : `${total} tools`;
  }
}

// Update the shimmering tool-current label on a live indicator. No-op if the
// message is historical or has no indicator.
function setCurrentTool(msgEl, summary) {
  const cur = msgEl.querySelector("details.tools.live .tool-current");
  if (cur) cur.textContent = toStatusLabel(summary);
}

// Morph a live indicator into the historical count-chip state. If no tools
// were called, remove the indicator entirely (text-only turns leave nothing
// behind).
function finalizeActivity(msgEl) {
  if (!msgEl) return;
  const tools = msgEl.querySelector("details.tools.live");
  if (!tools) return;
  const list = tools.querySelector(".tool-list");
  const total = list ? list.children.length : 0;
  if (total === 0) {
    tools.remove();
    return;
  }
  tools.classList.remove("live", "has-tools");
  const summary = tools.querySelector("summary");
  summary.innerHTML =
    '<div class="ticker">' +
    '<span class="ticker-dot"></span>' +
    '<span class="ticker-count">' + (total === 1 ? "1 tool" : total + " tools") + '</span>' +
    '<span class="ticker-caret">▶</span>' +
    '</div>';
}

// Turn a streamed tool summary ("Read portal/app.py") into a live-action
// label ("Reading portal/app.py…") for the activity indicator.
const TOOL_GERUNDS = {
  Read: "Reading", Write: "Writing", Edit: "Editing",
  Grep: "Searching", Glob: "Searching", Bash: "Running",
  LoadSkill: "Loading skill", WebFetch: "Fetching", Delegate: "Delegating",
};
function toStatusLabel(summary) {
  const sp = summary.indexOf(" ");
  const verb = sp === -1 ? summary : summary.slice(0, sp);
  const g = TOOL_GERUNDS[verb];
  return (g ? g + summary.slice(sp) : summary) + "…";
}

// Build (or rebuild) the Copy / Print action row on a finalized
// assistant bubble. Idempotent: any prior row is removed first so the
// new one stays the bubble's last child even after late updates (tool
// ticker, attachments, history reload). Skipped for bubbles with no
// rendered text (tool-only assistant turns and system messages — they
// have no body.dataset.raw to copy).
function appendResponseActions(msgEl) {
  if (!msgEl || !msgEl.classList.contains("assistant")) return;
  const body = msgEl.querySelector(".body");
  if (!body || !body.dataset.raw) return;
  const existing = msgEl.querySelector(".response-actions");
  if (existing) existing.remove();

  const wrap = document.createElement("div");
  wrap.className = "response-actions";

  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "resp-action";
  copyBtn.textContent = "Copy";
  copyBtn.setAttribute("aria-label", "Copy response");
  copyBtn.addEventListener("click", () => copyResponse(body.dataset.raw, copyBtn));

  const printBtn = document.createElement("button");
  printBtn.type = "button";
  printBtn.className = "resp-action";
  printBtn.textContent = "Print";
  printBtn.setAttribute("aria-label", "Print response");
  printBtn.addEventListener("click", () => printResponse(body));

  wrap.appendChild(copyBtn);
  wrap.appendChild(printBtn);
  msgEl.appendChild(wrap);
}

async function copyResponse(rawText, btn) {
  const original = btn.textContent;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(rawText);
      ok = true;
    } else {
      // execCommand fallback for non-secure contexts (e.g. plain http://).
      const ta = document.createElement("textarea");
      ta.value = rawText;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    }
  } catch {}
  btn.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(() => { btn.textContent = original; }, 1500);
}

// Client-side Print: copy the response's rendered markdown into the hidden
// #print-doc, then open the browser print dialog. A @media print stylesheet
// shows only #print-doc, styled black-on-white for paper — the user picks
// "Save as PDF" as the destination. No agent round-trip, no dependencies.
function printResponse(bodyEl) {
  const printDoc = document.getElementById("print-doc");
  if (!printDoc || !bodyEl) return;
  printDoc.innerHTML = bodyEl.innerHTML;
  // document.title seeds the print dialog's default "Save as PDF" filename;
  // afterprint fires whether the user prints or cancels, so it always reverts.
  const prevTitle = document.title;
  document.title = "Curunir response";
  window.addEventListener("afterprint", () => {
    document.title = prevTitle;
    printDoc.innerHTML = "";
  }, { once: true });
  window.print();
}

function renderAgentChunk(m) {
  if (!inProgressMsg) {
    inProgressMsg = appendMessage("assistant", true);
  }
  const body = inProgressMsg.querySelector(".body");
  if (m.delta) {
    body.dataset.raw = (body.dataset.raw || "") + (m.content || "");
    body.innerHTML = marked.parse(body.dataset.raw);
  } else if (m.content) {
    body.dataset.raw = m.content;
    body.innerHTML = marked.parse(m.content);
  }
  appendToolCalls(inProgressMsg, m.tool_calls);
  renderAttachments(inProgressMsg, m.attachments);
  if (m.tool_calls && m.tool_calls.length) {
    setCurrentTool(inProgressMsg, m.tool_calls[m.tool_calls.length - 1]);
  }
  if (m.final) {
    finalizeActivity(inProgressMsg);
    inProgressMsg.classList.remove("stopping");
    appendResponseActions(inProgressMsg);
    inProgressMsg = null;
    // The turn just completed — refresh the sidebar so a brand-new
    // conversation appears and titles/timestamps stay current.
    requestConversations();
  }
  updateComposerMode();
  scrollToBottom();
}

// Feather-style line icons for the attachment card (no emoji).
const DOC_ICON =
  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
  'stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 ' +
  '2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
const DL_ICON =
  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
  'stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
  '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" ' +
  'y2="3"/></svg>';

function renderAttachments(parent, atts) {
  if (!atts || !atts.length) return;
  const wrap = document.createElement("div");
  wrap.className = "attachments";
  for (const a of atts) {
    const name = a.filename || a.path || "file";
    const hasData = typeof a.data === "string";
    if (hasData && typeof a.mime_type === "string" && a.mime_type.startsWith("image/")) {
      const img = document.createElement("img");
      img.className = "attachment-image";
      img.src = "data:" + a.mime_type + ";base64," + a.data;
      img.alt = name;
      img.title = name + " · click to download";
      img.onclick = () => downloadAttachment(a);
      wrap.appendChild(img);
      continue;
    }
    const ext = name.includes(".") ? name.split(".").pop().toUpperCase() : "";
    const downloadable = hasData;
    const card = document.createElement("span");
    card.className = "attachment-card";
    card.innerHTML =
      '<span class="badge">' + DOC_ICON + '</span>' +
      '<span class="meta"><span class="fname"></span>' +
      '<span class="fsub"></span></span>' +
      (downloadable ? '<span class="dl">' + DL_ICON + '</span>' : '');
    card.querySelector(".fname").textContent = name;
    card.querySelector(".fsub").textContent = downloadable
      ? (ext ? ext + " · click to download" : "Click to download")
      : (ext ? ext + " file" : "Attachment");
    if (downloadable) {
      card.classList.add("downloadable");
      card.title = "Download";
      card.onclick = () => downloadAttachment(a);
    }
    wrap.appendChild(card);
  }
  // User attachments live inside the bubble (above the text) so they read as
  // part of the message, not orphaned beneath it. Assistant artifacts stay
  // outside the body since the assistant has no bubble background.
  if (parent.classList && parent.classList.contains("user")) {
    const body = parent.querySelector(".body");
    body.insertBefore(wrap, body.firstChild);
  } else {
    parent.appendChild(wrap);
  }
}

function downloadAttachment(a) {
  const bin = atob(a.data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: a.mime_type || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = a.filename || "download";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function appendMessage(role, thinking = false) {
  const es = messagesEl.querySelector(".empty-state");
  if (es) es.remove();
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.innerHTML = `<div class="role">${role === "user" ? "you" : "curunir"}</div><div class="body"></div>`;
  if (thinking) ensureActivityIndicator(el, /*live=*/true);
  messagesEl.appendChild(el);
  scrollToBottom();
  return el;
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

// === Empty-state conversation starters ===
// Rendered into #messages when a conversation has no messages yet: a static
// greeting plus one starter per portal-enabled skill. Rebuilt in place on
// every call, so a late skills_snapshot can refresh the rows. A starter
// click drops `/<skill> ` into the composer via fillComposer — it does NOT
// send; the skills all need a subject the user must still type.
function renderEmptyState() {
  const existing = messagesEl.querySelector(".empty-state");
  if (existing) existing.remove();

  const wrap = document.createElement("div");
  wrap.className = "empty-state";

  const greeting = document.createElement("div");
  greeting.className = "es-greeting";
  greeting.textContent = "What would you like to do?";
  wrap.appendChild(greeting);

  const skills = (skillsCache || []).filter(s => s.starter);
  if (skills.length) {
    const list = document.createElement("div");
    list.className = "es-list";
    for (const s of skills) {
      const row = document.createElement("div");
      row.className = "es-starter";
      row.innerHTML =
        '<span class="es-arrow">→</span>' +
        '<span class="es-text"></span>';
      row.querySelector(".es-text").textContent = s.summary;
      row.addEventListener("click", () => fillComposer("/" + s.name + " "));
      list.appendChild(row);
    }
    wrap.appendChild(list);
  }
  messagesEl.appendChild(wrap);
}

// Drop text into the composer, focus it, and place the caret at the end.
// Fires the existing `input` handler so the textarea autosizes. Used by the
// empty-state starters; deliberately does not send.
function fillComposer(text) {
  inputEl.value = text;
  inputEl.focus();
  inputEl.setSelectionRange(text.length, text.length);
  inputEl.dispatchEvent(new Event("input"));
}

// === Skills picker ===
function renderSkillsList(skills, filter = "") {
  if (!skills.length) {
    skillsListEl.innerHTML =
      '<div class="skills-empty">No skills available yet.</div>';
    return;
  }
  const f = filter.trim().toLowerCase();
  const shown = f
    ? skills.filter(s =>
        s.display_name.toLowerCase().includes(f) ||
        s.summary.toLowerCase().includes(f))
    : skills;
  if (!shown.length) {
    skillsListEl.innerHTML =
      '<div class="skills-empty">No matches.</div>';
    return;
  }
  skillsListEl.innerHTML = "";
  for (const s of shown) {
    const row = document.createElement("div");
    row.className = "skill-row";
    row.innerHTML =
      '<div><div class="skill-name"></div>' +
      '<div class="skill-summary"></div></div>';
    row.querySelector(".skill-name").textContent = s.display_name;
    row.querySelector(".skill-summary").textContent = s.summary;
    row.addEventListener("click", () => launchSkill("/" + s.name));
    skillsListEl.appendChild(row);
  }
}

function renderSkillsConfig() {
  skillsConfigEl.innerHTML = "";
  for (const c of SKILLS_CONFIG) {
    const row = document.createElement("div");
    row.className = "skill-row config";
    row.innerHTML =
      '<span class="skill-icon"></span><div class="skill-name"></div>';
    row.querySelector(".skill-icon").textContent = c.icon;
    row.querySelector(".skill-name").textContent = c.label;
    row.addEventListener("click", () => launchSkill(c.command));
    skillsConfigEl.appendChild(row);
  }
}

function openSkills() {
  skillsOverlay.hidden = false;
  skillsSearch.value = "";
  renderSkillsConfig();
  if (skillsCache) {
    renderSkillsList(skillsCache);
  } else {
    skillsListEl.innerHTML =
      '<div class="skills-empty">Loading…</div>';
    ws.send(JSON.stringify({
      command: "skills_request", session_id: sessionId,
    }));
  }
  skillsSearch.focus();
}

function closeSkills() {
  skillsOverlay.hidden = true;
}

// Launch a skill/command via the existing slash path: echo locally and
// send the same {command:"slash"} frame a typed slash would produce.
function launchSkill(slashText) {
  closeSkills();
  // Offline is handled by the blocking modal — no-op rather than leaving a
  // stale bubble that lingers after the agent reconnects.
  if (!agentOnline) return;
  const el = appendMessage("user");
  setUserBody(el.querySelector(".body"), slashText);
  ws.send(JSON.stringify({
    command: "slash", text: slashText, session_id: sessionId,
  }));
  if (!inProgressMsg) inProgressMsg = appendMessage("assistant", true);
  updateComposerMode();
}

skillsBtn.addEventListener("click", openSkills);
skillsClose.addEventListener("click", closeSkills);
skillsOverlay.addEventListener("click", (e) => {
  if (e.target === skillsOverlay) closeSkills();
});
skillsSearch.addEventListener("input", () => {
  if (skillsCache) renderSkillsList(skillsCache, skillsSearch.value);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !skillsOverlay.hidden) closeSkills();
  if (e.key === "Escape" && !schedulesOverlay.hidden) closeSchedules();
});

// === Schedules manager ===
function describeCron(expr) {
  if (!expr) return "";
  try {
    return cronstrue.toString(expr, { use24HourTimeFormat: false });
  } catch (e) {
    return "(invalid cron expression)";
  }
}

function formatRelative(ts) {
  if (!ts) return "never";
  const ms = Date.now() - ts * 1000;
  if (ms < 0) {
    // future timestamp (next_run)
    const fs = -ms / 1000;
    if (fs < 60) return `in ${Math.round(fs)}s`;
    if (fs < 3600) return `in ${Math.round(fs / 60)}m`;
    if (fs < 86400) return `in ${Math.round(fs / 3600)}h`;
    return `in ${Math.round(fs / 86400)}d`;
  }
  const s = ms / 1000;
  if (s < 60) return `${Math.round(s)}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

function selectedSchedule() {
  if (schedulesState.draft && !schedulesState.selectedId) {
    return schedulesState.draft;
  }
  if (schedulesState.selectedId) {
    return schedulesState.schedules.find(s => s.id === schedulesState.selectedId) || null;
  }
  return null;
}

function renderSchedules() {
  renderScheduleList();
  renderScheduleDetail();
}

function renderScheduleList() {
  schedulesListEl.innerHTML = "";
  const { schedules, selectedId, draft } = schedulesState;
  for (const s of schedules) {
    const row = document.createElement("div");
    row.className = "sched-row" + (s.id === selectedId && !draft ? " active" : "");
    let dotClass = "sched-dot";
    if (!s.enabled) dotClass += "";
    else if (s.last_status === "error") dotClass += " err";
    else dotClass += " ok";
    const head = document.createElement("div");
    head.className = "sched-row-head";
    const dot = document.createElement("span");
    dot.className = dotClass;
    const name = document.createElement("span");
    name.className = "sched-row-name";
    name.textContent = s.id;
    head.appendChild(dot);
    head.appendChild(name);
    const cron = document.createElement("div");
    cron.className = "sched-row-cron";
    cron.textContent = s.cron;
    const meta = document.createElement("div");
    meta.className = "sched-row-meta";
    meta.textContent = s.last_run ? `Last: ${formatRelative(s.last_run)}` : "Never run";
    row.appendChild(head);
    row.appendChild(cron);
    row.appendChild(meta);
    row.addEventListener("click", () => selectSchedule(s.id));
    schedulesListEl.appendChild(row);
  }
  // Draft row appears as active if present.
  if (draft) {
    const row = document.createElement("div");
    row.className = "sched-row active";
    row.innerHTML = '<div class="sched-row-head"><span class="sched-row-name">New schedule</span></div>'
      + '<div class="sched-row-meta">Unsaved</div>';
    schedulesListEl.appendChild(row);
  }
  // "+ New schedule" row at the bottom.
  const newRow = document.createElement("div");
  newRow.className = "sched-row new-row";
  newRow.textContent = "+ New schedule";
  newRow.addEventListener("click", startScheduleDraft);
  schedulesListEl.appendChild(newRow);
  if (!schedules.length && !draft) {
    const empty = document.createElement("div");
    empty.className = "sched-empty";
    empty.textContent = "No schedules yet.";
    schedulesListEl.insertBefore(empty, newRow);
  }
}

function renderScheduleDetail() {
  schedulesDetailEl.innerHTML = "";
  const s = selectedSchedule();
  if (!s) {
    const empty = document.createElement("div");
    empty.className = "sched-empty";
    empty.textContent = "Select a schedule on the left, or click \"+ New schedule\" to create one.";
    schedulesDetailEl.appendChild(empty);
    return;
  }
  const isNew = !!schedulesState.draft && !schedulesState.selectedId;
  // Build skill <option> list from the skills picker cache.
  const skillOptions = ["<option value=\"\">— none —</option>"];
  if (skillsCache) {
    for (const sk of skillsCache) {
      skillOptions.push(`<option value="${sk.name}">${sk.display_name || sk.name}</option>`);
    }
  } else if (s.skill) {
    skillOptions.push(`<option value="${s.skill}">${s.skill}</option>`);

  const wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";

  const head = document.createElement("div");
  head.className = "sched-detail-head";
  const title = document.createElement("div");
  title.className = "sched-detail-title";
  title.textContent = isNew ? "New schedule" : s.id;
  const toggle = document.createElement("label");
  toggle.className = "sched-toggle";
  toggle.innerHTML = '<input type="checkbox" id="sched-enabled"> Enabled';
  head.appendChild(title);
  head.appendChild(toggle);
  wrap.appendChild(head);

  const idField = makeField("ID", "input", { id: "sched-id", value: s.id || "", disabled: !isNew });
  const cronField = makeField("Cron expression", "input",

  const cronHuman = document.createElement("div");

  wrap.appendChild(cronField);
  wrap.appendChild(skillField);
  wrap.appendChild(promptField);

  if (!isNew) {
    const history = document.createElement("div");
    history.className = "sched-history";
    history.appendChild(makeHistoryRow("Last run", s.last_run ? formatRelative(s.last_run) : "never"));
    if (s.last_status) {

  if (!isNew) {
