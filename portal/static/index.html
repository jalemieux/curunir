    delBtn.className = "sched-btn danger";
    delBtn.textContent = "Delete";
    delBtn.addEventListener("click", () => deleteSchedule(s.id));
    actions.appendChild(delBtn);

    const runBtn = document.createElement("button");
    runBtn.className = "sched-btn";
    runBtn.textContent = "Run now";
    runBtn.addEventListener("click", () => runScheduleNow(s.id));
    actions.appendChild(runBtn);
  }
  const saveBtn = document.createElement("button");
  saveBtn.className = "sched-btn primary";
  saveBtn.textContent = isNew ? "Create" : "Save";
  saveBtn.addEventListener("click", () => saveSchedule(isNew));
  actions.appendChild(saveBtn);
  wrap.appendChild(actions);

  schedulesDetailEl.appendChild(wrap);

  // Wire enabled checkbox + cron live preview.
  const enabledEl = document.getElementById("sched-enabled");
  enabledEl.checked = s.enabled !== false;
  const cronEl = document.getElementById("sched-cron");
  const updateHuman = () => { cronHuman.textContent = describeCron(cronEl.value); };
  updateHuman();
  cronEl.addEventListener("input", updateHuman);
  // Select the right skill option (after DOM insert so options exist).
  const skillEl = document.getElementById("sched-skill");
  skillEl.value = s.skill || "";
}

function makeField(label, kind, opts) {
  const wrap = document.createElement("div");
  wrap.className = "sched-field";
  const lab = document.createElement("label");
  lab.className = "sched-field-label";
  lab.textContent = label;
  wrap.appendChild(lab);
  let el;
  if (kind === "textarea") {
    el = document.createElement("textarea");
    el.rows = opts.rows || 3;
    el.value = opts.value || "";
  } else {
    el = document.createElement("input");
    el.type = "text";
    el.value = opts.value || "";
  }
  if (opts.id) el.id = opts.id;
  if (opts.className) el.className = opts.className;
  if (opts.placeholder) el.placeholder = opts.placeholder;
  if (opts.disabled) el.disabled = true;
  wrap.appendChild(el);
  return wrap;
}

function makeHistoryRow(label, value) {
  const row = document.createElement("div");
  row.className = "sched-history-row";
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = label + ":";
  const val = document.createElement("span");
  val.className = "val";
  val.textContent = value;
  row.appendChild(lbl);
  row.appendChild(val);
  return row;
}

function selectSchedule(id) {
  schedulesState.selectedId = id;
  schedulesState.draft = null;
  schedulesState.lastError = null;
  renderSchedules();
}

function startScheduleDraft() {
  schedulesState.draft = {
    id: "", cron: "", prompt: "", skill: null, enabled: true,
  };
  schedulesState.selectedId = null;
  schedulesState.lastError = null;
  renderSchedules();
  const idEl = document.getElementById("sched-id");
  if (idEl) idEl.focus();
}

function readForm() {
  return {
    id: (document.getElementById("sched-id").value || "").trim(),
    cron: (document.getElementById("sched-cron").value || "").trim(),
    skill: (document.getElementById("sched-skill").value || "") || null,
    prompt: (document.getElementById("sched-prompt").value || "").trim(),
    enabled: document.getElementById("sched-enabled").checked,
  };
}

function saveSchedule(isNew) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const form = readForm();
  if (!form.id || !form.cron || !form.prompt) {
    schedulesState.lastError = "id, cron, and prompt are all required.";
    renderScheduleDetail();
    return;
  }
  if (isNew && !/^[a-z0-9-]+$/.test(form.id)) {
    schedulesState.lastError = "id must match ^[a-z0-9-]+$";
    renderScheduleDetail();
    return;
  }
  if (isNew) {
    schedulesState.draft = form;
    schedulesState.pendingDraft = true;
  }
  schedulesState.lastError = null;
  ws.send(JSON.stringify({
    command: "schedule_mutate",
    session_id: sessionId,
    action: isNew ? "add" : "update",
    task: form,
  }));
}

function deleteSchedule(id) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (!window.confirm(`Delete schedule "${id}"?`)) return;
  schedulesState.lastError = null;
  ws.send(JSON.stringify({
    command: "schedule_mutate",
    session_id: sessionId,
    action: "remove",
    task: { id },
  }));
}

function runScheduleNow(id) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  schedulesState.lastError = null;
  ws.send(JSON.stringify({
    command: "schedule_mutate",
    session_id: sessionId,
    action: "run_now",
    task: { id },
  }));
}

function openSchedules() {
  schedulesOverlay.hidden = false;
  schedulesState.lastError = null;
  schedulesState.draft = null;
  renderSchedules();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      command: "schedules_request", session_id: sessionId,
    }));
  }
}

function closeSchedules() {
  schedulesOverlay.hidden = true;
}

schedulesBtn.addEventListener("click", openSchedules);
schedulesClose.addEventListener("click", closeSchedules);
schedulesOverlay.addEventListener("click", (e) => {
  if (e.target === schedulesOverlay) closeSchedules();
});

// === Send ===
function send() {
  const content = inputEl.value.trim();
  if (!content && staged.length === 0) return;
  // Offline is handled by the blocking modal — no-op rather than leaving a
  // stale bubble that lingers after the agent reconnects.
  if (!agentOnline) return;

  // Slash commands (no attachments) get routed through the server-side
  // slash dispatcher: utility ops like /help and /skills, plus
  // /<skill-name> to force a specific skill. Echo the slash text locally
  // so the user sees what they sent.
  if (content.startsWith("/") && staged.length === 0) {
    const el = appendMessage("user");
    setUserBody(el.querySelector(".body"), content);
    ws.send(JSON.stringify({
      command: "slash", text: content, session_id: sessionId,
    }));
    inputEl.value = "";
    if (!inProgressMsg) inProgressMsg = appendMessage("assistant", true);
    updateComposerMode();
    return;
  }

  // Optimistic local render
  const el = appendMessage("user");
  el.querySelector(".body").textContent = content;
  renderAttachments(el, staged.map(a => ({filename: a.filename})));

  ws.send(JSON.stringify({
    content,
    session_id: sessionId,
    attachments: staged.length ? staged.map(a => ({
      filename: a.filename, mime_type: a.mime_type, data: a.data,
    })) : null,
  }));
  inputEl.value = "";
  staged = [];
  renderStaged();
  // Optimistic flip — actual flip happens once chunks start streaming, but
  // pre-create the in-progress slot so the button shows Stop immediately.
  // The typing-dots indicator gives the user a "received, working" signal
  // before any content or tool call arrives.
  if (!inProgressMsg) inProgressMsg = appendMessage("assistant", true);
  updateComposerMode();
}

// === Interrupt ===
// NOTE: send the *inner* shape only — `portal/ws_browser.py` already wraps
// every browser frame as `{type:"user_message", payload:<this>}`. Sending a
// pre-wrapped frame here would double-wrap and confuse the agent.
function interrupt() {
  if (!inProgressMsg || !agentOnline || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ command: "interrupt", session_id: sessionId }));
  inProgressMsg.classList.add("stopping");
  // Don't clear inProgressMsg — the agent will emit a final "(interrupted)"
  // frame which the existing m.final handler clears. But flip the button back
  // to Send mode now so the composer is usable while we wait.
  sendBtn.dataset.mode = "send";
  sendBtn.textContent = "↑";
  sendBtn.title = "Send";
  sendBtn.setAttribute("aria-label", "Send");
}

// === Attachments staging ===
// Spreading a large Uint8Array into String.fromCharCode overflows the call
// stack on anything bigger than ~100 KB, which is why image uploads silently
// failed. Encode in 32 KB chunks instead.
function bytesToBase64(bytes) {
  const CHUNK = 0x8000;
  let binary = "";
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

async function stageFile(file) {
  // Classify against the supported allowlist (mirrors the file-input `accept`).
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
  const isImg = file.type.startsWith("image/");
  const isPdf = file.type === "application/pdf" || ext === ".pdf";
  const isDocx = file.type === DOCX_MIME || ext === ".docx";
  const isText = !isImg && !isPdf && !isDocx && (
    file.type.startsWith("text/") ||
    file.type === "application/json" ||
    TEXT_EXTS.includes(ext)
  );

  if (isImg && !IMAGE_MIMES.includes(file.type)) {
    alert(`Unsupported image type: ${file.type}`); return;
  }
  if (!isImg && !isPdf && !isDocx && !isText) {
    alert(`Unsupported file type: ${file.name}\nSupported: images (png/jpg/gif/webp), PDF, DOCX, and text formats.`);
    return;
  }
  if (isImg && file.size > MAX_IMAGE) { alert(`Image > 5 MB`); return; }
  if (isPdf && file.size > MAX_PDF) { alert(`PDF > 10 MB`); return; }
  if (isDocx && file.size > MAX_DOCX) { alert(`DOCX > 10 MB`); return; }
  if (isText && file.size > MAX_TEXT) { alert(`Text > 256 KB`); return; }

  const totalAfter = staged.reduce((s, a) => s + a.size, 0) + file.size;
  if (totalAfter > MAX_TOTAL) { alert(`Total > 20 MB`); return; }

  const buf = await file.arrayBuffer();
  const data = bytesToBase64(new Uint8Array(buf));
  staged.push({
    filename: file.name,
    mime_type: file.type || "application/octet-stream",
    data,
    size: file.size,
  });
  renderStaged();
}

function renderStaged() {
  stagedEl.innerHTML = "";
  staged.forEach((a, i) => {
    const chip = document.createElement("span");
    chip.className = "attachment";
    chip.textContent = `📎 ${a.filename} ✕`;
    chip.onclick = () => { staged.splice(i, 1); renderStaged(); };
    stagedEl.appendChild(chip);
  });
}

// === New conversation ===
// === Conversation sidebar ===
function requestConversations() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    command: "conversations_request", session_id: sessionId,
  }));
}

function relativeTime(iso) {
  if (!iso) return "";
  const then = new Date(iso).getTime();
  if (isNaN(then)) return "";
  const s = Math.max(0, (Date.now() - then) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 7) return d + "d ago";
  return new Date(iso).toLocaleDateString();
}

function renderConversations() {
  conversationListEl.innerHTML = "";
  if (!conversations.length) {
    const empty = document.createElement("div");
    empty.className = "conv-empty";
    empty.textContent = "No conversations yet.";
    conversationListEl.appendChild(empty);
    return;
  }
  for (const c of conversations) {
    const row = document.createElement("div");
    row.className = "conv-row" + (c.session_id === sessionId ? " active" : "");
    row.innerHTML =
      '<div class="conv-title"></div>' +
      '<div class="conv-meta"></div>' +
      '<button class="conv-del" title="Delete conversation" ' +
      'aria-label="Delete conversation">✕</button>';
    row.querySelector(".conv-title").textContent =
      c.title || "New conversation";
    row.querySelector(".conv-meta").textContent = relativeTime(c.updated_at);
    row.addEventListener("click", () => switchConversation(c.session_id));
    row.querySelector(".conv-del").addEventListener("click", (e) => {
      e.stopPropagation();
      deleteConversation(c.session_id);
    });
    conversationListEl.appendChild(row);
  }
}

function switchConversation(id) {
  if (id === sessionId) return;
  sessionId = id;
  localStorage.setItem("curunir-session-id", sessionId);
  messagesEl.innerHTML = "";
  inProgressMsg = null;
  staged = [];
  renderStaged();
  // Re-bind the socket to this session and pull its transcript; the
  // history_snapshot handler renders the messages.
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      content: "", command: "history_request", session_id: sessionId,
    }));
  }
  renderConversations();
  inputEl.focus();
}

function deleteConversation(id) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  // The `clear` command is the server-side delete: it summarizes the
  // conversation into memory, then removes its transcript file.
  ws.send(JSON.stringify({ content: "", command: "clear", session_id: id }));
  conversations = conversations.filter(c => c.session_id !== id);
  renderConversations();
  // Deleting the conversation you're in drops you into a fresh one.
  if (id === sessionId) startNew();
}

function startNew() {
  // Mint a fresh conversation id — no `clear` frame, so the prior
  // conversation is kept and stays in the sidebar. The new conversation
  // joins the list once its first message is sent. An in-flight turn on the
  // old session is left to finish and persist; the inbound session_id filter
  // keeps its chunks out of the new chat.
  sessionId = crypto.randomUUID();
  localStorage.setItem("curunir-session-id", sessionId);
  messagesEl.innerHTML = "";
  inProgressMsg = null;
  staged = [];
  renderStaged();
  inputEl.value = "";
  inputEl.style.height = "";
  renderEmptyState();
  renderConversations();
  inputEl.focus();
}

// === Wiring ===
sendBtn.onclick = () => {
  if (sendBtn.dataset.mode === "stop") interrupt();
  else send();
};
newBtn.onclick = startNew;
themeBtn.onclick = toggleTheme;
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
// Esc anywhere on the page interrupts an in-flight response. Bound globally
// because the user may be reading the stream and not have focus on the input.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && inProgressMsg) {
    e.preventDefault();
    interrupt();
  }
});
function autosizeInput() {
  if (composerEl.classList.contains("collapsed")) return;
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(
    Math.max(inputEl.scrollHeight, 60),
    window.innerHeight * 0.3
  ) + "px";
}
inputEl.addEventListener("input", autosizeInput);

// Collapse handle: toggle the composer down to a single line so the user can
// read long messages. Focusing the textarea always expands it again.
function setCollapsed(collapsed) {
  composerEl.classList.toggle("collapsed", collapsed);
  collapseHandle.textContent = collapsed ? "⌃" : "⌄";
  collapseHandle.title = collapsed ? "Expand input" : "Collapse input";
  collapseHandle.setAttribute("aria-label", collapseHandle.title);
  if (!collapsed) { inputEl.style.height = ""; autosizeInput(); }
}
collapseHandle.addEventListener("click", () => {
  setCollapsed(!composerEl.classList.contains("collapsed"));
});
inputEl.addEventListener("focus", () => {
  if (composerEl.classList.contains("collapsed")) setCollapsed(false);
});
attachBtn.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  for (const f of fileInput.files) await stageFile(f);
  fileInput.value = "";
};

// === Drag & drop anywhere on the page ===
// dragenter/leave fire for every child boundary, so we count depth instead of
// trying to track which element the cursor is over.
let dragDepth = 0;
function isFileDrag(e) {
  return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
}
document.addEventListener("dragenter", (e) => {
  if (!isFileDrag(e)) return;
  dragDepth++;
  document.body.classList.add("dragging");
});
document.addEventListener("dragleave", (e) => {
  if (!isFileDrag(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.body.classList.remove("dragging");
});
document.addEventListener("dragover", (e) => {
  // Required to allow `drop` to fire — without preventDefault the browser
  // refuses the drop and opens the file instead.
  if (isFileDrag(e)) e.preventDefault();
});
document.addEventListener("drop", async (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  for (const f of e.dataTransfer.files) await stageFile(f);
  inputEl.focus();
});

// Paste an image (or any file) from the clipboard into the composer. Only
// fires when focus is in the textarea, which is what users expect.
inputEl.addEventListener("paste", async (e) => {
  const items = e.clipboardData?.items || [];
  const files = [];
  for (const it of items) {
    if (it.kind === "file") {
      const f = it.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return;
  e.preventDefault();
  for (const f of files) await stageFile(f);
});

connect();
</script>
<!-- Print target — filled by printResponse() with a copy of a response's
     rendered markdown, then shown alone via the @media print stylesheet. -->
<div id="print-doc" aria-hidden="true"></div>
</body>
