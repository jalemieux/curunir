<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets us pad against the notch / home indicator with
     safe-area insets. We deliberately do NOT lock zoom via the viewport
     (#355, problem #1): iOS Safari has ignored those flags since iOS 10, and
     locking zoom only harms accessibility. Double-tap-to-zoom — the gesture
     that made the first tap on a control "do nothing" — is killed per-control
     with `touch-action: manipulation` instead. Matches desktop index.html. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<!-- PWA / add-to-homescreen (standalone display). iOS reads these meta tags
     rather than the manifest for standalone launch. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Curunir">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Curunir</title>
<script>
  // Apply persisted theme before paint to avoid a flash.
  (function () {
    var t = localStorage.getItem("curunir-theme") || "light";
    if (t !== "light" && t !== "dark") t = "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #ffffff;
  --fg: #1a1a1f;
  --user: #16a34a;
  --tool: #6b7280;
  --muted: #d1d5db;
  --accent: #4f46e5;
  --bubble: #f4f4f8;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --header-text: #6b7280;
  --hint: #9ca3af;
  --code-bg: #f3f4f6;
  --btn-disabled-bg: #e5e7eb;
  --btn-disabled-fg: #9ca3af;
  --hover-bg: #f3f4f6;
  --system-text: #9ca3af;
  --offline: #9ca3af;
  --stop: #dc2626;
  --sheet-scrim: rgba(0, 0, 0, 0.4);
  /* Safe-area insets — 0 on browsers/devices without a notch. */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
[data-theme="dark"] {
  --bg: #0a0a12;
  --fg: #e0e0e0;
  --user: #4ade80;
  --tool: #555;
  --muted: #444;
  --accent: #6366f1;
  --bubble: #12121c;
  --border: #1a1a22;
  --border-strong: #2a2a3e;
  --header-text: #888;
  --hint: #555;
  --code-bg: #1a1a2e;
  --btn-disabled-bg: #2a2a3e;
  --btn-disabled-fg: #666;
  --hover-bg: #1a1a2e;
  --system-text: #666;
  --offline: #555;
  --stop: #f87171;
  --sheet-scrim: rgba(0, 0, 0, 0.6);
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  /* 16px floor everywhere is what actually prevents iOS input auto-zoom. */
  font-size: 16px;
  height: 100dvh;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
/* Opt every tappable control out of double-tap-to-zoom (#355, problem #1).
   Without this, iOS Safari delays each tap ~300ms to see if it's the first
   half of a double-tap-zoom, so the first tap appears to do nothing. Scoped
   to controls (not `*`) so it can't interfere with the pull-to-refresh /
   list-scroll touch handlers. */
button, .conv-row, .skill-row, .es-starter { touch-action: manipulation; }

/* === Views ============================================================== */
.view {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  height: 100dvh;
  background: var(--bg);
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
/* Chat slides in from the right over the list; list sits beneath. */
#chat-view { transform: translateX(100%); z-index: 2; }
#chat-view.open { transform: translateX(0); }
#list-view { z-index: 1; }

/* === Header ============================================================= */
.bar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  padding-top: calc(10px + var(--safe-top));
  padding-left: calc(14px + var(--safe-left));
  padding-right: calc(14px + var(--safe-right));
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  min-height: 52px;
}
.bar .title {
  flex: 1; min-width: 0;
  font-size: 17px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar-btn {
  flex-shrink: 0;
  height: 40px; min-width: 40px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 10px;
  font-size: 20px; line-height: 1; color: var(--fg);
}
.bar-btn:active { background: var(--hover-bg); }
.status-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--offline); flex-shrink: 0;
}
.status-dot.online { background: var(--user); }
.status-dot.reconnecting { background: #f59e0b; }
.status-dot.offline { background: var(--offline); }

/* === Conversation list ================================================== */
#list-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-bottom: calc(16px + var(--safe-bottom));
}
.ptr {
  height: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--header-text); font-size: 13px;
  transition: height 0.2s ease;
}
.ptr.armed { color: var(--accent); }
.conv-row {
  display: flex; flex-direction: column; gap: 3px;
  padding: 15px 16px;
  padding-left: calc(16px + var(--safe-left));
  padding-right: calc(16px + var(--safe-right));
  border-bottom: 1px solid var(--border);
}
.conv-row:active { background: var(--hover-bg); }
.conv-title {
  font-size: 16px; font-weight: 600; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conv-meta { font-size: 13px; color: var(--header-text); }
.list-empty {
  padding: 48px 28px; text-align: center; color: var(--header-text);
}
.list-empty .big { font-size: 18px; color: var(--fg); margin-bottom: 8px; }
.list-empty .sub { font-size: 14px; line-height: 1.5; }

/* New-conversation primary action — fixed above the home indicator. */
#new-fab {
  position: absolute;
  left: calc(16px + var(--safe-left));
  right: calc(16px + var(--safe-right));
  bottom: calc(16px + var(--safe-bottom));
  height: 52px; border: none; border-radius: 14px;
  background: var(--accent); color: #fff;
  font-size: 16px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
  z-index: 3;
}
#new-fab:active { filter: brightness(0.92); }

/* === Chat view ========================================================== */
#messages {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding: 16px;
  padding-left: calc(16px + var(--safe-left));
  padding-right: calc(16px + var(--safe-right));
}
.msg { margin-bottom: 18px; max-width: 100%; }
.msg .role {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--header-text); margin-bottom: 5px;
}
.msg.user .body {
  background: var(--bubble); border-radius: 14px;
  padding: 10px 13px; display: inline-block; max-width: 100%;
  white-space: pre-wrap; word-break: break-word;
}
.msg.assistant .body { word-break: break-word; }
.body { font-size: 16px; line-height: 1.55; }
.body p { margin: 0 0 10px; }
.body p:last-child { margin-bottom: 0; }
.body pre {
  background: var(--code-bg); padding: 12px; border-radius: 10px;
  overflow-x: auto; margin: 10px 0; font-size: 14px;
}
.body code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.9em;
}
.body :not(pre) > code {
  background: var(--code-bg); padding: 1px 5px; border-radius: 5px;
}
.body ul, .body ol { margin: 8px 0 10px 20px; }
.body li { margin: 3px 0; }
.body h1, .body h2, .body h3 { margin: 14px 0 8px; line-height: 1.3; }
.body a { color: var(--accent); }
.body table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid var(--border); padding: 6px 10px; }
.system-msg { color: var(--system-text); font-style: italic; }
code.slash-cmd {
  background: var(--code-bg); padding: 2px 7px; border-radius: 6px;
  font-weight: 600;
}

/* Tool activity ticker (mirrors desktop). */
details.tools { margin-top: 8px; }
details.tools summary {
  list-style: none; cursor: pointer; display: inline-flex;
}
details.tools summary::-webkit-details-marker { display: none; }
.activity-row, .ticker { display: inline-flex; align-items: center; gap: 7px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bubble); border-radius: 20px; padding: 3px 10px;
  font-size: 13px; color: var(--header-text);
}
.pill-dot, .ticker-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.tool-current { font-size: 13px; color: var(--header-text); }
.ticker-count { font-size: 13px; color: var(--header-text); }
.ticker-caret { font-size: 9px; color: var(--hint); }
.tool-list {
  margin-top: 7px; padding-left: 4px;
  border-left: 2px solid var(--border); font-size: 13px; color: var(--tool);
}
.tool-line { padding: 2px 0 2px 10px; word-break: break-all; }
.response-actions { margin-top: 8px; display: flex; gap: 8px; }
.resp-action {
  background: transparent; border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 12px; font-size: 13px; color: var(--header-text);
}
.resp-action:active { background: var(--hover-bg); }

.attachments { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.attachment-image {
  max-width: 100%; max-height: 280px; border-radius: 10px; display: block;
}
.attachment-card {
  display: inline-flex; align-items: center; gap: 9px;
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px;
  max-width: 100%;
}
.attachment-card .badge, .attachment-card .dl { color: var(--header-text); display: flex; }
.attachment-card .meta { min-width: 0; display: flex; flex-direction: column; }
.attachment-card .fname {
  font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.attachment-card .fsub { font-size: 12px; color: var(--header-text); }

.empty-state { padding: 36px 20px; text-align: center; }
.es-greeting { font-size: 19px; color: var(--fg); margin-bottom: 18px; }
.es-list { display: flex; flex-direction: column; gap: 10px; text-align: left; }
.es-starter {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px;
  font-size: 15px;
}
.es-starter:active { background: var(--hover-bg); }
.es-arrow { color: var(--accent); }

/* === Composer =========================================================== */
#composer {
  flex-shrink: 0; border-top: 1px solid var(--border);
  padding: 10px 12px;
  padding-left: calc(12px + var(--safe-left));
  padding-right: calc(12px + var(--safe-right));
  padding-bottom: calc(10px + var(--safe-bottom));
  background: var(--bg);
}
#staged { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
#staged:empty { display: none; }
.attachment {
  font-size: 13px; background: var(--bubble); border-radius: 8px;
  padding: 5px 9px;
}
.composer-row { display: flex; align-items: flex-end; gap: 8px; }
#input {
  flex: 1; min-width: 0; resize: none;
  border: 1px solid var(--border-strong); border-radius: 20px;
  padding: 11px 15px; background: var(--bg); color: var(--fg);
  /* 16px keeps iOS from zooming on focus. */
  font-size: 16px; line-height: 1.4; max-height: 38vh; overflow-y: auto;
}
#input:focus { outline: none; border-color: var(--accent); }
.cbtn {
  flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%;
  border: none; font-size: 19px; display: flex; align-items: center;
  justify-content: center;
}
#attach-btn { background: var(--bubble); color: var(--header-text); }
#send-btn { background: var(--accent); color: #fff; }
#send-btn:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-fg); }
#send-btn[data-mode="stop"] { background: var(--stop); }

/* === Bottom sheet (switcher / skills) =================================== */
.sheet-scrim {
  position: fixed; inset: 0; background: var(--sheet-scrim);
  z-index: 50; display: flex; align-items: flex-end;
}
.sheet-scrim[hidden] { display: none; }
.sheet {
  width: 100%; max-height: 75vh; background: var(--bg);
  border-radius: 18px 18px 0 0;
  padding-bottom: calc(8px + var(--safe-bottom));
  display: flex; flex-direction: column;
  animation: sheet-up 0.26s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-grip {
  width: 40px; height: 4px; border-radius: 2px; background: var(--muted);
  margin: 10px auto 4px;
}
.sheet-head {
  padding: 8px 16px 12px; font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--header-text);
}
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-search {
  margin: 0 16px 10px; padding: 11px 14px; font-size: 16px;
  border: 1px solid var(--border-strong); border-radius: 10px;
  background: var(--bg); color: var(--fg); width: calc(100% - 32px);
}
.sheet-search:focus { outline: none; border-color: var(--accent); }
.skill-row {
  padding: 13px 16px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 11px;
}
.skill-row:active { background: var(--hover-bg); }
.skill-name { font-size: 16px; font-weight: 600; }
.skill-summary { font-size: 13px; color: var(--header-text); margin-top: 2px; }
.skill-icon { font-size: 18px; }
.skills-empty { padding: 20px 16px; color: var(--header-text); font-size: 14px; }

/* === Offline modal ====================================================== */
#offline-overlay {
  position: fixed; inset: 0; z-index: 80;
  background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 32px;
}
#offline-overlay[hidden] { display: none; }
#offline-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
#offline-sub { font-size: 14px; color: var(--header-text); line-height: 1.5; max-width: 320px; }
.spinner {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--accent);
  animation: spin 0.8s linear infinite; margin-bottom: 18px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media print {
  body > *:not(#print-doc) { display: none !important; }
  #print-doc { display: block !important; color: #000; background: #fff; }
}
#print-doc { display: none; }
</style>
</head>
<body>

<!-- ============================ List (home) view ====================== -->
<div id="list-view" class="view">
  <div class="bar">
    <div class="title">Curunir</div>
    <span id="status-dot" class="status-dot offline" title="agent status"></span>
    <button id="list-theme-btn" class="bar-btn" aria-label="Toggle theme">☾</button>
  </div>
  <div id="list-scroll">
    <div id="ptr" class="ptr">Pull to refresh</div>
    <div id="conversation-list"></div>
  </div>
  <button id="new-fab">＋ New conversation</button>
</div>

<!-- ============================ Chat view ============================= -->
<div id="chat-view" class="view">
  <div class="bar">
    <button id="back-btn" class="bar-btn" aria-label="Back to conversations">‹</button>
    <div id="chat-title" class="title">Curunir</div>
    <button id="switch-btn" class="bar-btn" aria-label="Switch conversation">⇆</button>
    <button id="skills-btn" class="bar-btn" aria-label="Skills">✦</button>
  </div>
  <div id="messages"></div>
  <div id="composer">
    <div id="staged"></div>
    <div class="composer-row">
      <button id="attach-btn" class="cbtn" aria-label="Attach file">＋</button>
      <textarea id="input" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>
      <button id="send-btn" class="cbtn" data-mode="send" aria-label="Send" disabled>↑</button>
    </div>
    <input id="file-input" type="file" hidden multiple
      accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,.docx,.md,.txt,.csv,.json,.yaml,.yml,.log,.xml,.toml,.ini">
  </div>
</div>

<!-- ============================ Bottom sheets ========================= -->
<div id="switch-scrim" class="sheet-scrim" hidden>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">Switch conversation</div>
    <div id="switch-list" class="sheet-body"></div>
  </div>
</div>

<div id="skills-scrim" class="sheet-scrim" hidden>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">Skills</div>
    <input id="skills-search" class="sheet-search" placeholder="Search skills…" enterkeyhint="search">
    <div id="skills-list" class="sheet-body"></div>
  </div>
</div>

<!-- ============================ Offline modal ========================= -->
<div id="offline-overlay" hidden>
  <div class="spinner"></div>
  <div id="offline-title">Connecting to your agent…</div>
  <div id="offline-sub">This screen will clear automatically once it connects.</div>
</div>

<div id="print-doc" aria-hidden="true"></div>

<script>
// ============================================================================
// Mobile portal SPA (#304). Standalone shell that speaks the SAME /ws/browser
// protocol as the desktop index.html — session_id binding, history_request,
// conversations_request, skills_request, slash, interrupt — with a
// conversation-list-first navigation model. No backend changes.
//
// Two views: a conversation LIST (home) and a CHAT. The active session_id is
// ALWAYS an explicit, visible selection (tap a row, or tap New) — never an
// invisible localStorage carry-over, which is what routed mobile messages to
// the wrong thread before (#304, problem #3).
// ============================================================================

// === Constants ===
const SCRATCH_SESSION_ID = "scratch";
const MAX_IMAGE = 5 * 1024 * 1024;
const MAX_PDF = 10 * 1024 * 1024;
const MAX_DOCX = 10 * 1024 * 1024;
const MAX_TEXT = 256 * 1024;
const MAX_TOTAL = 20 * 1024 * 1024;
const IMAGE_MIMES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
const TEXT_EXTS = [".md", ".txt", ".csv", ".json", ".yaml", ".yml", ".log", ".xml", ".toml", ".ini"];

// === Elements ===
const listView = document.getElementById("list-view");
const chatView = document.getElementById("chat-view");
const listScroll = document.getElementById("list-scroll");
const ptrEl = document.getElementById("ptr");
const conversationListEl = document.getElementById("conversation-list");
const newFab = document.getElementById("new-fab");
const listThemeBtn = document.getElementById("list-theme-btn");
const statusDot = document.getElementById("status-dot");
const backBtn = document.getElementById("back-btn");
const chatTitle = document.getElementById("chat-title");
const switchBtn = document.getElementById("switch-btn");
const skillsBtn = document.getElementById("skills-btn");
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const attachBtn = document.getElementById("attach-btn");
const fileInput = document.getElementById("file-input");
const stagedEl = document.getElementById("staged");
const switchScrim = document.getElementById("switch-scrim");
const switchListEl = document.getElementById("switch-list");
const skillsScrim = document.getElementById("skills-scrim");
const skillsSearch = document.getElementById("skills-search");
const skillsListEl = document.getElementById("skills-list");
const hljsLight = document.getElementById("hljs-light");
const hljsDark = document.getElementById("hljs-dark");
const offlineOverlay = document.getElementById("offline-overlay");
const offlineTitle = document.getElementById("offline-title");
const offlineSub = document.getElementById("offline-sub");

// === State ===
// `sessionId` is the currently bound session. It starts as a throwaway
// "bootstrap" id used only to bind the socket so we can pull the conversation
// list before any chat is opened. It becomes a real chat session the moment
// the user taps a row (existing id) or New (a fresh uuid). It is NOT persisted
// as "the active chat" — the home view is the list, not a chat.
let sessionId = crypto.randomUUID();
let chatOpen = false;
let ws = null;
let agentOnline = false;
// True once bootstrapSync() has run for the current online period. Reset
// whenever the agent goes offline, so the next offline→online edge re-syncs
// exactly once (and onopen's own sync doesn't double-fire). See #334 / #355.
let bootstrappedOnline = false;
let staged = [];
let inProgressMsg = null;
let historyAssistant = null;
let skillsCache = null;
let conversations = [];
let backoff = 1000;

// === Markdown ===
marked.setOptions({
  highlight: (code, lang) => hljs.highlightAuto(code, lang ? [lang] : undefined).value,
  breaks: true,
});

// === Theme ===
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  hljsLight.disabled = theme !== "light";
  hljsDark.disabled = theme !== "dark";
  listThemeBtn.textContent = theme === "light" ? "☾" : "☀";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  const next = current === "light" ? "dark" : "light";
  localStorage.setItem("curunir-theme", next);
  applyTheme(next);
}
applyTheme(document.documentElement.getAttribute("data-theme") || "light");

// === Status / offline modal ===
function setStatus(state) {
  statusDot.className = "status-dot " + state;
  statusDot.title = "agent " + state;
  const wasOnline = agentOnline;
  agentOnline = state === "online";
  // Recover the bootstrap frames that were dropped when the browser connected
  // before the agent container had dialed in (#355, problem #2 — the mobile
  // analog of #334). The browser↔portal socket stays open across an agent
  // cold-start, so ws.onopen never re-fires; instead we re-issue
  // conversations/skills/history on the agent's offline→online edge. The
  // bootstrappedOnline flag dedupes against onopen's own sync and against
  // repeated online frames within one online period.
  if (agentOnline && !wasOnline) {
    if (!bootstrappedOnline) bootstrapSync();
    bootstrappedOnline = true;
  } else if (!agentOnline) {
    bootstrappedOnline = false;
  }
  if (!agentOnline && inProgressMsg) {
    finalizeActivity(inProgressMsg);
    inProgressMsg.classList.remove("stopping");
    inProgressMsg = null;
  }
  updateComposerMode();
  // The offline modal only makes sense while a chat is open — on the list the
  // status dot is enough and we don't want to block browsing the list.
  updateOfflineModal(state);
}
function updateOfflineModal(state) {
  offlineOverlay.hidden = !chatOpen || state === "online";
  if (state === "reconnecting") {
    offlineTitle.textContent = "Connecting to your agent…";
    offlineSub.textContent = "This screen will clear automatically once it connects.";
  } else if (state === "offline") {
    offlineTitle.textContent = "Agent offline";
    offlineSub.textContent =
      "Your agent isn't connected right now. This screen will clear automatically once it reconnects.";
  }
}

// === Composer mode (send / stop) ===
function updateComposerMode() {
  const responding = inProgressMsg !== null;
  if (responding && agentOnline) {
    sendBtn.dataset.mode = "stop";
    sendBtn.textContent = "■";
    sendBtn.setAttribute("aria-label", "Stop");
    sendBtn.disabled = false;
  } else {
    sendBtn.dataset.mode = "send";
    sendBtn.textContent = "↑";
    sendBtn.setAttribute("aria-label", "Send");
    sendBtn.disabled = !agentOnline;
  }
}

// === Bootstrap sync ===
// Pull everything the current view needs from the agent: the conversation list
// and skill catalog (for the home view's empty-state starters), plus the open
// chat's transcript. Fired from ws.onopen AND re-fired on the agent's
// offline→online edge in setStatus (#355, problem #2) — the onopen frames are
// dropped if the agent container hasn't dialed into the portal yet. The
// readyState guards in requestConversations/requestHistory make a half-open
// socket a no-op rather than a throw. Idempotent: every request is a snapshot
// read.
function bootstrapSync() {
  requestConversations();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ command: "skills_request", session_id: sessionId }));
  }
  // If a chat is open (across a reconnect, or the user tapped into a
  // conversation while the agent was still connecting), re-pull its transcript.
  if (chatOpen) requestHistory();
}

// === WS connect ===
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/browser`);
  setStatus("reconnecting");
  ws.onopen = () => {
    backoff = 1000;
    bootstrapSync();
  };
  ws.onmessage = (e) => onServerMessage(JSON.parse(e.data));
  ws.onclose = () => {
    setStatus("offline");
    setTimeout(connect, backoff + Math.random() * 500);
    backoff = Math.min(backoff * 2, 30000);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

// === Inbound dispatch ===
function onServerMessage(msg) {
  if (msg.type === "agent_status") { setStatus(msg.status); return; }
  if (msg.type === "history_snapshot") {
    messagesEl.innerHTML = "";
    inProgressMsg = null;
    historyAssistant = null;
    for (const m of msg.messages) renderHistoryEntry(m);
    if (!msg.messages.length) renderEmptyState();
    for (const el of messagesEl.querySelectorAll(".msg.assistant")) appendResponseActions(el);
    updateComposerMode();
    return;
  }
  if (msg.type === "skills_snapshot") {
    skillsCache = msg.skills || [];
    if (!skillsScrim.hidden) renderSkillsList(skillsCache, skillsSearch.value);
    if (messagesEl.querySelector(".empty-state")) renderEmptyState();
    return;
  }
  if (msg.type === "conversations_snapshot") {
    conversations = msg.conversations || [];
    renderConversations();
    if (!switchScrim.hidden) renderSwitchList();
    return;
  }
  // Ignore scratchpad traffic — the mobile UI has no scratchpad surface.
  if (msg.session_id === SCRATCH_SESSION_ID) return;
  // Drop frames for a session other than the one currently open (the portal
  // socket is multiplexed; a stale turn may still be streaming).
  if (msg.session_id && msg.session_id !== sessionId) return;
  renderAgentChunk(msg);
}

// === Message rendering (shared shape with desktop index.html) ===
function setUserBody(bodyEl, content) {
  const text = content || "";
  const leading = text.length - text.trimStart().length;
  const match = text.slice(leading).match(/^\/[A-Za-z][\w-]*/);
  if (match) {
    bodyEl.textContent = "";
    const code = document.createElement("code");
    code.className = "slash-cmd";
    code.textContent = match[0];
    bodyEl.appendChild(code);
    const remainder = text.slice(leading + match[0].length);
    if (remainder) bodyEl.appendChild(document.createTextNode(remainder));
  } else {
    bodyEl.textContent = text;
  }
}

function renderHistoryEntry(m) {
  if (m.role === "user") {
    historyAssistant = null;
    const el = appendMessage("user");
    setUserBody(el.querySelector(".body"), m.content || "");
    renderAttachments(el, m.attachments);
  } else if (m.role === "assistant") {
    const el = historyAssistant || (historyAssistant = appendMessage("assistant"));
    const body = el.querySelector(".body");
    if (m.content) {
      body.dataset.raw = body.dataset.raw ? body.dataset.raw + "\n\n" + m.content : m.content;
      body.innerHTML = marked.parse(body.dataset.raw);
    }
    appendToolCalls(el, m.tool_calls);
    renderAttachments(el, m.attachments);
  } else if (m.role === "system") {
    historyAssistant = null;
    const el = appendMessage("assistant");
    el.querySelector(".body").innerHTML = `<em class="system-msg">${m.content}</em>`;
  }
}

function ensureActivityIndicator(msgEl, live) {
  let tools = msgEl.querySelector("details.tools");
  if (tools) return tools;
  tools = document.createElement("details");
  tools.className = live ? "tools live" : "tools";
  if (live) {
    tools.innerHTML =
      '<summary><div class="activity-row">' +
      '<span class="pill"><span class="pill-dot"></span><span class="pill-label">Thinking</span></span>' +
      '<span class="tool-current"></span><span class="ticker-caret">▶</span>' +
      '</div></summary><div class="tool-list"></div>';
  } else {
    tools.innerHTML =
      '<summary><div class="ticker"><span class="ticker-dot"></span>' +
      '<span class="ticker-count"></span><span class="ticker-caret">▶</span>' +
      '</div></summary><div class="tool-list"></div>';
  }
  msgEl.appendChild(tools);
  return tools;
}

function appendToolCalls(msgEl, calls) {
  if (!calls || !calls.length) return;
  const tools = ensureActivityIndicator(msgEl, false);
  const list = tools.querySelector(".tool-list");
  for (const t of calls) {
    const line = document.createElement("div");
    line.className = "tool-line";
    line.textContent = t;
    list.appendChild(line);
  }
  if (tools.classList.contains("live")) {
    tools.classList.add("has-tools");
  } else {
    const total = list.children.length;
    tools.querySelector(".ticker-count").textContent = total === 1 ? "1 tool" : `${total} tools`;
  }
}

function setCurrentTool(msgEl, summary) {
  const cur = msgEl.querySelector("details.tools.live .tool-current");
  if (cur) cur.textContent = toStatusLabel(summary);
}

function finalizeActivity(msgEl) {
  if (!msgEl) return;
  const tools = msgEl.querySelector("details.tools.live");
  if (!tools) return;
  const list = tools.querySelector(".tool-list");
  const total = list ? list.children.length : 0;
  if (total === 0) { tools.remove(); return; }
  tools.classList.remove("live", "has-tools");
  tools.querySelector("summary").innerHTML =
    '<div class="ticker"><span class="ticker-dot"></span>' +
    '<span class="ticker-count">' + (total === 1 ? "1 tool" : total + " tools") + '</span>' +
    '<span class="ticker-caret">▶</span></div>';
}

const TOOL_GERUNDS = {
  Read: "Reading", Write: "Writing", Edit: "Editing",
  Grep: "Searching", Glob: "Searching", Bash: "Running",
  LoadSkill: "Loading skill", WebFetch: "Fetching", Delegate: "Delegating",
};
function toStatusLabel(summary) {
  const sp = summary.indexOf(" ");
  const verb = sp === -1 ? summary : summary.slice(0, sp);
  const g = TOOL_GERUNDS[verb];
  return (g ? g + summary.slice(sp) : summary) + "…";
}

function appendResponseActions(msgEl) {
  if (!msgEl || !msgEl.classList.contains("assistant")) return;
  const body = msgEl.querySelector(".body");
  if (!body || !body.dataset.raw) return;
  const existing = msgEl.querySelector(".response-actions");
  if (existing) existing.remove();
  const wrap = document.createElement("div");
  wrap.className = "response-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "resp-action";
  copyBtn.textContent = "Copy";
  copyBtn.addEventListener("click", () => copyResponse(body.dataset.raw, copyBtn));
  wrap.appendChild(copyBtn);
  msgEl.appendChild(wrap);
}

async function copyResponse(rawText, btn) {
  const original = btn.textContent;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(rawText);
      ok = true;
    } else {
      const ta = document.createElement("textarea");
      ta.value = rawText;
      ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    }
  } catch {}
  btn.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(() => { btn.textContent = original; }, 1500);
}

function renderAgentChunk(m) {
  if (!inProgressMsg) inProgressMsg = appendMessage("assistant", true);
  const body = inProgressMsg.querySelector(".body");
  if (m.delta) {
    body.dataset.raw = (body.dataset.raw || "") + (m.content || "");
    body.innerHTML = marked.parse(body.dataset.raw);
  } else if (m.content) {
    body.dataset.raw = m.content;
    body.innerHTML = marked.parse(m.content);
  }
  appendToolCalls(inProgressMsg, m.tool_calls);
  renderAttachments(inProgressMsg, m.attachments);
  if (m.tool_calls && m.tool_calls.length) {
    setCurrentTool(inProgressMsg, m.tool_calls[m.tool_calls.length - 1]);
  }
  if (m.final) {
    finalizeActivity(inProgressMsg);
    inProgressMsg.classList.remove("stopping");
    appendResponseActions(inProgressMsg);
    inProgressMsg = null;
    // Refresh the list so a brand-new conversation appears with its title.
    requestConversations();
  }
  updateComposerMode();
  scrollToBottom();
}

const DOC_ICON =
  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 ' +
  '2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
const DL_ICON =
  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
  '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

function renderAttachments(parent, atts) {
  if (!atts || !atts.length) return;
  const wrap = document.createElement("div");
  wrap.className = "attachments";
  for (const a of atts) {
    const name = a.filename || a.path || "file";
    const hasData = typeof a.data === "string";
    if (hasData && typeof a.mime_type === "string" && a.mime_type.startsWith("image/")) {
      const img = document.createElement("img");
      img.className = "attachment-image";
      img.src = "data:" + a.mime_type + ";base64," + a.data;
      img.alt = name;
      img.onclick = () => downloadAttachment(a);
      wrap.appendChild(img);
      continue;
    }
    const ext = name.includes(".") ? name.split(".").pop().toUpperCase() : "";
    const downloadable = hasData;
    const card = document.createElement("span");
    card.className = "attachment-card";
    card.innerHTML =
      '<span class="badge">' + DOC_ICON + '</span>' +
      '<span class="meta"><span class="fname"></span><span class="fsub"></span></span>' +
      (downloadable ? '<span class="dl">' + DL_ICON + '</span>' : '');
    card.querySelector(".fname").textContent = name;
    card.querySelector(".fsub").textContent = downloadable
      ? (ext ? ext + " · tap to download" : "Tap to download")
      : (ext ? ext + " file" : "Attachment");
    if (downloadable) card.onclick = () => downloadAttachment(a);
    wrap.appendChild(card);
  }
  if (parent.classList && parent.classList.contains("user")) {
    const body = parent.querySelector(".body");
    body.insertBefore(wrap, body.firstChild);
  } else {
    parent.appendChild(wrap);
  }
}

function downloadAttachment(a) {
  const bin = atob(a.data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: a.mime_type || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = a.filename || "download";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function appendMessage(role, thinking = false) {
  const es = messagesEl.querySelector(".empty-state");
  if (es) es.remove();
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.innerHTML = `<div class="role">${role === "user" ? "you" : "curunir"}</div><div class="body"></div>`;
  if (thinking) ensureActivityIndicator(el, true);
  messagesEl.appendChild(el);
  // New bubbles (own send, history load) always scroll; only streaming
  // deltas into an existing bubble respect the reader's position.
  scrollToBottom(true);
  return el;
}

// Stick-to-bottom: auto-follow the stream only while the reader is at (or
// within 48px of) the bottom. Updated on user scrolls; content growth fires
// no scroll event, so a pinned reader stays pinned while the stream grows
// the pane. The programmatic scroll lands at the bottom and re-confirms it.
// (Canonical copy with node tests: src/local_ui/static/chat.js.)
let scrollPinned = true;
messagesEl.addEventListener("scroll", () => {
  scrollPinned =
    messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight <= 48;
});

function scrollToBottom(force = false) {
  if (!force && !scrollPinned) return;
  scrollPinned = true;
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

// === Empty-state starters (in an open, empty chat) ===
function renderEmptyState() {
  const existing = messagesEl.querySelector(".empty-state");
  if (existing) existing.remove();
  const wrap = document.createElement("div");
  wrap.className = "empty-state";
  const greeting = document.createElement("div");
  greeting.className = "es-greeting";
  greeting.textContent = "What would you like to do?";
  wrap.appendChild(greeting);
  const skills = (skillsCache || []).filter(s => s.starter);
  if (skills.length) {
    const list = document.createElement("div");
    list.className = "es-list";
    for (const s of skills) {
      const row = document.createElement("div");
      row.className = "es-starter";
      row.innerHTML = '<span class="es-arrow">→</span><span class="es-text"></span>';
      row.querySelector(".es-text").textContent = s.summary;
      row.addEventListener("click", () => fillComposer("/" + s.name + " "));
      list.appendChild(row);
    }
    wrap.appendChild(list);
  }
  messagesEl.appendChild(wrap);
}

function fillComposer(text) {
  inputEl.value = text;
  inputEl.focus();
  inputEl.setSelectionRange(text.length, text.length);
  autosizeInput();
}

// === Skills sheet ===
function openSkills() {
  skillsScrim.hidden = false;
  skillsSearch.value = "";
  if (skillsCache) {
    renderSkillsList(skillsCache);
  } else {
    skillsListEl.innerHTML = '<div class="skills-empty">Loading…</div>';
    ws.send(JSON.stringify({ command: "skills_request", session_id: sessionId }));
  }
}
function closeSkills() { skillsScrim.hidden = true; }
function renderSkillsList(skills, filter = "") {
  if (!skills.length) {
    skillsListEl.innerHTML = '<div class="skills-empty">No skills available yet.</div>';
    return;
  }
  const f = filter.trim().toLowerCase();
  const shown = f
    ? skills.filter(s => s.display_name.toLowerCase().includes(f) || s.summary.toLowerCase().includes(f))
    : skills;
  if (!shown.length) {
    skillsListEl.innerHTML = '<div class="skills-empty">No matches.</div>';
    return;
  }
  skillsListEl.innerHTML = "";
  for (const s of shown) {
    const row = document.createElement("div");
    row.className = "skill-row";
    row.innerHTML = '<div><div class="skill-name"></div><div class="skill-summary"></div></div>';
    row.querySelector(".skill-name").textContent = s.display_name;
    row.querySelector(".skill-summary").textContent = s.summary;
    row.addEventListener("click", () => launchSkill("/" + s.name));
    skillsListEl.appendChild(row);
  }
}
function launchSkill(slashText) {
  closeSkills();
  if (!agentOnline) return;
  const el = appendMessage("user");
  setUserBody(el.querySelector(".body"), slashText);
  ws.send(JSON.stringify({ command: "slash", text: slashText, session_id: sessionId }));
  if (!inProgressMsg) inProgressMsg = appendMessage("assistant", true);
  updateComposerMode();
}

// === Send / interrupt ===
function send() {
  const content = inputEl.value.trim();
  if (!content && staged.length === 0) return;
  if (!agentOnline) return;
  if (content.startsWith("/") && staged.length === 0) {
    const el = appendMessage("user");
    setUserBody(el.querySelector(".body"), content);
    ws.send(JSON.stringify({ command: "slash", text: content, session_id: sessionId }));
    inputEl.value = "";
    autosizeInput();
    if (!inProgressMsg) inProgressMsg = appendMessage("assistant", true);
    updateComposerMode();
    return;
  }
  const el = appendMessage("user");
  el.querySelector(".body").textContent = content;
  renderAttachments(el, staged.map(a => ({ filename: a.filename })));
  ws.send(JSON.stringify({
    content,
    session_id: sessionId,
    attachments: staged.length ? staged.map(a => ({
      filename: a.filename, mime_type: a.mime_type, data: a.data,
    })) : null,
  }));
  inputEl.value = "";
  autosizeInput();
  staged = [];
  renderStaged();
  if (!inProgressMsg) inProgressMsg = appendMessage("assistant", true);
  updateComposerMode();
}

function interrupt() {
  if (!inProgressMsg || !agentOnline || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ command: "interrupt", session_id: sessionId }));
  inProgressMsg.classList.add("stopping");
  sendBtn.dataset.mode = "send";
  sendBtn.textContent = "↑";
  sendBtn.setAttribute("aria-label", "Send");
}

// === Attachments staging ===
function bytesToBase64(bytes) {
  const CHUNK = 0x8000;
  let binary = "";
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}
async function stageFile(file) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
  const isImg = file.type.startsWith("image/");
  const isPdf = file.type === "application/pdf" || ext === ".pdf";
  const isDocx = file.type === DOCX_MIME || ext === ".docx";
  const isText = !isImg && !isPdf && !isDocx && (
    file.type.startsWith("text/") || file.type === "application/json" || TEXT_EXTS.includes(ext)
  );
  if (isImg && !IMAGE_MIMES.includes(file.type)) { alert(`Unsupported image type: ${file.type}`); return; }
  if (!isImg && !isPdf && !isDocx && !isText) {
    alert(`Unsupported file type: ${file.name}`); return;
  }
  if (isImg && file.size > MAX_IMAGE) { alert(`Image > 5 MB`); return; }
  if (isPdf && file.size > MAX_PDF) { alert(`PDF > 10 MB`); return; }
  if (isDocx && file.size > MAX_DOCX) { alert(`DOCX > 10 MB`); return; }
  if (isText && file.size > MAX_TEXT) { alert(`Text > 256 KB`); return; }
  const totalAfter = staged.reduce((s, a) => s + a.size, 0) + file.size;
  if (totalAfter > MAX_TOTAL) { alert(`Total > 20 MB`); return; }
  const buf = await file.arrayBuffer();
  staged.push({
    filename: file.name,
    mime_type: file.type || "application/octet-stream",
    data: bytesToBase64(new Uint8Array(buf)),
    size: file.size,
  });
  renderStaged();
}
function renderStaged() {
  stagedEl.innerHTML = "";
  staged.forEach((a, i) => {
    const chip = document.createElement("span");
    chip.className = "attachment";
    chip.textContent = `📎 ${a.filename} ✕`;
    chip.onclick = () => { staged.splice(i, 1); renderStaged(); };
    stagedEl.appendChild(chip);
  });
}

// === Conversation list (home) ===
function requestConversations() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ command: "conversations_request", session_id: sessionId }));
}
function requestHistory() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ content: "", command: "history_request", session_id: sessionId }));
}
function relativeTime(iso) {
  if (!iso) return "";
  const then = new Date(iso).getTime();
  if (isNaN(then)) return "";
  const s = Math.max(0, (Date.now() - then) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 7) return d + "d ago";
  return new Date(iso).toLocaleDateString();
}
function renderConversations() {
  conversationListEl.innerHTML = "";
  if (!conversations.length) {
    const empty = document.createElement("div");
    empty.className = "list-empty";
    empty.innerHTML =
      '<div class="big">No conversations yet</div>' +
      '<div class="sub">Tap “New conversation” below to start chatting with your agent.</div>';
    conversationListEl.appendChild(empty);
    return;
  }
  for (const c of conversations) {
    const row = document.createElement("div");
    row.className = "conv-row";
    row.innerHTML = '<div class="conv-title"></div><div class="conv-meta"></div>';
    row.querySelector(".conv-title").textContent = c.title || "New conversation";
    row.querySelector(".conv-meta").textContent = relativeTime(c.updated_at);
    row.addEventListener("click", () => openConversation(c.session_id, c.title));
    conversationListEl.appendChild(row);
  }
}

// === Navigation ===
function showChat() {
  chatOpen = true;
  chatView.classList.add("open");
  updateOfflineModal(agentOnline ? "online" : "offline");
  updateComposerMode();
}
function showList() {
  chatOpen = false;
  chatView.classList.remove("open");
  offlineOverlay.hidden = true;
  // Returning to the list rebinds nothing — but refresh so titles/timestamps
  // reflect the conversation we just left.
  requestConversations();
}
function openConversation(id, title) {
  // Explicit selection — the active session_id is now this visible row.
  sessionId = id;
  chatTitle.textContent = title || "Conversation";
  messagesEl.innerHTML = "";
  inProgressMsg = null;
  staged = [];
  renderStaged();
  requestHistory();
  showChat();
  inputEl.focus();
}
function startNew() {
  // A fresh, explicit session — never an invisible carry-over (#304 problem #3).
  sessionId = crypto.randomUUID();
  chatTitle.textContent = "New conversation";
  messagesEl.innerHTML = "";
  inProgressMsg = null;
  staged = [];
  renderStaged();
  inputEl.value = "";
  renderEmptyState();
  showChat();
  inputEl.focus();
}

// === Switch-conversation bottom sheet ===
function openSwitch() {
  switchScrim.hidden = false;
  requestConversations();
  renderSwitchList();
}
function closeSwitch() { switchScrim.hidden = true; }
function renderSwitchList() {
  switchListEl.innerHTML = "";
  if (!conversations.length) {
    switchListEl.innerHTML = '<div class="skills-empty">No other conversations.</div>';
    return;
  }
  for (const c of conversations) {
    const row = document.createElement("div");
    row.className = "skill-row";
    row.innerHTML = '<div><div class="skill-name"></div><div class="skill-summary"></div></div>';
    row.querySelector(".skill-name").textContent = c.title || "New conversation";
    row.querySelector(".skill-summary").textContent = relativeTime(c.updated_at);
    row.addEventListener("click", () => {
      closeSwitch();
      if (c.session_id !== sessionId) openConversation(c.session_id, c.title);
    });
    switchListEl.appendChild(row);
  }
}

// === Pull-to-refresh on the list ===
// Only arms when the list is already scrolled to the very top, so it never
// fights normal scrolling.
let ptrStartY = 0, ptrPulling = false, ptrArmed = false;
const PTR_THRESHOLD = 64;
listScroll.addEventListener("touchstart", (e) => {
  if (listScroll.scrollTop <= 0) {
    ptrStartY = e.touches[0].clientY;
    ptrPulling = true;
    ptrArmed = false;
  }
}, { passive: true });
listScroll.addEventListener("touchmove", (e) => {
  if (!ptrPulling) return;
  const dy = e.touches[0].clientY - ptrStartY;
  if (dy <= 0) { ptrEl.style.height = "0px"; ptrArmed = false; return; }
  const h = Math.min(dy * 0.5, 80);
  ptrEl.style.height = h + "px";
  ptrArmed = h >= PTR_THRESHOLD * 0.5;
  ptrEl.classList.toggle("armed", ptrArmed);
  ptrEl.textContent = ptrArmed ? "Release to refresh" : "Pull to refresh";
}, { passive: true });
listScroll.addEventListener("touchend", () => {
  if (!ptrPulling) return;
  ptrPulling = false;
  if (ptrArmed) {
    ptrEl.textContent = "Refreshing…";
    requestConversations();
  }
  ptrEl.style.height = "0px";
  ptrEl.classList.remove("armed");
});

// === Composer autosize ===
function autosizeInput() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, window.innerHeight * 0.38) + "px";
}

// === Wiring ===
newFab.onclick = startNew;
listThemeBtn.onclick = toggleTheme;
backBtn.onclick = showList;
switchBtn.onclick = openSwitch;
skillsBtn.onclick = openSkills;
sendBtn.onclick = () => { if (sendBtn.dataset.mode === "stop") interrupt(); else send(); };
attachBtn.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  for (const f of fileInput.files) await stageFile(f);
  fileInput.value = "";
};
inputEl.addEventListener("input", autosizeInput);
inputEl.addEventListener("keydown", (e) => {
  // The send button is the primary path on touch; the textarea uses
  // enterkeyhint="send" so the on-screen return key reads as "send". Honour
  // Enter-without-Shift here so it works for hardware keyboards too. Guard
  // isComposing so IME candidate selection doesn't submit mid-composition.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
switchScrim.addEventListener("click", (e) => { if (e.target === switchScrim) closeSwitch(); });
skillsScrim.addEventListener("click", (e) => { if (e.target === skillsScrim) closeSkills(); });
skillsSearch.addEventListener("input", () => {
  if (skillsCache) renderSkillsList(skillsCache, skillsSearch.value);
});

renderConversations();
connect();
</script>
</body>
</html>
