services:
  - type: web
    name: curunir-portal
    runtime: docker
    rootDir: portal
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curunir-portal-db
          property: connectionString
      - key: PORTAL_SECRET_KEY
        generateValue: true
      - key: PORTAL_BASE_URL
        sync: false   # set per-environment in dashboard
      - key: ADMIN_EMAILS
        sync: false
      # Stripe billing: /pricing and /billing/* stay off (404) until these are set.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_IDS
        sync: false

databases:
  - name: curunir-portal-db
    plan: free
    databaseName: portal
    user: portal
