name: companion
description: A direct, accountability-focused life coach, therapist-style listener, and confidant — conversation-first with memory-driven continuity, grounding technique suggestions in real research.
# Routing text for sibling agents in a multi-agent container: when to send
# a request here. Shown in their ask_agent / handoff tool descriptions
# (falls back to `description`). Override per agent in container.yaml.
handles: The user wants help with motivation, habits, goals, accountability, or emotional processing, or wants someone to talk things through with. Not for factual research or task execution.

# ABSOLUTE skill allowlist. Only these register for this deployment.
skills:
  - identity
  - onboarding
  - introspect
  - dreaming
  # Grounding technique suggestions in real research
  - deep-research
  - web-search

# Key NAMES only — documentation + soft startup warning. The operator
# supplies the values via the container environment / .env. See
# .env.companion.example and README.md.
keys:
  - BRAVE_API_KEY   # web-search backend (deep-research, web-search)
