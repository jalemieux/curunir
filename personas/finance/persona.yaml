name: finance
description: Local, private personal-finance assistant — capital allocation, position tracking, investment-thesis lifecycle, tax strategy.
# Routing text for sibling agents in a multi-agent container: when to send
# a request here. Shown in their ask_agent / handoff tool descriptions
# (falls back to `description`). Override per agent in container.yaml.
handles: The user's own money. Net worth, holdings, trades, capital allocation, an investment thesis, or tax strategy. Not for general market trivia unrelated to their finances.

# ABSOLUTE skill allowlist. Only these register for this deployment.
skills:
  - dreaming
  - identity
  - onboarding
  - introspect
  - financial-analysis
  - investment-memo
  - tax-strategy
  - balance-sheet
  - fred
  - sec-edgar
  - yfinance
  # Research, sentiment & forward-looking signal
  - catalyst-memo
  - deep-research
  - fact-checker
  - polymarket
  - digest
  - reddit-research
  - youtube-transcript
  - podcast-ingest
  # Outbound delivery — the digest skill's deliver step loads this to email
  # the result; scheduled digests can't reach the user without it.
  - email-send
  # Web-search backends the research skills depend on
  - web-search
  - xai-search
  - gemini-search

# Key NAMES only — documentation + soft startup warning. The operator
# supplies the values via the container environment / .env. See
# .env.finance.example and README.md.
keys:
  - FRED_API_KEY
  - BRAVE_API_KEY   # web-search, reddit-research, digest
  - XAI_API_KEY     # xai-search, reddit-research
  - GEMINI_API_KEY  # gemini-search
