<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curunir — Local Console</title>
<!-- Pinned to v4: the setOptions({highlight}) API used by chat.js was removed
     in marked v5+. Matches the portal. -->
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<!-- Two highlight.js themes; chat.js toggles `disabled` to match light/dark. -->
<link id="cu-hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github.min.css" />
<link id="cu-hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github-dark.min.css" disabled />
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
<!-- Human-readable cron for the Schedules panel. Vendored locally (served from
     /static) so the loopback/Docker console works without CDN reachability. -->
<script src="/static/cronstrue.min.js"></script>
<!-- Shared chat-pane styles + console theme tokens (light default / dark). -->
<link rel="stylesheet" href="/static/chat.css" />
<style>
  /* Read-panel chrome only. Theme tokens (--bg, --fg, --border, --panel,
     --muted, --accent, --ok, --err …) come from chat.css so the panels
     re-theme together with the chat when the theme toggles. */
  /* Token-class palette for the Usage dashboard (input / output / cached). */
  :root { --c-in: #6366f1; --c-out: #22c55e; --c-cache: #06b6d4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
    Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .persona-tag {
    display: none; margin-left: 8px; padding: 1px 7px; border-radius: 5px;
    border: 1px solid var(--warn); color: var(--warn); font-size: 11px;
    font-weight: 600; letter-spacing: 0.3px; vertical-align: middle;
  }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { color: var(--fg); background: var(--bg); border-color: var(--border); }
  main { flex: 1; overflow: hidden; position: relative; }
  .tab { display: none; height: 100%; overflow: auto; padding: 16px; }
  .tab.active { display: block; }
  .tab#tab-chat { padding: 0; display: none; }
  .tab#tab-chat.active { display: flex; }
  #chat-root { height: 100%; flex: 1; min-width: 0; }

  /* Conversation sidebar — scoped to the Chat tab; other tabs stay full-width.
     Tokens (--bg/--panel/--border/--muted/--accent/--fg) come from chat.css. */
  .conv-sidebar {
    width: 260px; flex-shrink: 0; height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  .conv-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--muted); flex-shrink: 0;
  }
  .conv-new {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 4px 10px; font: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  .conv-new:hover { filter: brightness(1.08); }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv-row {
    position: relative; padding: 9px 12px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 3px;
  }
  .conv-row:hover { background: var(--bg); }
  .conv-row.active { background: var(--bg); box-shadow: inset 2px 0 0 var(--accent); }
  .conv-title {
    font-size: 13px; font-weight: 600; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 18px;
  }
  .conv-meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .conv-channel {
    font-size: 10px; padding: 0 5px; border-radius: 8px;
    background: rgba(139,148,158,.18); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .conv-del {
    position: absolute; right: 6px; top: 7px;
    width: 18px; height: 18px; padding: 0; line-height: 1;
    background: transparent; border: none; cursor: pointer;
    color: var(--muted); font-size: 13px; opacity: 0;
  }
  .conv-row:hover .conv-del { opacity: 0.55; }
  .conv-del:hover { opacity: 1; color: var(--accent); }
  .conv-empty { padding: 14px; font-size: 12px; color: var(--muted); }

  /* Read panels */
  h2 { font-size: 16px; margin: 0 0 12px; }
  .controls { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  select, .controls input {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font: inherit;
  }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; min-width: 140px; }
  .card .label { font-size: 12px; color: var(--muted); }
  .card .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .muted { color: var(--muted); }
  .err { color: var(--err); }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; }
  .badge.on { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.off { background: rgba(139,148,158,.15); color: var(--muted); }
  .mem-layout { display: flex; gap: 16px; height: 100%; }
  .mem-tree { width: 280px; flex-shrink: 0; overflow: auto; }
  .mem-tree ul { list-style: none; padding-left: 16px; margin: 0; }
  .mem-tree > ul { padding-left: 0; }
  .mem-tree li { padding: 2px 0; }
  .mem-tree .file { cursor: pointer; color: var(--accent); }
  .mem-tree .file:hover { text-decoration: underline; }
  .mem-tree .dir { color: var(--fg); font-weight: 600; }
  .mem-view { flex: 1; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }

  /* Usage dashboard */
  .u-cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .u-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; min-width: 150px; border-top: 3px solid var(--swatch, var(--border)); }
  .u-card .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .u-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; letter-spacing: -.5px;
    font-variant-numeric: tabular-nums; }
  .u-card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .u-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .u-sec { margin-bottom: 26px; }
  .u-sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .u-sec-head h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 0; font-weight: 600; }
  .u-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .u-legend .it { display: flex; align-items: center; gap: 6px; }
  .u-chart { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 14px 10px; }
  .u-bars { display: flex; align-items: flex-end; gap: 14px; height: 200px; }
  .u-bcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .u-stack { width: 100%; max-width: 54px; display: flex; flex-direction: column-reverse;
    border-radius: 4px 4px 0 0; overflow: hidden; }
  .u-seg { width: 100%; }
  .u-blabel { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .u-brk { display: flex; flex-direction: column; gap: 2px; }
  .u-brow { display: grid; grid-template-columns: 210px 1fr 92px; align-items: center; gap: 12px;
    padding: 7px 4px; border-bottom: 1px solid var(--border); }
  .u-brow:last-child { border-bottom: none; }
  .u-bname { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .u-bname .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .u-chan { font-size: 10px; padding: 0 6px; border-radius: 8px; background: rgba(139,148,158,.18);
    color: var(--muted); text-transform: uppercase; letter-spacing: .3px; flex-shrink: 0; }
  .u-chan.sched { background: rgba(210,153,34,.18); color: var(--warn); }
  .u-chan.cli { background: rgba(99,102,241,.18); color: var(--accent); }
  .u-bbar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--bg);
    border: 1px solid var(--border); }
  .u-bbar .u-seg { height: 100%; }
  .u-btot { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .u-btot b { color: var(--fg); }
  .u-bcost { font-size: 11px; color: var(--muted); margin-top: 1px; }
  /* Cost-rate inputs: narrow, sit beside the window selector. */
  .rate-grp { display: inline-flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding-left: 14px; margin-left: 4px; border-left: 1px solid var(--border); }
  input.rate { width: 64px; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 13px; }
  /* By-day drill-down: reuse the portfolio collapsible-group look. */
  .u-day { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .u-dayhd { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 12px;
    padding: 10px 14px; cursor: pointer; user-select: none; }
  .u-dayhd:hover { background: var(--bg); }
  .u-dayname { font-weight: 600; font-variant-numeric: tabular-nums; }
  .u-daytot { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .u-daytot b { color: var(--fg); }
  .u-caret { color: var(--muted); transition: transform .15s; }
  .u-day.open .u-caret { transform: rotate(90deg); }
  .u-daykids { display: none; padding: 0 14px 6px; }
  .u-day.open .u-daykids { display: block; }
  .u-daykids .u-brow { grid-template-columns: 200px 1fr 92px; }
  .u-toggle { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; padding: 2px; }
  .u-toggle button { background: transparent; border: none; color: var(--muted); font: inherit;
    font-size: 12px; padding: 4px 11px; border-radius: 5px; cursor: pointer; }
  .u-toggle button.on { background: var(--panel); color: var(--fg); border: 1px solid var(--border); }

  /* Balance Sheet dashboard */
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pf-hero { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .pf-nw { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
  .pf-nw-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .pf-asof { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pf-pos { color: var(--ok); }
  .pf-neg { color: var(--err); }
  .pf-bar { display: flex; height: 26px; border-radius: 7px; overflow: hidden;
    border: 1px solid var(--border); margin: 4px 0 12px; }
  .pf-seg { height: 100%; }
  .pf-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; margin-bottom: 4px; }
  .pf-legend .it { display: flex; align-items: center; gap: 6px; }
  .pf-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .pf-legend .pct { color: var(--muted); }
  .pf-legend .pf-liab { margin-left: auto; color: var(--muted); }
  .pf-grp { border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    margin-bottom: 10px; overflow: hidden; }
  .pf-grp-head { display: grid; grid-template-columns: 14px 1fr auto auto; align-items: center;
    gap: 12px; padding: 11px 14px; cursor: pointer; user-select: none; }
  .pf-grp-head:hover { background: var(--bg); }
  .pf-grp-name { font-weight: 600; }
  .pf-grp-name .cnt { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .pf-grp-sub { font-size: 12px; color: var(--muted); }
  .pf-grp-tot { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pf-caret { color: var(--muted); transition: transform .15s; }
  .pf-grp.open .pf-caret { transform: rotate(90deg); }
  .pf-grp-body { display: none; padding: 0 6px 6px; }
  .pf-grp.open .pf-grp-body { display: block; }
  .pf-grp-body th, .pf-grp-body td { padding: 5px 10px; }
  .pf-badge { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
  .pf-badge.lt { background: rgba(74,222,128,.15); color: var(--ok); }
  .pf-badge.st { background: rgba(210,153,34,.18); color: var(--warn); }
  .pf-badge.buy { background: rgba(99,102,241,.18); color: var(--accent); }
  .pf-badge.sell { background: rgba(210,153,34,.18); color: var(--warn); }
  /* CRM stage chips */
  .crm-stage { font-size: 10.5px; padding: 1px 8px; border-radius: 10px; white-space: nowrap;
    background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
  .crm-stage.new { background: rgba(99,102,241,.16); color: var(--accent); }
  .crm-stage.contacted { background: rgba(6,182,212,.16); color: #22d3ee; }
  .crm-stage.qualified { background: rgba(168,85,247,.16); color: #c084fc; }
  .crm-stage.trial { background: rgba(210,153,34,.18); color: var(--warn); }
  .crm-stage.won { background: rgba(74,222,128,.16); color: var(--ok); }
  .crm-stage.lost { background: rgba(248,113,113,.16); color: var(--err, #f87171); }
  .crm-src { font-size: 11px; color: var(--muted); }

  /* Schedules editor */
  button.btn {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.danger:hover { border-color: var(--err); color: var(--err); }
  .sched-new { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .sched-new > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; }
  .sched-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 12px 12px; }
  .sched-form input { flex: 1; min-width: 120px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .sched-form input.prompt { flex-basis: 100%; }
  .row-actions { display: flex; gap: 6px; white-space: nowrap; }
  .sched-preview { color: var(--muted); font-size: 12px; }
  .sched-preview.bad { color: var(--err); }
  .edit-form input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; }

  /* Schedules — accordion cards (collapsed header is scannable; body holds the
     Markdown-rendered prompt and actions). */
  .sched-list { display: flex; flex-direction: column; gap: 8px; }
  .sched-card { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .sched-head {
    display: grid; grid-template-columns: 16px minmax(140px, 1fr) 2fr auto auto;
    align-items: center; gap: 12px; padding: 9px 14px; cursor: pointer; user-select: none;
  }
  .sched-head:hover { background: rgba(139,148,158,.08); }
  .sched-arrow { color: var(--muted); transition: transform .15s; }
  .sched-card.open .sched-arrow { transform: rotate(90deg); }
  .sched-id { font-weight: 600; }
  .sched-id .skill-chip { font-weight: 400; font-size: 11px; color: var(--accent); margin-left: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; }
  .sched-when { color: var(--fg); min-width: 0; }
  .sched-when .sched-raw { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .sched-next { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  .sched-body { display: none; padding: 12px 14px 14px 42px; border-top: 1px solid var(--border); }
  .sched-card.open .sched-body { display: block; }
  .sched-meta { display: flex; gap: 18px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .sched-meta b { color: var(--fg); font-weight: 600; }
  .prompt-render { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 14px; margin-bottom: 12px; max-height: 240px; overflow: auto; }
  .prompt-render :first-child { margin-top: 10px; }
  .prompt-render pre { background: var(--panel); padding: 10px; border-radius: 6px; overflow: auto; }
  .sched-body .edit-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sched-body .edit-form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .sched-body .edit-form textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; resize: vertical; }
</style>
</head>
<body>
<header>
  <h1>Curunir<span id="persona-tag" class="persona-tag"></span></h1>
  <nav>
    <button data-tab="chat" class="active">Chat</button>
    <button data-tab="usage">Usage</button>
    <button data-tab="portfolio">Balance Sheet</button>
    <button data-tab="crm">CRM</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="schedules">Schedules</button>
  </nav>
</header>
<main>
  <div class="tab active" id="tab-chat">
    <aside class="conv-sidebar">
      <div class="conv-head">
        <span>Conversations</span>
        <button class="conv-new" id="conv-new" title="Start a new conversation">+ New</button>
      </div>
      <div class="conv-list" id="conversation-list"></div>
    </aside>
    <div id="chat-root"></div>
  </div>
  <div class="tab" id="tab-usage"><h2>Token Usage</h2>
    <div class="controls">
      <label>Window
        <select id="usage-window">
          <option value="24h">24h</option><option value="1d">1d</option>
          <option value="7d" selected>7d</option><option value="30d">30d</option>
        </select>
      </label>
      <span class="rate-grp" title="Token prices in dollars per million tokens. Stored only in this browser; leave blank to hide cost.">
        <label>Input $/M <input type="number" id="rate-in" class="rate" step="0.01" min="0" placeholder="0"></label>
        <label>Cached $/M <input type="number" id="rate-cached" class="rate" step="0.01" min="0" placeholder="0"></label>
        <label>Output $/M <input type="number" id="rate-out" class="rate" step="0.01" min="0" placeholder="0"></label>
      </span>
    </div>
    <div id="usage-body"></div>
  </div>
  <div class="tab" id="tab-portfolio"><h2>Balance Sheet</h2><div id="portfolio-body"></div></div>
  <div class="tab" id="tab-crm"><h2>CRM</h2><div id="crm-body"></div></div>
  <div class="tab" id="tab-memory"><h2>Memory</h2>
    <div class="mem-layout">
      <div class="mem-tree" id="memory-tree"></div>
      <div class="mem-view" id="memory-view"><span class="muted">Select a file.</span></div>
    </div>
  </div>
  <div class="tab" id="tab-schedules"><h2>Scheduled Tasks</h2>
    <details class="sched-new">
      <summary>+ New schedule</summary>
      <div class="sched-form">
        <input id="nsched-id" placeholder="id" />
        <input id="nsched-cron" placeholder="cron (e.g. 0 9 * * *)" />
        <input id="nsched-skill" placeholder="skill (optional)" />
        <input id="nsched-prompt" class="prompt" placeholder="prompt" />
        <button class="btn" id="nsched-create">Create</button>
        <span class="sched-preview" id="nsched-preview"></span>
        <span class="err" id="nsched-err"></span>
      </div>
    </details>
    <div id="schedules-body"></div>
  </div>
</main>

<script type="module">
import { createConnection } from "/static/connection.js";
import { createChat } from "/static/chat.js";

// === Auth token ===
// The operator opens http://host:port/?token=XXX. We read it once and reuse
// it for every /api and /ws call. (On loopback this is just the pairing gate.)
const TOKEN = new URLSearchParams(location.search).get("token") || "";

// crypto.randomUUID() is a *secure-context-only* API — undefined when the page
// is served over plain HTTP from a non-loopback host (e.g. http://host.local).
// The local UI is reached exactly that way (LOCAL_UI_HOST=0.0.0.0, LAN host),
// so we fall back to an RFC4122 v4 built from crypto.getRandomValues(), which
// *is* available in insecure contexts. Without this the whole module throws at
// init and the page renders blank.
function uuid() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; // version 4
  b[8] = (b[8] & 0x3f) | 0x80; // variant 10
  const h = [...b].map((x) => x.toString(16).padStart(2, "0"));
  return `${h[0]}${h[1]}${h[2]}${h[3]}-${h[4]}${h[5]}-${h[6]}${h[7]}-${h[8]}${h[9]}-${h[10]}${h[11]}${h[12]}${h[13]}${h[14]}${h[15]}`;
}

// === Conversation state (multi-conversation) ===
// The active session id is read live by chat.js via getSessionId(). On first
// load after the multi-conversation upgrade there's no stored id, so we mint a
// fresh one — opening a new conversation rather than the legacy "local" slot,
// which stays resumable from the sidebar.
const SESSION_KEY = "curunir-local-session-id";
let activeSessionId = localStorage.getItem(SESSION_KEY);
if (!activeSessionId) {
  activeSessionId = uuid();
  localStorage.setItem(SESSION_KEY, activeSessionId);
}
let conversations = [];  // latest conversations_snapshot, drives the sidebar
const conversationListEl = document.getElementById("conversation-list");

function apiUrl(path, params = {}) {
  const u = new URL(path, location.origin);
  if (TOKEN) u.searchParams.set("token", TOKEN);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  return u;
}
async function apiGet(path, params) {
  const r = await fetch(apiUrl(path, params));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function apiSend(method, path, body) {
  const r = await fetch(apiUrl(path), {
    method,
    headers: { "Content-Type": "application/json" },
    body: body == null ? undefined : JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
const fmtUsd = (n) => "$" + (n ?? 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtNum = (n) => (n ?? 0).toLocaleString();
const fmtMoney = (n) => (n ?? 0).toLocaleString(undefined, { maximumFractionDigits: 0 });

// === Tabs ===
const tabs = document.querySelectorAll("nav button");
const loaders = { usage: loadUsage, portfolio: loadPortfolio, crm: loadCrm, memory: loadMemory, schedules: loadSchedules };
tabs.forEach((b) => b.addEventListener("click", () => {
  tabs.forEach((x) => x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
  const name = b.dataset.tab;
  document.getElementById("tab-" + name).classList.add("active");
  if (loaders[name]) loaders[name]();
}));

// === Usage dashboard ===
// Tokens, not dollars: in/out/cache summary cards, a daily stacked-bar trend,
// and a by conversation-or-job / model / day breakdown. All inline SVG-free
// HTML bars so the console works offline (no chart CDN).
document.getElementById("usage-window").addEventListener("change", loadUsage);
const fmtTok = (n) => { n = n || 0; return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : "" + n; };
const uSum = (rows, c) => rows.reduce((a, r) => a + (r[c] || 0), 0);
const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let usageData = null;     // { day, session, model, day_session } row arrays
let usageKind = "session"; // active breakdown dimension

// === Cost rates (browser-only) ===
// User-supplied $/million-token prices, persisted in localStorage — no backend.
// The dashboard shows dollars only once at least one rate is set; otherwise it
// looks exactly as before (tokens-only).
const RATE_KEY = "curunir.usage.rates";
let usageRates = (() => { try { return JSON.parse(localStorage.getItem(RATE_KEY)) || {}; } catch { return {}; } })();
const ratesActive = () => ((+usageRates.in || 0) + (+usageRates.cached || 0) + (+usageRates.out || 0)) > 0;
// Cost for one row: non-cached input, cached input, and output (+reasoning,
// billed at the output rate) each priced per million tokens.
function rowCost(r) {
  const nonCached = Math.max(0, (r.prompt_tokens || 0) - (r.cached_prompt_tokens || 0));
  const out = (r.completion_tokens || 0) + (r.reasoning_tokens || 0);
  return (nonCached * (+usageRates.in || 0) + (r.cached_prompt_tokens || 0) * (+usageRates.cached || 0) + out * (+usageRates.out || 0)) / 1e6;
}
const sumCost = (rows) => rows.reduce((a, r) => a + rowCost(r), 0);
const fmtUsd = (n) => "$" + (n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Hydrate the inputs from storage and re-render the dashboard on edit.
["in", "cached", "out"].forEach((k) => {
  const el = document.getElementById("rate-" + k);
  if (usageRates[k] != null) el.value = usageRates[k];
  el.addEventListener("input", () => {
    const v = parseFloat(el.value);
    if (Number.isFinite(v) && v >= 0) usageRates[k] = v; else delete usageRates[k];
    localStorage.setItem(RATE_KEY, JSON.stringify(usageRates));
    if (usageData) renderUsage(document.getElementById("usage-body"));
  });
});

async function loadUsage() {
  const el = document.getElementById("usage-body");
  const win = document.getElementById("usage-window").value;
  el.innerHTML = '<span class="muted">Loading…</span>';
  try {
    const [day, session, model, daySession] = await Promise.all([
      apiGet("/api/usage", { window: win, by: "day" }),
      apiGet("/api/usage", { window: win, by: "session" }),
      apiGet("/api/usage", { window: win, by: "model" }),
      apiGet("/api/usage", { window: win, by: "day_session" }),
    ]);
    // Daily rows ascending by date for the trend + day breakdown.
    const dayRows = (day.rows || []).slice().sort((a, b) => (a.day < b.day ? -1 : 1));
    usageData = { day: dayRows, session: session.rows || [], model: model.rows || [], day_session: daySession.rows || [] };
    renderUsage(el);
  } catch (e) { el.innerHTML = `<span class="err">${escHtml(e.message)}</span>`; }
}

function renderUsage(el) {
  const { day, session } = usageData;
  if (!day.length) { el.innerHTML = '<span class="muted">No usage in window.</span>'; return; }
  const tIn = uSum(day, "prompt_tokens"), tOut = uSum(day, "completion_tokens");
  const tCache = uSum(day, "cached_prompt_tokens"), tReason = uSum(day, "reasoning_tokens");
  const tCalls = uSum(day, "calls");
  const cachePct = tIn ? Math.round((tCache / tIn) * 100) : 0;

  const card = (sw, label, value, sub) =>
    `<div class="u-card"${sw ? ` style="--swatch:${sw}"` : ""}>
       <div class="label">${sw ? `<span class="u-dot" style="background:${sw}"></span>` : ""}${label}</div>
       <div class="value">${value}</div><div class="sub">${sub}</div></div>`;
  const cards = `<div class="u-cards">
    ${card("var(--c-in)", "Input tokens", fmtTok(tIn), `incl. ${fmtTok(tCache)} cached`)}
    ${card("var(--c-out)", "Output tokens", fmtTok(tOut), tReason ? `+${fmtTok(tReason)} reasoning` : "&nbsp;")}
    ${card("var(--c-cache)", "Cached input", fmtTok(tCache), `${cachePct}% of input cache-hit`)}
    ${card("", "Calls", fmtNum(tCalls), `across ${session.length} conversation${session.length === 1 ? "" : "s"} / jobs`)}
    ${ratesActive() ? card("", "Cost", fmtUsd(sumCost(day)), "at your token rates") : ""}
  </div>`;

  // Daily stacked-bar trend. Total bar height = input + output; segments
  // (bottom→top via column-reverse) are cached, non-cached input, output.
  const maxDay = Math.max(...day.map((r) => r.prompt_tokens + r.completion_tokens), 1);
  const seg = (v, tot, h, color) =>
    `<div class="u-seg" style="height:${tot ? (v / tot) * h : 0}px;background:${color}" title="${fmtTok(v)}"></div>`;
  const bars = day.map((r) => {
    const nonCached = Math.max(0, r.prompt_tokens - r.cached_prompt_tokens);
    const tot = r.prompt_tokens + r.completion_tokens;
    const h = Math.round((tot / maxDay) * 170);
    return `<div class="u-bcol"><div class="u-stack" style="height:${h}px">
        ${seg(r.completion_tokens, tot, h, "var(--c-out)")}${seg(nonCached, tot, h, "var(--c-in)")}${seg(r.cached_prompt_tokens, tot, h, "var(--c-cache)")}
      </div><div class="u-blabel">${escHtml((r.day || "").slice(5))}</div></div>`;
  }).join("");
  const trend = `<div class="u-sec">
    <div class="u-sec-head"><h3>Daily tokens</h3>
      <div class="u-legend">
        <span class="it"><span class="u-dot" style="background:var(--c-in)"></span>input</span>
        <span class="it"><span class="u-dot" style="background:var(--c-out)"></span>output</span>
        <span class="it"><span class="u-dot" style="background:var(--c-cache)"></span>cached</span>
      </div>
    </div>
    <div class="u-chart"><div class="u-bars">${bars}</div></div>
  </div>`;

  const breakdown = `<div class="u-sec">
    <div class="u-sec-head"><h3>Breakdown</h3>
      <div class="u-toggle" id="u-toggle">
        <button data-k="session">Conversation / job</button>
        <button data-k="model">Model</button>
        <button data-k="day">Day</button>
        <button data-k="day_session">By day</button>
      </div>
    </div>
    <div class="u-brk" id="u-brk"></div>
  </div>`;

  el.innerHTML = cards + trend + breakdown;
  el.querySelectorAll("#u-toggle button").forEach((b) =>
    b.addEventListener("click", () => { usageKind = b.dataset.k; renderBreakdown(); }));
  renderBreakdown();
}

// Shared segmented-bar cell. Returns the inner HTML of a ``.u-bbar``.
const wseg = (v, tot, color) =>
  `<div class="u-seg" style="width:${tot ? (v / tot) * 100 : 0}%;background:${color}" title="${fmtTok(v)}"></div>`;
const barCell = (r, max) => {
  const nonCached = Math.max(0, r.prompt_tokens - r.cached_prompt_tokens);
  const tot = r.prompt_tokens + r.completion_tokens;
  return `<div class="u-bbar" style="width:${(tot / max) * 100}%">${wseg(nonCached, tot, "var(--c-in)")}${wseg(r.cached_prompt_tokens, tot, "var(--c-cache)")}${wseg(r.completion_tokens, tot, "var(--c-out)")}</div>`;
};
const chanTag = (ch) => ch
  ? `<span class="u-chan ${["sched", "cli"].includes(ch) ? ch : ""}">${escHtml(ch)}</span>` : "";
// Right-hand total cell: tokens + (when rates are set) the row's cost.
const totCell = (r) =>
  `<div class="u-btot"><b>${fmtTok(r.prompt_tokens + r.completion_tokens)}</b>${ratesActive() ? `<div class="u-bcost">${fmtUsd(rowCost(r))}</div>` : ""}</div>`;

function renderBreakdown() {
  document.querySelectorAll("#u-toggle button").forEach((b) =>
    b.classList.toggle("on", b.dataset.k === usageKind));
  if (usageKind === "day_session") { renderByDay(); return; }
  const rows = usageData[usageKind] || [];
  const nameOf = (r) => usageKind === "session" ? (r.label || r.session)
    : usageKind === "model" ? r.model : r.day;
  const max = Math.max(...rows.map((r) => r.prompt_tokens + r.completion_tokens), 1);
  const html = rows.map((r) => {
    const chan = usageKind === "session" ? chanTag(r.channel) : "";
    return `<div class="u-brow">
      <div class="u-bname">${chan}<span class="t" title="${escHtml(nameOf(r))}">${escHtml(nameOf(r))}</span></div>
      ${barCell(r, max)}
      ${totCell(r)}
    </div>`;
  }).join("");
  document.getElementById("u-brk").innerHTML = html;
}

// "By day" drill-down: each day is a collapsible header (day total tokens + $);
// expanding reveals that day's conversations — raw, NOT collapsed, so every
// scheduled firing is its own row (disambiguated by firing time).
function renderByDay() {
  const rows = usageData.day_session || [];
  const byDay = new Map();
  for (const r of rows) {
    if (!byDay.has(r.day)) byDay.set(r.day, []);
    byDay.get(r.day).push(r);
  }
  const days = [...byDay.keys()].sort().reverse();  // newest day first
  const max = Math.max(...rows.map((r) => r.prompt_tokens + r.completion_tokens), 1);
  const tot = (r) => r.prompt_tokens + r.completion_tokens;
  const html = days.map((day) => {
    const kids = byDay.get(day).slice().sort((a, b) => tot(b) - tot(a));
    const dTokens = kids.reduce((a, r) => a + tot(r), 0);
    const dCost = ratesActive() ? ` · ${fmtUsd(sumCost(kids))}` : "";
    const childRows = kids.map((r) => {
      const nm = (r.label || r.session_id) + (r.detail ? ` · ${r.detail}` : "");
      return `<div class="u-brow">
        <div class="u-bname">${chanTag(r.channel)}<span class="t" title="${escHtml(nm)}">${escHtml(nm)}</span></div>
        ${barCell(r, max)}
        ${totCell(r)}
      </div>`;
    }).join("");
    return `<div class="u-day">
      <div class="u-dayhd"><span class="u-caret">▸</span>
        <span class="u-dayname">${escHtml(day)}</span>
        <span class="u-daytot"><b>${fmtTok(dTokens)}</b>${dCost}</span></div>
      <div class="u-daykids">${childRows}</div>
    </div>`;
  }).join("");
  const brk = document.getElementById("u-brk");
  brk.innerHTML = html || '<span class="muted">No usage in window.</span>';
  brk.querySelectorAll(".u-dayhd").forEach((h) =>
    h.addEventListener("click", () => h.parentElement.classList.toggle("open")));
}

// === Portfolio panel (single-page balance-sheet dashboard) ===
const PF_MONEY = (n) => (n < 0 ? "-$" : "$") + Math.abs(n ?? 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
// Per-share figures (avg cost, trade price) — cents are meaningful here.
const PF_PX = (n) => n == null ? "" : "$" + (+n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const PF_QTY = (n) => n == null ? "" : (+n).toLocaleString(undefined, { maximumFractionDigits: 4 });
// Signed gain cell: green positive, red negative, em-dash when basis unknown.
const PF_GAIN = (n) => n == null
  ? '<span class="muted">—</span>'
  : `<span class="${n >= 0 ? "pf-pos" : "pf-neg"}">${(n >= 0 ? "+" : "−") + "$" + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 })}</span>`;

// net-worth-composition palette (allocation bar + legend)
const PF_ALLOC = [
  { key: "equities", label: "Equities", color: "#6366f1" },
  { key: "real_estate_equity", label: "Real estate eq.", color: "#22c55e" },
  { key: "cash", label: "Cash", color: "#06b6d4" },
  { key: "collectibles", label: "Collectibles", color: "#d29922" },
  { key: "physical", label: "Physical", color: "#8b5cf6" },
  { key: "private", label: "Private", color: "#a855f7" },
];

// Holdings groups: each maps one-or-more asset classes to tuned columns.
// Retirement folds into Equities (mirrors engine.rollup).
const PF_GROUPS = [
  { name: "Equities", classes: ["equity", "retirement"], kind: "equity" },
  { name: "Cash", classes: ["cash"], kind: "cash" },
  { name: "Real estate", classes: ["real_estate"], kind: "realestate" },
  { name: "Collectibles", classes: ["collectible"], kind: "valued" },
  { name: "Physical", classes: ["physical"], kind: "valued" },
  { name: "Private", classes: ["private"], kind: "plain" },
];

function pfUnreal(a) {
  return (a.cost_basis == null || a.cost_basis === "") ? null : (a.value || 0) - a.cost_basis;
}

function pfGroupTable(kind, rows) {
  let head, body;
  if (kind === "equity") {
    head = `<th>Ticker</th><th class="num">Qty</th><th class="num">Avg cost</th><th class="num">Value</th><th class="num">Unrealized</th><th>Account</th>`;
    body = rows.map((a) => `<tr><td>${esc(a.ticker || a.label)}</td><td class="num">${PF_QTY(a.qty)}</td>` +
      `<td class="num">${PF_PX(a.avg_cost)}</td><td class="num">${PF_MONEY(a.value)}</td>` +
      `<td class="num">${PF_GAIN(pfUnreal(a))}</td><td>${esc(a.account || "")}</td></tr>`).join("");
  } else if (kind === "cash") {
    head = `<th>Account</th><th class="num">Value</th>`;
    body = rows.map((a) => `<tr><td>${esc(a.label)}${a.account ? ' <span class="muted">· ' + esc(a.account) + "</span>" : ""}</td><td class="num">${PF_MONEY(a.value)}</td></tr>`).join("");
  } else if (kind === "realestate") {
    head = `<th>Property</th><th class="num">Value</th><th>Account</th>`;
    body = rows.map((a) => `<tr><td>${esc(a.label)}</td><td class="num">${PF_MONEY(a.value)}</td><td>${esc(a.account || "")}</td></tr>`).join("");
  } else if (kind === "valued") {
    head = `<th>Item</th><th class="num">Cost</th><th class="num">Value</th><th class="num">Unrealized</th><th>Acquired</th>`;
    body = rows.map((a) => `<tr><td>${esc(a.label)}</td><td class="num">${a.cost_basis != null ? PF_MONEY(a.cost_basis) : ""}</td>` +
      `<td class="num">${PF_MONEY(a.value)}</td><td class="num">${PF_GAIN(pfUnreal(a))}</td><td>${esc(a.acquired || "")}</td></tr>`).join("");
  } else {
    head = `<th>Label</th><th class="num">Value</th><th>Account</th>`;
    body = rows.map((a) => `<tr><td>${esc(a.label)}</td><td class="num">${PF_MONEY(a.value)}</td><td>${esc(a.account || "")}</td></tr>`).join("");
  }
  return `<table><tr>${head}</tr>${body}</table>`;
}

function pfTradesTable(trades) {
  const term = (t) => t.long_term == null ? "" : `<span class="pf-badge ${t.long_term ? "lt" : "st"}">${t.long_term ? "LT" : "ST"}</span>`;
  const rows = trades.map((t) => {
    const amt = (t.qty != null && t.price != null) ? PF_MONEY(t.qty * t.price) : "";
    const realized = t.side === "sell" ? PF_GAIN(t.realized_pnl) : '<span class="muted">—</span>';
    return `<tr><td>${esc(t.trade_date)}</td><td><span class="pf-badge ${t.side}">${t.side.toUpperCase()}</span></td>` +
      `<td>${esc(t.ticker)}</td><td class="num">${PF_QTY(t.qty)}</td><td class="num">${PF_PX(t.price)}</td>` +
      `<td class="num">${amt}</td><td class="num">${realized}</td><td class="num">${term(t)}</td></tr>`;
  }).join("");
  return `<table><tr><th>Date</th><th>Side</th><th>Ticker</th><th class="num">Qty</th>` +
    `<th class="num">Price</th><th class="num">Amount</th><th class="num">Realized</th><th class="num">Term</th></tr>${rows}</table>`;
}

async function loadPortfolio() {
  const el = document.getElementById("portfolio-body");
  el.innerHTML = '<span class="muted">Loading…</span>';
  try {
    const d = await apiGet("/api/portfolio");
    if (!d.available) { el.innerHTML = '<span class="muted">No portfolio store yet.</span>'; return; }
    const nw = d.networth, roll = d.rollup, un = d.unrealized;

    // Hero + staleness caveat.
    const asof = d.as_of
      ? `<div class="pf-asof">Values as of ${esc(d.as_of.oldest)}${d.as_of.oldest !== d.as_of.newest ? " – " + esc(d.as_of.newest) : ""}</div>`
      : "";
    const hero = `<div class="pf-hero"><div class="pf-nw">${PF_MONEY(nw.net_worth)}</div>
      <div class="pf-nw-label">net worth</div></div>${asof}`;
    const cards = `<div class="cards">
      <div class="card"><div class="label">Assets</div><div class="value">${PF_MONEY(nw.assets)}</div></div>
      <div class="card"><div class="label">Liabilities</div><div class="value">${PF_MONEY(nw.liabilities)}</div></div>
      <div class="card"><div class="label">Net worth</div><div class="value">${PF_MONEY(nw.net_worth)}</div></div>
      <div class="card"><div class="label">Unrealized gain</div><div class="value">${un ? PF_GAIN(un.unrealized) : "—"}</div>
        <div class="sub">${un ? "on " + PF_MONEY(un.cost_basis) + " basis" : ""}</div></div>
    </div>`;

    // Allocation bar (net-worth composition) + legend; debt shown separately.
    const segs = PF_ALLOC.map((s) => ({ ...s, v: Math.max(0, roll[s.key] || 0) })).filter((s) => s.v > 0);
    const allocTot = segs.reduce((a, s) => a + s.v, 0) || 1;
    const bar = `<div class="pf-bar">${segs.map((s) =>
      `<div class="pf-seg" style="width:${(s.v / allocTot * 100).toFixed(2)}%;background:${s.color}" title="${s.label}"></div>`).join("")}</div>`;
    const legend = `<div class="pf-legend">${segs.map((s) =>
      `<span class="it"><span class="pf-swatch" style="background:${s.color}"></span>${s.label}` +
      `<span class="pct">${(s.v / allocTot * 100).toFixed(0)}% · ${PF_MONEY(s.v)}</span></span>`).join("")}` +
      `<span class="it pf-liab">Liabilities <span class="pct">${PF_MONEY(roll.debt)}</span></span></div>`;

    // Holdings — collapsible groups with per-class columns + subtotals.
    const byClass = {};
    for (const a of d.assets) (byClass[a.class] = byClass[a.class] || []).push(a);
    const groupsHtml = PF_GROUPS.map((g, i) => {
      const rows = g.classes.flatMap((c) => byClass[c] || []);
      if (!rows.length) return "";
      const subtotal = rows.reduce((s, a) => s + (a.value || 0), 0);
      const gainSum = rows.reduce((s, a) => { const u = pfUnreal(a); return u == null ? s : s + u; }, 0);
      const hasGain = rows.some((a) => pfUnreal(a) != null);
      const sub = hasGain ? `<span class="pf-grp-sub">${PF_GAIN(gainSum)} unrealized</span>` : "";
      return `<div class="pf-grp${i === 0 ? " open" : ""}">
        <div class="pf-grp-head"><span class="pf-caret">▸</span>
          <span class="pf-grp-name">${g.name}<span class="cnt">${rows.length}</span></span>
          ${sub}<span class="pf-grp-tot">${PF_MONEY(subtotal)}</span></div>
        <div class="pf-grp-body">${pfGroupTable(g.kind, rows)}</div></div>`;
    }).join("");

    // Trades + realized P&L (fiscal year to date).
    const r = d.realized || { short_term: 0, long_term: 0, total: 0, count: 0 };
    const tradeCards = `<div class="cards">
      <div class="card"><div class="label">Realized — short-term</div><div class="value">${PF_GAIN(r.short_term)}</div></div>
      <div class="card"><div class="label">Realized — long-term</div><div class="value">${PF_GAIN(r.long_term)}</div></div>
      <div class="card"><div class="label">Realized — total (${d.year})</div><div class="value">${PF_GAIN(r.total)}</div>
        <div class="sub">${r.count} sell trade${r.count === 1 ? "" : "s"}</div></div>
    </div>`;
    const tradesBody = (d.trades && d.trades.length)
      ? pfTradesTable(d.trades)
      : `<span class="muted">No trades recorded for ${d.year}.</span>`;

    el.innerHTML = hero + cards +
      `<h3>Allocation</h3>${bar}${legend}` +
      `<h3>Holdings</h3>${groupsHtml}` +
      `<h3>Trades — ${d.year} to date</h3>${tradeCards}${tradesBody}`;

    el.querySelectorAll(".pf-grp-head").forEach((h) =>
      h.addEventListener("click", () => h.parentElement.classList.toggle("open")));
  } catch (e) { el.innerHTML = `<span class="err">${e.message}</span>`; }
}

// === CRM panel (read-only leads + pipeline dashboard) ===
const CRM_STAGES = ["new", "contacted", "qualified", "trial", "won", "lost"];
const crmStage = (s) => `<span class="crm-stage ${CRM_STAGES.includes(s) ? s : ""}">${esc(s || "")}</span>`;

function crmLeadsTable(rows) {
  const body = rows.map((l) =>
    `<tr><td>${esc(l.name || "")}</td><td>${esc(l.company || "")}</td>` +
    `<td>${esc(l.email || "")}</td><td>${crmStage(l.stage)}</td>` +
    `<td><span class="crm-src">${esc(l.source || "")}</span></td>` +
    `<td>${esc(l.owner || "")}</td></tr>`).join("");
  return `<table><tr><th>Name</th><th>Company</th><th>Email</th><th>Stage</th>` +
    `<th>Source</th><th>Owner</th></tr>${body}</table>`;
}

function crmActivityTable(rows) {
  const body = rows.map((i) =>
    `<tr><td>${esc((i.occurred_at || "").replace("T", " "))}</td>` +
    `<td><span class="pf-badge">${esc(i.kind || "")}</span></td>` +
    `<td>${esc(i.lead_id || "")}</td><td>${esc(i.body || "")}</td></tr>`).join("");
  return `<table><tr><th>When</th><th>Kind</th><th>Lead</th><th>Detail</th></tr>${body}</table>`;
}

async function loadCrm() {
  const el = document.getElementById("crm-body");
  el.innerHTML = '<span class="muted">Loading…</span>';
  try {
    const d = await apiGet("/api/crm");
    if (!d.available) { el.innerHTML = '<span class="muted">No CRM store yet — add a lead to get started.</span>'; return; }
    const pipe = d.pipeline || { total: 0, by_stage: {} };

    // Pipeline-by-stage cards (total + one per stage).
    const cards = `<div class="cards">
      <div class="card"><div class="label">Total leads</div><div class="value">${pipe.total}</div></div>
      ${CRM_STAGES.map((s) => `<div class="card"><div class="label">${s}</div>` +
        `<div class="value">${pipe.by_stage[s] || 0}</div></div>`).join("")}
    </div>`;

    // Leads grouped by stage, collapsible (mirrors the Balance Sheet groups).
    const byStage = {};
    for (const l of d.leads) (byStage[l.stage] = byStage[l.stage] || []).push(l);
    const order = [...CRM_STAGES, ...Object.keys(byStage).filter((s) => !CRM_STAGES.includes(s))];
    const groupsHtml = order.map((stage, i) => {
      const rows = byStage[stage] || [];
      if (!rows.length) return "";
      return `<div class="pf-grp${i === 0 ? " open" : ""}">
        <div class="pf-grp-head"><span class="pf-caret">▸</span>
          <span class="pf-grp-name">${crmStage(stage)}<span class="cnt">${rows.length}</span></span>
          <span class="pf-grp-sub"></span><span class="pf-grp-tot"></span></div>
        <div class="pf-grp-body">${crmLeadsTable(rows)}</div></div>`;
    }).join("");

    const activity = (d.activity && d.activity.length)
      ? crmActivityTable(d.activity)
      : '<span class="muted">No interactions logged yet.</span>';

    el.innerHTML = cards +
      `<h3>Leads by stage</h3>${groupsHtml || '<span class="muted">No leads yet.</span>'}` +
      `<h3>Recent activity</h3>${activity}`;

    el.querySelectorAll(".pf-grp-head").forEach((h) =>
      h.addEventListener("click", () => h.parentElement.classList.toggle("open")));
  } catch (e) { el.innerHTML = `<span class="err">${e.message}</span>`; }
}

// === Memory panel ===
async function loadMemory() {
  const treeEl = document.getElementById("memory-tree");
  treeEl.innerHTML = '<span class="muted">Loading…</span>';
  try {
    const tree = await apiGet("/api/memory");
    treeEl.innerHTML = "";
    treeEl.appendChild(renderTree(tree));
  } catch (e) { treeEl.innerHTML = `<span class="err">${e.message}</span>`; }
}
function renderTree(nodes) {
  const ul = document.createElement("ul");
  for (const n of nodes) {
    const li = document.createElement("li");
    if (n.type === "dir") {
      const span = document.createElement("span");
      span.className = "dir"; span.textContent = n.name + "/";
      li.appendChild(span);
      li.appendChild(renderTree(n.children || []));
    } else {
      const span = document.createElement("span");
      span.className = "file"; span.textContent = n.name;
      span.addEventListener("click", () => openMemoryFile(n.relpath));
      li.appendChild(span);
    }
    ul.appendChild(li);
  }
  return ul;
}
async function openMemoryFile(relpath) {
  const view = document.getElementById("memory-view");
  view.innerHTML = '<span class="muted">Loading…</span>';
  try {
    const d = await apiGet("/api/memory/file", { path: relpath });
    view.innerHTML = marked.parse(d.content || "");
  } catch (e) { view.innerHTML = `<span class="err">${e.message}</span>`; }
}

// === Schedules panel ===
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Render a schedule prompt as Markdown using the same global `marked` the chat
// and Memory panels already load; fall back to escaped text if it's unavailable.
const md = (s) => (window.marked ? marked.parse(String(s ?? "")) : esc(s));

// cron → human-readable English via the vendored cronstrue; null on any failure
// (missing lib or unparseable expr) so callers can fall back to the raw cron.
function humanCron(cron) {
  if (!cron || !window.cronstrue) return null;
  try { return cronstrue.toString(cron, { use24HourTimeFormat: false }); }
  catch (e) { return null; }
}

// Minimal client-side 5-field cron evaluator — preview convenience ONLY.
// The server (croniter) stays the source of truth for validation.
function cronField(spec, min, max) {
  const out = new Set();
  for (const part of spec.split(",")) {
    let [range, stepStr] = part.split("/");
    const step = stepStr ? parseInt(stepStr, 10) : 1;
    if (!step || step < 1) throw new Error("bad step");
    let lo, hi;
    if (range === "*") { lo = min; hi = max; }
    else if (range.includes("-")) {
      [lo, hi] = range.split("-").map((n) => parseInt(n, 10));
    } else { lo = hi = parseInt(range, 10); }
    if (Number.isNaN(lo) || Number.isNaN(hi) || lo < min || hi > max || lo > hi)
      throw new Error("out of range");
    for (let v = lo; v <= hi; v += step) out.add(v);
  }
  return out;
}
function cronNext(expr, from, count) {
  const f = expr.trim().split(/\s+/);
  if (f.length !== 5) throw new Error("cron needs 5 fields");
  const mins = cronField(f[0], 0, 59), hours = cronField(f[1], 0, 23);
  const doms = cronField(f[2], 1, 31), months = cronField(f[3], 1, 12);
  const dows = cronField(f[4], 0, 6);
  const domR = f[2] !== "*", dowR = f[4] !== "*";
  const out = [];
  const d = new Date(from.getTime());
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() + 1);
  for (let i = 0; i < 366 * 24 * 60 && out.length < count; i++) {
    const dom = d.getDate(), dow = d.getDay();
    const dayOk = domR && dowR ? (doms.has(dom) || dows.has(dow))
      : (doms.has(dom) && dows.has(dow));
    if (mins.has(d.getMinutes()) && hours.has(d.getHours()) &&
        months.has(d.getMonth() + 1) && dayOk) {
      out.push(new Date(d.getTime()));
    }
    d.setMinutes(d.getMinutes() + 1);
  }
  return out;
}
function previewText(expr) {
  if (!expr || !expr.trim()) return { text: "", bad: false };
  try {
    const runs = cronNext(expr, new Date(), 3);
    if (!runs.length) return { text: "no upcoming runs", bad: true };
    return { text: "next: " + runs.map((d) => d.toLocaleString()).join(", "), bad: false };
  } catch (e) { return { text: "invalid cron", bad: true }; }
}

let _schedEdit = null;  // id currently being edited inline

async function loadSchedules() {
  const el = document.getElementById("schedules-body");
  el.innerHTML = '<span class="muted">Loading…</span>';
  try {
    const tasks = await apiGet("/api/schedules");
    if (!tasks.length) { el.innerHTML = '<span class="muted">No scheduled tasks.</span>'; return; }
    el.innerHTML = `<div class="sched-list">${tasks.map((t) => schedCard(t)).join("")}</div>`;
    // Header toggles expand/collapse. Action buttons live in the body (a
    // sibling of the header), so their clicks never reach this handler.
    el.querySelectorAll(".sched-head").forEach((h) =>
      h.addEventListener("click", () => h.parentNode.classList.toggle("open")));
    el.querySelectorAll("[data-act]").forEach((b) =>
      b.addEventListener("click", () => onSchedAction(b.dataset.act, b.dataset.id)));
    if (_schedEdit) wireEditPreview();
  } catch (e) { el.innerHTML = `<span class="err">${e.message}</span>`; }
}
// One collapsible card per schedule. The card being edited renders open with
// the inline edit form in its body; all others render the read-only view.
function schedCard(t) {
  const editing = t.id === _schedEdit;
  const human = humanCron(t.cron);
  const when = human
    ? `${esc(human)}<span class="sched-raw">${esc(t.cron)}</span>`
    : `<code>${esc(t.cron)}</code>`;
  const next = t.next_fire ? new Date(t.next_fire).toLocaleString() : "—";
  const header = `<div class="sched-head">
      <span class="sched-arrow">▶</span>
      <span class="sched-id">${esc(t.id)}${t.skill ? `<span class="skill-chip">${esc(t.skill)}</span>` : ""}</span>
      <span class="sched-when">${when}</span>
      <span class="badge ${t.enabled ? "on" : "off"}">${t.enabled ? "enabled" : "disabled"}</span>
      <span class="sched-next">next: ${esc(next)}</span>
    </div>`;
  return `<div class="sched-card${editing ? " open editing" : ""}">${header}${editing ? schedEditBody(t) : schedViewBody(t)}</div>`;
}
function schedViewBody(t) {
  return `<div class="sched-body">
    <div class="sched-meta">
      <span>last status: <b>${esc(t.last_status || "—")}</b></span>
      <span>skill: <b>${esc(t.skill || "—")}</b></span>
    </div>
    <div class="prompt-render">${md(t.prompt)}</div>
    <div class="row-actions">
      <button class="btn" data-act="edit" data-id="${esc(t.id)}">Edit</button>
      <button class="btn" data-act="toggle" data-id="${esc(t.id)}">${t.enabled ? "Disable" : "Enable"}</button>
      <button class="btn danger" data-act="delete" data-id="${esc(t.id)}">Delete</button>
    </div>
  </div>`;
}
function schedEditBody(t) {
  return `<div class="sched-body">
    <div class="edit-form">
      <label>cron <input id="esched-cron" value="${esc(t.cron)}" placeholder="cron" /></label>
      <label>skill <input id="esched-skill" value="${esc(t.skill || "")}" placeholder="skill (optional)" /></label>
      <label>prompt <textarea id="esched-prompt" rows="6" placeholder="prompt">${esc(t.prompt || "")}</textarea></label>
      <span class="sched-preview" id="esched-preview"></span>
    </div>
    <div class="row-actions">
      <button class="btn" data-act="save" data-id="${esc(t.id)}">Save</button>
      <button class="btn" data-act="cancel" data-id="${esc(t.id)}">Cancel</button>
    </div>
  </div>`;
}
async function onSchedAction(act, id) {
  const errAt = (msg) => alert(msg);
  try {
    if (act === "edit") { _schedEdit = id; await loadSchedules(); return; }  // loadSchedules wires the preview
    if (act === "cancel") { _schedEdit = null; await loadSchedules(); return; }
    if (act === "toggle") { await apiSend("POST", `/api/schedules/${encodeURIComponent(id)}/toggle`); await loadSchedules(); return; }
    if (act === "delete") {
      if (!confirm(`Delete schedule '${id}'?`)) return;
      await apiSend("DELETE", `/api/schedules/${encodeURIComponent(id)}`);
      await loadSchedules(); return;
    }
    if (act === "save") {
      const body = {
        cron: document.getElementById("esched-cron").value.trim(),
        skill: document.getElementById("esched-skill").value.trim() || null,
        prompt: document.getElementById("esched-prompt").value,
      };
      await apiSend("PUT", `/api/schedules/${encodeURIComponent(id)}`, body);
      _schedEdit = null; await loadSchedules(); return;
    }
  } catch (e) { errAt(e.message); }
}
function wireEditPreview() {
  const cron = document.getElementById("esched-cron");
  const prev = document.getElementById("esched-preview");
  if (!cron || !prev) return;
  const upd = () => { const p = previewText(cron.value); prev.textContent = p.text; prev.classList.toggle("bad", p.bad); };
  cron.addEventListener("input", upd); upd();
}

// New-schedule form wiring.
const nschedCron = document.getElementById("nsched-cron");
const nschedPreview = document.getElementById("nsched-preview");
nschedCron.addEventListener("input", () => {
  const p = previewText(nschedCron.value);
  nschedPreview.textContent = p.text;
  nschedPreview.classList.toggle("bad", p.bad);
});
document.getElementById("nsched-create").addEventListener("click", async () => {
  const errEl = document.getElementById("nsched-err");
  errEl.textContent = "";
  const body = {
    id: document.getElementById("nsched-id").value.trim(),
    cron: nschedCron.value.trim(),
    skill: document.getElementById("nsched-skill").value.trim() || null,
    prompt: document.getElementById("nsched-prompt").value,
  };
  try {
    await apiSend("POST", "/api/schedules", body);
    document.getElementById("nsched-id").value = "";
    nschedCron.value = ""; nschedPreview.textContent = "";
    document.getElementById("nsched-skill").value = "";
    document.getElementById("nsched-prompt").value = "";
    await loadSchedules();
  } catch (e) { errEl.textContent = e.message; }
});

// === Chat (shared module over the same wire protocol as the portal) ===
function wsUrl() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const t = TOKEN ? `?token=${encodeURIComponent(TOKEN)}` : "";
  return `${proto}//${location.host}/ws/browser${t}`;
}
let chat;
function setPersonaTag(persona) {
  const el = document.getElementById("persona-tag");
  if (!el) return;
  if (persona) {
    el.textContent = persona;
    el.style.display = "inline-block";
  } else {
    el.textContent = "";
    el.style.display = "none";
  }
}

const conn = createConnection({
  url: wsUrl,
  onFrame: (msg) => {
    // The header (persona/model) is the page's concern, not the chat pane's.
    if (msg && msg.type === "meta") { setPersonaTag(msg.persona); return; }
    chat && chat.handleFrame(msg);
  },
  onStatus: (state) => chat && chat.setStatus(state),
  onOpen: () => chat && chat.bootstrap(),
});
chat = createChat({
  container: document.getElementById("chat-root"),
  connection: conn,
  getSessionId: () => activeSessionId,
  features: { attachments: true, skills: true, theme: true, emptyState: true },
  hooks: {
    // Socket just opened — pull the conversation list for the sidebar.
    onSocketOpen: () => requestConversations(),
    // chat.js routes frames for other sessions here; we only care about the
    // conversation list snapshot.
    onUnhandledFrame: (msg) => {
      if (msg && msg.type === "conversations_snapshot") {
        conversations = msg.conversations || [];
        renderConversations();
      }
    },
    // A turn just finished — re-pull so a brand-new conversation joins the
    // list (and titles/timestamps refresh) after its first reply.
    onTurnFinal: () => requestConversations(),
  },
});

// === Conversation sidebar ===
function requestConversations() {
  conn.send({ command: "conversations_request", session_id: activeSessionId });
}

function relativeTime(iso) {
  if (!iso) return "";
  const then = new Date(iso).getTime();
  if (isNaN(then)) return "";
  const s = Math.max(0, (Date.now() - then) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 7) return d + "d ago";
  return new Date(iso).toLocaleDateString();
}

function renderConversations() {
  conversationListEl.innerHTML = "";
  if (!conversations.length) {
    const empty = document.createElement("div");
    empty.className = "conv-empty";
    empty.textContent = "No conversations yet.";
    conversationListEl.appendChild(empty);
    return;
  }
  for (const c of conversations) {
    const row = document.createElement("div");
    row.className = "conv-row" + (c.session_id === activeSessionId ? " active" : "");
    row.innerHTML =
      '<div class="conv-title"></div>' +
      '<div class="conv-meta"><span class="conv-channel"></span><span class="conv-time"></span></div>' +
      '<button class="conv-del" title="Delete conversation" aria-label="Delete conversation">✕</button>';
    row.querySelector(".conv-title").textContent = c.title || "New conversation";
    row.querySelector(".conv-channel").textContent = c.channel || "—";
    row.querySelector(".conv-time").textContent = relativeTime(c.updated_at);
    row.addEventListener("click", () => switchConversation(c.session_id));
    row.querySelector(".conv-del").addEventListener("click", (e) => {
      e.stopPropagation();
      deleteConversation(c.session_id);
    });
    conversationListEl.appendChild(row);
  }
}

function switchConversation(id) {
  if (id === activeSessionId) return;
  activeSessionId = id;
  localStorage.setItem(SESSION_KEY, activeSessionId);
  // rebind() clears the pane and re-bootstraps (history + skills) for the
  // session getSessionId() now returns.
  chat.rebind();
  renderConversations();
}

function startNew() {
  // Mint a fresh id — no `clear`, so the prior conversation is kept and stays
  // in the sidebar. It joins the list once its first turn completes.
  activeSessionId = uuid();
  localStorage.setItem(SESSION_KEY, activeSessionId);
  chat.rebind();
  renderConversations();
}

function deleteConversation(id) {
  if (!confirm("Delete this conversation?")) return;
  // `clear` is the server-side delete: it extracts the conversation into
  // memory, then removes the transcript (parity with the portal).
  conn.send({ content: "", command: "clear", session_id: id });
  conversations = conversations.filter((c) => c.session_id !== id);
  renderConversations();
  // Deleting the conversation you're in drops you into a fresh one.
  if (id === activeSessionId) startNew();
}

document.getElementById("conv-new").addEventListener("click", startNew);
</script>
