name: Build and publish images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  audit:
    name: Audit dependencies (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: curunir
            file: requirements.txt
          - name: portal
            file: portal/requirements.lock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-audit queries PyPI's advisory feed + OSV for every pinned version.
      # Both files are fully pinned, so --no-deps audits exactly what ships
      # rather than re-resolving. Non-zero exit on any advisory gates the
      # build below — an image with a known-vulnerable dependency does not
      # reach GHCR. Raise the CVE floor in requirements.in / portal/pyproject.toml
      # and recompile to clear a finding; never pin around it in the lockfile.
      - name: pip-audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --strict --no-deps -r "${{ matrix.file }}"

  build:
    name: Build ${{ matrix.name }}
    needs: audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: curunir
            context: .
            image: ghcr.io/jalemieux/curunir
          - name: portal
            context: ./portal
            image: ghcr.io/jalemieux/curunir-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
