name: Refresh portal requirements.lock

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate lockfile
        run: uv pip compile portal/pyproject.toml -o portal/requirements.lock --generate-hashes

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(portal): refresh requirements.lock"
          title: "chore(portal): refresh requirements.lock"
          body: |
            Weekly automated refresh of `portal/requirements.lock` via `uv pip compile`.

            Review the diff for upstream version changes — particularly any of the
            CVE-tracked floors (`h11`, `python-multipart`, `starlette`) regressing.
          branch: chore/refresh-portal-lock
          delete-branch: true
          add-paths: portal/requirements.lock
