# Local-development override.
#
# Usage (full stack — agent + portal + postgres):
#   docker compose --profile portal -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Usage (agent only, no portal):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build curunir
#
# The portal/postgres services are gated behind the `portal` profile in the
# root compose file, so `--profile portal` is required whenever you want the
# browser UI. Without it, curunir starts but its PortalChannel will log
# "Name or service not known" while retrying because the portal hostname
# never resolves.
#
# Adds `build:` for both services so contributors can iterate locally without
# pulling from GHCR. When both `image:` and `build:` are set, compose builds
# the image locally and tags it with the `image:` name — `up --build` will
# always rebuild from source. Re-adds the ./portal bind mount and uvicorn
# --reload so portal code edits hot-reload during development.
#
# WebSocket pairing token
# -----------------------
# The container generates a random token at /app/context/.ws-token on
# startup. Because docker-compose.yml bind-mounts ./context into the
# container, that file appears on the host as ./context/.ws-token, and
# cli.py reads it automatically when launched from the repo root.
#
# If you run cli.py from a different directory (or juggle multiple
# checkouts and don't want to think about which one is mounted), export
# the token in your shell once per session:
#
#   export CURUNIR_WS_TOKEN="$(cat ./context/.ws-token)"
#
# CURUNIR_WS_TOKEN takes precedence over the file lookup in cli.py.
services:
  portal:
    build: ./portal
    volumes:
      - ./portal:/app/portal
    command: uvicorn portal.app:app --host 0.0.0.0 --port 8000 --reload

  curunir:
    build: .
